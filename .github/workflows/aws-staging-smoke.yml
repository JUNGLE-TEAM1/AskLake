name: AWS Staging Smoke

on:
  workflow_dispatch:
    inputs:
      stack_id:
        description: "apply와 artifact 전달이 끝난 staging stack ID"
        required: true
        type: string
      runtime_root_uri:
        description: "artifact workflow receipt의 immutable runtimeRootUri"
        required: true
        type: string
      smoke_bundle_sha256:
        description: "artifact workflow delivery receipt의 smokeBundleSha256"
        required: true
        type: string
      confirmation:
        description: "smoke:<stack_id>"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: asklake-aws-staging-${{ inputs.stack_id }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  smoke:
    name: Approved private Phase 4 smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    environment: asklake-aws-staging-smoke
    permissions:
      contents: read
      id-token: write
    outputs:
      stack_confirmed: ${{ steps.verified_target.outputs.stack_confirmed }}

    env:
      SMOKE_EVIDENCE_AVAILABLE: "false"
      SMOKE_EXECUTION_STARTED: "false"
      SMOKE_COMMAND_STATUS: not-started

    steps:
      - name: Checkout exact workflow commit
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.23.1"
          package-manager-cache: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --ignore-scripts

      - name: Validate Phase 4 plan and confirmation
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_GITHUB_OIDC_ROLE_ARN: ${{ vars.AWS_GITHUB_OIDC_ROLE_ARN }}
          AWS_STAGING_CONFIRMATION: ${{ inputs.confirmation }}
          AWS_STAGING_OPERATION: smoke
          AWS_STAGING_RUNTIME_ROOT_URI: ${{ inputs.runtime_root_uri }}
          AWS_STAGING_SMOKE_BUNDLE_SHA256: ${{ inputs.smoke_bundle_sha256 }}
          AWS_STAGING_STACK_ID: ${{ inputs.stack_id }}
          AWS_STAGING_TTL_HOURS: "1"
          AWS_TERRAFORM_STATE_BUCKET: ${{ vars.AWS_TERRAFORM_STATE_BUCKET }}
          AWS_TERRAFORM_STATE_KMS_KEY_ARN: ${{ vars.AWS_TERRAFORM_STATE_KMS_KEY_ARN }}
        run: |
          set -euo pipefail
          node backend/scripts/prepare-aws-staging-terraform-inputs.mjs \
            --backend-file "$RUNNER_TEMP/backend.hcl" \
            --tfvars-file "$RUNNER_TEMP/staging.tfvars.json"
          node backend/scripts/evaluate-aws-staging-smoke.mjs \
            --plan \
            --stack-id "$AWS_STAGING_STACK_ID" \
            --source-revision "$GITHUB_SHA" \
            --smoke-bundle-sha256 "$AWS_STAGING_SMOKE_BUNDLE_SHA256" \
            --runtime-root-uri "$AWS_STAGING_RUNTIME_ROOT_URI" \
            > "$RUNNER_TEMP/smoke-plan.json"

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_OIDC_ROLE_ARN }}
          role-session-name: asklake-staging-smoke-${{ github.run_id }}
          aws-region: ap-northeast-2
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
          unset-current-credentials: true

      - name: Verify account, state, and private runner
        id: verified_target
        env:
          EXPECTED_AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          RUNTIME_ROOT_URI: ${{ inputs.runtime_root_uri }}
          SMOKE_BUNDLE_SHA256: ${{ inputs.smoke_bundle_sha256 }}
          STACK_ID: ${{ inputs.stack_id }}
        run: |
          set -euo pipefail
          actual_account_id="$(aws sts get-caller-identity --query Account --output text)"
          test "$actual_account_id" = "$EXPECTED_AWS_ACCOUNT_ID"
          terraform -chdir=infra/terraform/environments/staging init \
            -reconfigure \
            -backend-config="$RUNNER_TEMP/backend.hcl"
          terraform -chdir=infra/terraform/environments/staging output -json > "$RUNNER_TEMP/terraform-output.json"
          node -e 'const fs=require("fs"); const o=JSON.parse(fs.readFileSync(process.argv[1])); const i=o.infrastructure_contract?.value; const instance=o.smoke_runner_instance_id?.value; const root=process.env.RUNTIME_ROOT_URI; if (!i || i.stack_id!==process.env.STACK_ID || i.smoke_runner_enabled!==true || !/^i-[0-9a-f]{8,17}$/.test(String(instance||""))) process.exit(1); const expected=`s3://${i.bucket_names.artifact}/emr-serverless/runtime/`; if (!root.startsWith(expected) || root.includes("..")) process.exit(1); fs.writeFileSync(process.argv[2], `${instance}\n${i.bucket_names.artifact}\n`)' \
            "$RUNNER_TEMP/terraform-output.json" "$RUNNER_TEMP/smoke-target.txt"
          smoke_runner_instance_id="$(sed -n '1p' "$RUNNER_TEMP/smoke-target.txt")"
          artifact_bucket="$(sed -n '2p' "$RUNNER_TEMP/smoke-target.txt")"
          test -n "$smoke_runner_instance_id"
          test -n "$artifact_bucket"
          printf 'SMOKE_RUNNER_INSTANCE_ID=%s\nARTIFACT_BUCKET=%s\n' "$smoke_runner_instance_id" "$artifact_bucket" >> "$GITHUB_ENV"
          printf 'stack_confirmed=true\n' >> "$GITHUB_OUTPUT"

      - name: Verify immutable artifact delivery
        env:
          RUNTIME_ROOT_URI: ${{ inputs.runtime_root_uri }}
        run: |
          set -euo pipefail
          runtime_key="${RUNTIME_ROOT_URI#s3://$artifact_bucket/}"
          aws s3api head-object --bucket "$artifact_bucket" --key "$runtime_key/asklake-runtime.env" > /dev/null
          aws s3api head-object --bucket "$artifact_bucket" --key "$runtime_key/asklake-smoke-bundle.tgz" > /dev/null
          aws s3api head-object --bucket "$artifact_bucket" --key "$runtime_key/smoke-bundle.json" > /dev/null

      - name: Capture current Seoul EMR price snapshot
        env:
          RUNTIME_ROOT_URI: ${{ inputs.runtime_root_uri }}
        run: |
          set -euo pipefail
          evidence_root="$RUNTIME_ROOT_URI/evidence/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          price_uri="$evidence_root/emr-price-snapshot.json"
          aws pricing get-products \
            --service-code AmazonEMR \
            --region us-east-1 \
            --filters Type=TERM_MATCH,Field=location,Value='Asia Pacific (Seoul)' \
            --max-results 100 \
            --output json \
            > "$RUNNER_TEMP/emr-price-snapshot.json"
          test "$(node -e 'const p=require(process.argv[1]); process.stdout.write(String(p.PriceList?.length||0))' "$RUNNER_TEMP/emr-price-snapshot.json")" -gt 0
          aws s3 cp "$RUNNER_TEMP/emr-price-snapshot.json" "$price_uri" --only-show-errors --content-type application/json
          printf 'EVIDENCE_ROOT_URI=%s\nPRICE_SNAPSHOT_URI=%s\n' "$evidence_root" "$price_uri" >> "$GITHUB_ENV"

      - name: Run S3, MSK, Batch, and pause-resume smoke through private SSM
        env:
          RUNTIME_ROOT_URI: ${{ inputs.runtime_root_uri }}
          SMOKE_BUNDLE_SHA256: ${{ inputs.smoke_bundle_sha256 }}
          STACK_ID: ${{ inputs.stack_id }}
        run: |
          set -euo pipefail
          evidence_uri="$EVIDENCE_ROOT_URI/smoke-evidence.json"
          export EVIDENCE_URI="$evidence_uri"
          node - <<'NODE'
          const fs = require("fs");
          const q = (value) => `'${String(value).replaceAll("'", "'\"'\"'")}'`;
          const root = process.env.RUNTIME_ROOT_URI;
          const commands = [
            "set -eu",
            "umask 077",
            "rm -rf /opt/asklake-smoke/work",
            "install -d -m 0700 /opt/asklake-smoke/work",
            `aws s3 cp ${q(`${root}/asklake-smoke-bundle.tgz`)} /opt/asklake-smoke/work/bundle.tgz --only-show-errors`,
            `aws s3 cp ${q(`${root}/smoke-bundle.json`)} /opt/asklake-smoke/work/smoke-bundle.json --only-show-errors`,
            `aws s3 cp ${q(`${root}/asklake-runtime.env`)} /opt/asklake-smoke/work/runtime.env --only-show-errors`,
            "expected=$(node -e 'const p=require(\"/opt/asklake-smoke/work/smoke-bundle.json\"); process.stdout.write(p.sha256)')",
            "source_revision=$(node -e 'const p=require(\"/opt/asklake-smoke/work/smoke-bundle.json\"); process.stdout.write(p.sourceRevision)')",
            "actual=$(sha256sum /opt/asklake-smoke/work/bundle.tgz | awk '{print $1}')",
            `test \"$source_revision\" = ${q(process.env.GITHUB_SHA)}`,
            `test \"$expected\" = ${q(process.env.SMOKE_BUNDLE_SHA256)}`,
            `test \"$actual\" = ${q(process.env.SMOKE_BUNDLE_SHA256)}`,
            "tar -C /opt/asklake-smoke/work -xzf /opt/asklake-smoke/work/bundle.tgz",
            "chmod 0600 /opt/asklake-smoke/work/runtime.env",
            "set -a",
            ". /opt/asklake-smoke/work/runtime.env",
            "set +a",
            `export APP_ENV=production ASKLAKE_AWS_STAGING_STACK_ID=${q(process.env.STACK_ID)}`,
            `export ASKLAKE_AWS_STAGING_SOURCE_REVISION=${q(process.env.GITHUB_SHA)}`,
            `export ASKLAKE_AWS_STAGING_RUNTIME_ROOT_URI=${q(root)}`,
            `export ASKLAKE_AWS_STAGING_EVIDENCE_URI=${q(process.env.EVIDENCE_URI)}`,
            `export ASKLAKE_AWS_STAGING_PRICE_SNAPSHOT_URI=${q(process.env.PRICE_SNAPSHOT_URI)}`,
            `export ASKLAKE_AWS_STAGING_SMOKE_BUNDLE_SHA256=${q(process.env.SMOKE_BUNDLE_SHA256)}`,
            "cd /opt/asklake-smoke/work/backend",
            "node scripts/run-aws-staging-smoke.mjs",
          ];
          fs.writeFileSync(process.env.RUNNER_TEMP + "/ssm-parameters.json", JSON.stringify({ commands }));
          NODE
          command_id="$(aws ssm send-command \
            --instance-ids "$SMOKE_RUNNER_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "AskLake Phase 4 ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --parameters "file://$RUNNER_TEMP/ssm-parameters.json" \
            --timeout-seconds 7200 \
            --query 'Command.CommandId' \
            --output text)"
          test -n "$command_id"
          printf 'SMOKE_EXECUTION_STARTED=true\n' >> "$GITHUB_ENV"
          deadline=$((SECONDS + 7200))
          while [ "$SECONDS" -lt "$deadline" ]; do
            status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$SMOKE_RUNNER_INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
            case "$status" in
              Success) break ;;
              Failed|Cancelled|TimedOut|Undeliverable|Terminated) break ;;
            esac
            sleep 10
          done
          printf 'SMOKE_COMMAND_STATUS=%s\n' "$status" >> "$GITHUB_ENV"
          if aws s3 cp "$evidence_uri" "$RUNNER_TEMP/smoke-evidence.json" --only-show-errors; then
            printf 'SMOKE_EVIDENCE_AVAILABLE=true\n' >> "$GITHUB_ENV"
          else
            printf 'SMOKE_EVIDENCE_AVAILABLE=false\n' >> "$GITHUB_ENV"
          fi
          if [ "$status" = "Success" ]; then
            test -f "$RUNNER_TEMP/smoke-evidence.json"
          fi

      - name: Evaluate and upload redacted smoke evidence
        if: always() && env.SMOKE_EVIDENCE_AVAILABLE == 'true'
        run: |
          set -euo pipefail
          if [ "$SMOKE_COMMAND_STATUS" = "Success" ]; then
            node backend/scripts/evaluate-aws-staging-smoke.mjs \
              --evidence-file "$RUNNER_TEMP/smoke-evidence.json" \
              > "$RUNNER_TEMP/smoke-evaluation.txt"
          else
            node backend/scripts/evaluate-aws-staging-smoke.mjs \
              --failure-evidence-file "$RUNNER_TEMP/smoke-evidence.json" \
              > "$RUNNER_TEMP/smoke-evaluation.txt"
          fi

      - name: Write redacted smoke completion receipt
        if: always()
        env:
          SMOKE_JOB_STATUS: ${{ job.status }}
          STACK_ID: ${{ inputs.stack_id }}
        run: |
          set -euo pipefail
          node -e 'const fs=require("fs"); fs.writeFileSync(process.argv[1], JSON.stringify({schemaVersion:"asklake.aws-staging-smoke-run.v1", commit:process.env.GITHUB_SHA, stackId:process.env.STACK_ID, executionStarted:process.env.SMOKE_EXECUTION_STARTED === "true", commandStatus:process.env.SMOKE_COMMAND_STATUS, evidenceAvailable:process.env.SMOKE_EVIDENCE_AVAILABLE === "true", status:process.env.SMOKE_JOB_STATUS}, null, 2)+"\n")' \
            "$RUNNER_TEMP/smoke-completion-receipt.json"

      - name: Upload Phase 4 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aws-staging-smoke-${{ inputs.stack_id }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/smoke-evidence.json
            ${{ runner.temp }}/smoke-evaluation.txt
            ${{ runner.temp }}/smoke-plan.json
            ${{ runner.temp }}/smoke-completion-receipt.json
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false

      - name: Mark failed smoke after cleanup
        if: always() && env.SMOKE_EXECUTION_STARTED == 'true'
        run: |
          test "$SMOKE_COMMAND_STATUS" = "Success"

      - name: Remove private smoke inputs
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/backend.hcl" "$RUNNER_TEMP/staging.tfvars.json" "$RUNNER_TEMP/terraform-output.json"
          rm -f "$RUNNER_TEMP/smoke-target.txt"
          rm -f "$RUNNER_TEMP/ssm-parameters.json" "$RUNNER_TEMP/emr-price-snapshot.json"

  cleanup_plan:
    name: Review smoke cleanup plan
    needs: smoke
    if: always() && needs.smoke.outputs.stack_confirmed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    outputs:
      plan_fingerprint: ${{ steps.plan.outputs.plan_fingerprint }}

    steps:
      - name: Checkout exact workflow commit
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.23.1"
          package-manager-cache: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_OIDC_ROLE_ARN }}
          role-session-name: asklake-staging-smoke-cleanup-${{ github.run_id }}
          aws-region: ap-northeast-2
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
          unset-current-credentials: true

      - name: Verify AWS account
        env:
          EXPECTED_AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          actual_account_id="$(aws sts get-caller-identity --query Account --output text)"
          test "$actual_account_id" = "$EXPECTED_AWS_ACCOUNT_ID"

      - name: Recreate exact cleanup inputs
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_GITHUB_OIDC_ROLE_ARN: ${{ vars.AWS_GITHUB_OIDC_ROLE_ARN }}
          AWS_STAGING_CONFIRMATION: destroy:${{ inputs.stack_id }}
          AWS_STAGING_OPERATION: destroy
          AWS_STAGING_STACK_ID: ${{ inputs.stack_id }}
          AWS_STAGING_TTL_HOURS: "1"
          AWS_TERRAFORM_STATE_BUCKET: ${{ vars.AWS_TERRAFORM_STATE_BUCKET }}
          AWS_TERRAFORM_STATE_KMS_KEY_ARN: ${{ vars.AWS_TERRAFORM_STATE_KMS_KEY_ARN }}
        run: |
          set -euo pipefail
          node backend/scripts/prepare-aws-staging-terraform-inputs.mjs \
            --backend-file "$RUNNER_TEMP/backend.hcl" \
            --tfvars-file "$RUNNER_TEMP/staging.tfvars.json"

      - name: Create reviewable smoke cleanup plan
        id: plan
        env:
          SMOKE_RESULT: ${{ needs.smoke.result }}
          STACK_ID: ${{ inputs.stack_id }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/smoke-cleanup-evidence"
          terraform -chdir=infra/terraform/environments/staging init \
            -reconfigure \
            -backend-config="$RUNNER_TEMP/backend.hcl"
          terraform -chdir=infra/terraform/environments/staging plan \
            -destroy \
            -input=false \
            -lock-timeout=5m \
            -var-file="$RUNNER_TEMP/staging.tfvars.json" \
            -out="$RUNNER_TEMP/smoke-cleanup.tfplan"
          terraform -chdir=infra/terraform/environments/staging show \
            -no-color "$RUNNER_TEMP/smoke-cleanup.tfplan" \
            > "$RUNNER_TEMP/smoke-cleanup-evidence/plan.txt"
          plan_fingerprint="$(terraform -chdir=infra/terraform/environments/staging show -json "$RUNNER_TEMP/smoke-cleanup.tfplan" \
            | node backend/scripts/fingerprint-terraform-plan.mjs)"
          test "${#plan_fingerprint}" -eq 64
          export PLAN_FINGERPRINT="$plan_fingerprint"
          printf 'plan_fingerprint=%s\n' "$plan_fingerprint" >> "$GITHUB_OUTPUT"
          node -e 'const fs=require("fs"); fs.writeFileSync(process.argv[1], JSON.stringify({schemaVersion:"asklake.aws-staging-smoke-cleanup-plan.v1", commit:process.env.GITHUB_SHA, stackId:process.env.STACK_ID, planFingerprint:process.env.PLAN_FINGERPRINT, smokeResult:process.env.SMOKE_RESULT}, null, 2)+"\n")' \
            "$RUNNER_TEMP/smoke-cleanup-evidence/metadata.json"

      - name: Upload reviewable smoke cleanup plan
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aws-staging-smoke-cleanup-plan-${{ inputs.stack_id }}-${{ github.run_id }}
          path: ${{ runner.temp }}/smoke-cleanup-evidence/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false

      - name: Remove private cleanup plan inputs
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/smoke-cleanup-evidence"
          rm -f "$RUNNER_TEMP/backend.hcl" "$RUNNER_TEMP/staging.tfvars.json" "$RUNNER_TEMP/smoke-cleanup.tfplan"

  cleanup_apply:
    name: Approved smoke cleanup
    needs: cleanup_plan
    if: always() && needs.cleanup_plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: asklake-aws-staging-destroy
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout exact workflow commit
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.23.1"
          package-manager-cache: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_OIDC_ROLE_ARN }}
          role-session-name: asklake-staging-smoke-cleanup-apply-${{ github.run_id }}
          aws-region: ap-northeast-2
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
          unset-current-credentials: true

      - name: Verify AWS account
        env:
          EXPECTED_AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          actual_account_id="$(aws sts get-caller-identity --query Account --output text)"
          test "$actual_account_id" = "$EXPECTED_AWS_ACCOUNT_ID"

      - name: Recreate exact cleanup inputs
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_GITHUB_OIDC_ROLE_ARN: ${{ vars.AWS_GITHUB_OIDC_ROLE_ARN }}
          AWS_STAGING_CONFIRMATION: destroy:${{ inputs.stack_id }}
          AWS_STAGING_OPERATION: destroy
          AWS_STAGING_STACK_ID: ${{ inputs.stack_id }}
          AWS_STAGING_TTL_HOURS: "1"
          AWS_TERRAFORM_STATE_BUCKET: ${{ vars.AWS_TERRAFORM_STATE_BUCKET }}
          AWS_TERRAFORM_STATE_KMS_KEY_ARN: ${{ vars.AWS_TERRAFORM_STATE_KMS_KEY_ARN }}
        run: |
          set -euo pipefail
          node backend/scripts/prepare-aws-staging-terraform-inputs.mjs \
            --backend-file "$RUNNER_TEMP/backend.hcl" \
            --tfvars-file "$RUNNER_TEMP/staging.tfvars.json"

      - name: Replan, verify approved fingerprint, and destroy
        env:
          APPROVED_PLAN_FINGERPRINT: ${{ needs.cleanup_plan.outputs.plan_fingerprint }}
          STACK_ID: ${{ inputs.stack_id }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/smoke-cleanup"
          terraform -chdir=infra/terraform/environments/staging init \
            -reconfigure \
            -backend-config="$RUNNER_TEMP/backend.hcl"
          terraform -chdir=infra/terraform/environments/staging plan \
            -destroy \
            -input=false \
            -lock-timeout=5m \
            -var-file="$RUNNER_TEMP/staging.tfvars.json" \
            -out="$RUNNER_TEMP/approved-smoke-cleanup.tfplan"
          actual_plan_fingerprint="$(terraform -chdir=infra/terraform/environments/staging show -json "$RUNNER_TEMP/approved-smoke-cleanup.tfplan" \
            | node backend/scripts/fingerprint-terraform-plan.mjs)"
          test "${#APPROVED_PLAN_FINGERPRINT}" -eq 64
          test "$actual_plan_fingerprint" = "$APPROVED_PLAN_FINGERPRINT"
          terraform -chdir=infra/terraform/environments/staging apply \
            -input=false \
            -lock-timeout=5m \
            -auto-approve \
            "$RUNNER_TEMP/approved-smoke-cleanup.tfplan"
          export PLAN_FINGERPRINT="$actual_plan_fingerprint"
          node -e 'const fs=require("fs"); fs.writeFileSync(process.argv[1], JSON.stringify({schemaVersion:"asklake.aws-staging-smoke-cleanup.v1", commit:process.env.GITHUB_SHA, stackId:process.env.STACK_ID, planFingerprint:process.env.PLAN_FINGERPRINT, status:"destroy-request-completed"}, null, 2)+"\n")' \
            "$RUNNER_TEMP/smoke-cleanup/receipt.json"

      - name: Upload smoke cleanup receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aws-staging-smoke-cleanup-${{ inputs.stack_id }}-${{ github.run_id }}
          path: ${{ runner.temp }}/smoke-cleanup/receipt.json
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: false

      - name: Remove private cleanup apply inputs
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/smoke-cleanup"
          rm -f "$RUNNER_TEMP/backend.hcl" "$RUNNER_TEMP/staging.tfvars.json" "$RUNNER_TEMP/approved-smoke-cleanup.tfplan"
