name: AWS Staging TTL Sweep

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: asklake-aws-staging-ttl-sweep
  cancel-in-progress: false

jobs:
  inspect:
    name: Inspect expired staging stacks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: asklake-aws-staging-ttl-sweep
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout exact workflow commit
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.23.1"
          package-manager-cache: false

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --ignore-scripts

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_OIDC_ROLE_ARN }}
          role-session-name: asklake-staging-ttl-sweep-${{ github.run_id }}
          aws-region: ap-northeast-2
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
          unset-current-credentials: true

      - name: Verify AWS account
        env:
          EXPECTED_AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          actual_account_id="$(aws sts get-caller-identity --query Account --output text)"
          test "$actual_account_id" = "$EXPECTED_AWS_ACCOUNT_ID"

      - name: Build redacted TTL sweep evidence
        env:
          AWS_TERRAFORM_STATE_BUCKET: ${{ vars.AWS_TERRAFORM_STATE_BUCKET }}
        run: |
          set -euo pipefail
          node backend/scripts/sweep-aws-staging-ttl.mjs \
            --state-bucket "$AWS_TERRAFORM_STATE_BUCKET" \
            --output-file "$RUNNER_TEMP/aws-staging-ttl-sweep.json" \
            > "$RUNNER_TEMP/aws-staging-ttl-sweep-summary.txt"

      - name: Upload TTL sweep evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aws-staging-ttl-sweep-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/aws-staging-ttl-sweep.json
            ${{ runner.temp }}/aws-staging-ttl-sweep-summary.txt
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false

      - name: Require manual destroy for expired or invalid stacks
        run: |
          set -euo pipefail
          node -e 'const p=require(process.argv[1]); if (p.summary.expiredCount > 0 || p.summary.invalidCount > 0) process.exit(1)' \
            "$RUNNER_TEMP/aws-staging-ttl-sweep.json"

      - name: Remove TTL sweep inputs
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/aws-staging-ttl-sweep.json" "$RUNNER_TEMP/aws-staging-ttl-sweep-summary.txt"
