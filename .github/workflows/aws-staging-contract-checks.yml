name: AWS Staging Contract Checks

on:
  pull_request:
    paths:
      - ".github/workflows/aws-staging-*.yml"
      - "backend/package.json"
      - "backend/package-lock.json"
      - "backend/scripts/*aws-staging*.mjs"
      - "backend/scripts/fingerprint-terraform-plan.mjs"
      - "backend/src/awsStaging*.mjs"
      - "backend/src/emrJarBundle.mjs"
      - "backend/src/terraformPlanFingerprint.mjs"
      - "infra/artifacts/**"
      - "infra/contracts/aws-staging-smoke.v1.json"
      - "infra/terraform/**"
      - "docs/aws-staging-iac-smoke-plan.md"
      - "docs/02-architecture.md"
      - "docs/04-development-guide.md"
      - "docs/system-guardrails.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aws-staging-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.23.1"
          package-manager-cache: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --ignore-scripts

      - name: Verify AWS staging without credentials
        working-directory: backend
        run: |
          set -euo pipefail
          npm run verify:aws-staging-contract
          npm run verify:aws-staging-runtime
          npm run verify:aws-staging-workflows
          npm run verify:aws-staging-smoke
          npm run verify:aws-staging-lifecycle
          npm run verify:aws-staging-terraform
