name: Realtime Quality Gates

on:
  pull_request:
    branches:
      - main
      - dev
    paths:
      - ".github/workflows/realtime-quality-gates.yml"
      - "backend/**"
      - "frontend/**"
      - "deploy/**"
      - "docker-compose.yml"
      - "scripts/verify-deploy-env.sh"
      - "tests/deploy/**"
      - "ops/ec2/**"
      - "docs/02-architecture.md"
      - "docs/01-product-planning.md"
      - "docs/03-api-reference.md"
      - "docs/04-development-guide.md"
      - "docs/ASKLAKE_CLICKHOUSE_REALTIME_IMPLEMENTATION_SPEC.md"
      - "docs/backend-integration-readiness.md"
      - "docs/api-contract.md"
      - "docs/clickhouse-realtime-v2-foundation.md"
      - "docs/system-guardrails.md"
      - "docs/realtime-2026/**"
  workflow_dispatch:
    inputs:
      run_live_iceberg:
        description: Run the Kafka/Spark/Iceberg fault and restart harness
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: read

concurrency:
  group: realtime-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  realtime-contracts:
    name: realtime-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: asklake_test
          POSTGRES_PASSWORD: asklake_test
          POSTGRES_USER: asklake
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U asklake -d asklake_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: test
      ASKLAKE_VERIFY_DASHBOARD_POSTGRES: "true"
      ASKLAKE_VERIFY_REALTIME_POSTGRES: "true"
      DASHBOARD_SYNC_MODE: sse
      DATABASE_URL: postgresql+psycopg://asklake:asklake_test@127.0.0.1:5432/asklake_test
      REALTIME_EVENTS_ENABLED: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          npm ci

      - name: Verify deterministic realtime contracts
        working-directory: backend
        run: npm run verify:realtime-stack

      - name: Verify complete ClickHouse V2 release contracts and migration lifecycle
        working-directory: backend
        env:
          ASKLAKE_FASTAPI_PYTHON: python
        run: |
          npm run verify:clickhouse-realtime-v2-release
          python -m alembic upgrade head
          python -m alembic downgrade 0011_rag_control_plane_fencing
          python -m alembic upgrade head

      - name: Verify PostgreSQL event log and NOTIFY
        working-directory: backend
        run: npm run verify:realtime-postgres

      - name: Verify PostgreSQL publication concurrency
        working-directory: backend
        run: npm run verify:dashboard-live-postgres

      - name: Verify PostgreSQL cutover fencing and idempotency
        working-directory: backend
        run: npm run verify:realtime-recovery-postgres

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify frontend realtime cache, route ownership, and production boundary
        working-directory: frontend
        run: |
          npm run verify:ui-regressions
          npm run test:dashboard-runtime
          npm run build

      - name: Render production Compose
        run: |
          docker compose --env-file deploy/.env.example -f deploy/docker-compose.prod.yml config --quiet
          docker compose --env-file deploy/.env.example -f deploy/docker-compose.prod.yml --profile clickhouse-realtime-v2 config --quiet
          docker compose --profile clickhouse-realtime-v2 config --quiet

      - name: Verify production deployment and Linux secret staging contracts
        run: bash tests/deploy/deploy-scripts-regression.sh

      - name: Validate Caddy and NGINX streaming configuration
        run: |
          docker run --rm --add-host backend:127.0.0.1 --add-host frontend:127.0.0.1 -e APP_DOMAIN=localhost -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.8-alpine caddy validate --config /etc/caddy/Caddyfile
          docker run --rm -v "$PWD/ops/ec2/nginx.asklake.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.27-alpine nginx -t

  realtime-live-e2e:
    name: realtime-live-e2e
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_live_iceberg)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Disposable CI-only credentials. Production values still come from the
      # deployment secret store and the entrypoint rejects placeholder values.
      CLICKHOUSE_V2_ADMIN_PASSWORD: ci-${{ github.run_id }}-recovery-admin
      CLICKHOUSE_V2_INGEST_PASSWORD: ci-${{ github.run_id }}-recovery-ingest
      CLICKHOUSE_V2_MATERIALIZER_PASSWORD: ci-${{ github.run_id }}-recovery-materializer
      CLICKHOUSE_V2_READER_PASSWORD: ci-${{ github.run_id }}-recovery-reader
      CLICKHOUSE_V2_MIGRATION_PASSWORD: ci-${{ github.run_id }}-recovery-migration
      CLICKHOUSE_V2_OBSERVER_PASSWORD: ci-${{ github.run_id }}-recovery-observer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install runtime verification dependencies
        working-directory: backend
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          npm ci

      - name: Start disposable PostgreSQL and MinIO
        run: |
          docker compose up -d --wait postgres minio
          docker compose run --rm trino-storage-bootstrap
          docker compose run --rm trino-postgres-bootstrap

      - name: Start ClickHouse V2 and verify live hot/archive boundary parity
        run: |
          docker compose --profile clickhouse-realtime-v2 up -d --wait clickhouse-v2
          cd backend
          ASKLAKE_VERIFY_CLICKHOUSE_RECOVERY=true \
          CLICKHOUSE_URL=http://127.0.0.1:18123 \
          CLICKHOUSE_USER=asklake_v2_admin \
          CLICKHOUSE_PASSWORD="$CLICKHOUSE_V2_ADMIN_PASSWORD" \
          CLICKHOUSE_DATABASE=asklake_realtime_v2 \
          npm run verify:clickhouse-realtime-v2-recovery-live

      - name: Build pinned Spark runtime
        run: docker build --target spark-runtime -t asklake-spark:4.0.1 backend

      - name: Run Kafka Spark Iceberg fault and restart harness
        working-directory: backend
        env:
          ASKLAKE_VERIFY_ICEBERG_LIVE: "true"
        run: python scripts/verify-kafka-continuous-iceberg.py

      - name: Collect container diagnostics
        if: failure()
        run: |
          docker ps -a
          docker compose logs --no-color --tail=200 postgres minio

      - name: Clean disposable runtime
        if: always()
        run: |
          docker ps -aq --filter name=asklake-phase4 | xargs -r docker rm -f
          docker compose down -v --remove-orphans
