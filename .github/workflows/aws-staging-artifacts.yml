name: AWS Staging Artifacts

on:
  workflow_dispatch:
    inputs:
      stack_id:
        description: "apply가 끝난 staging stack ID"
        required: true
        type: string
      confirmation:
        description: "artifacts:<stack_id>"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: asklake-aws-staging-${{ inputs.stack_id }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  upload:
    name: Upload checksum-pinned Runtime bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: asklake-aws-staging-artifacts
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout exact workflow commit
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.23.1"
          package-manager-cache: false

      - name: Setup Java for dependency materialization
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: infra/artifacts/emr-continuous-dependencies.pom.xml

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --ignore-scripts

      - name: Verify workflow and Runtime contracts
        working-directory: backend
        run: |
          set -euo pipefail
          npm run verify:aws-staging-runtime
          npm run verify:aws-staging-workflows
          npm run verify:emr-serverless-continuous-contract

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_OIDC_ROLE_ARN }}
          role-session-name: asklake-staging-artifacts-${{ github.run_id }}
          aws-region: ap-northeast-2
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
          unset-current-credentials: true

      - name: Verify AWS account
        env:
          EXPECTED_AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          actual_account_id="$(aws sts get-caller-identity --query Account --output text)"
          test "$actual_account_id" = "$EXPECTED_AWS_ACCOUNT_ID"

      - name: Prepare backend and validate confirmation
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_GITHUB_OIDC_ROLE_ARN: ${{ vars.AWS_GITHUB_OIDC_ROLE_ARN }}
          AWS_STAGING_CONFIRMATION: ${{ inputs.confirmation }}
          AWS_STAGING_ENABLE_SMOKE_RUNNER: "false"
          AWS_STAGING_OPERATION: artifacts
          AWS_STAGING_STACK_ID: ${{ inputs.stack_id }}
          AWS_STAGING_TTL_HOURS: "1"
          AWS_TERRAFORM_STATE_BUCKET: ${{ vars.AWS_TERRAFORM_STATE_BUCKET }}
          AWS_TERRAFORM_STATE_KMS_KEY_ARN: ${{ vars.AWS_TERRAFORM_STATE_KMS_KEY_ARN }}
        run: |
          set -euo pipefail
          node backend/scripts/prepare-aws-staging-terraform-inputs.mjs \
            --backend-file "$RUNNER_TEMP/backend.hcl" \
            --tfvars-file "$RUNNER_TEMP/staging.tfvars.json"

      - name: Render private Runtime configuration from state
        run: |
          set -euo pipefail
          terraform -chdir=infra/terraform/environments/staging init \
            -reconfigure \
            -backend-config="$RUNNER_TEMP/backend.hcl"
          terraform -chdir=infra/terraform/environments/staging output -json \
            | node backend/scripts/render-aws-staging-runtime.mjs \
                --output-dir "$RUNNER_TEMP/runtime"

      - name: Materialize pinned Maven dependencies
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/jars"
          mvn -B -ntp \
            -f infra/artifacts/emr-continuous-dependencies.pom.xml \
            org.apache.maven.plugins:maven-dependency-plugin:3.8.1:copy-dependencies \
            -DincludeScope=runtime \
            -DoutputDirectory="$RUNNER_TEMP/jars" \
            -DoverWriteReleases=false \
            -DoverWriteSnapshots=false

      - name: Upload immutable JAR bundle and activate Continuous config
        env:
          STACK_ID: ${{ inputs.stack_id }}
        run: |
          set -euo pipefail
          runtime_env="$RUNNER_TEMP/runtime/${STACK_ID}.env"
          runtime_manifest="$RUNNER_TEMP/runtime/${STACK_ID}.manifest.json"
          set -a
          . "$runtime_env"
          set +a
          node backend/scripts/upload-emr-continuous-jars.mjs \
            --directory "$RUNNER_TEMP/jars" \
            --result-file "$RUNNER_TEMP/runtime/jar-bundle.json"
          node backend/scripts/activate-aws-staging-runtime.mjs \
            --env-file "$runtime_env" \
            --runtime-manifest "$runtime_manifest" \
            --jar-manifest "$RUNNER_TEMP/runtime/jar-bundle.json"
          set -a
          . "$runtime_env"
          set +a
          npm --prefix backend run emr:upload-artifact
          npm --prefix backend run emr:upload-continuous-artifact

      - name: Deliver private Runtime env to encrypted staging S3
        env:
          STACK_ID: ${{ inputs.stack_id }}
        run: |
          set -euo pipefail
          runtime_env="$RUNNER_TEMP/runtime/${STACK_ID}.env"
          runtime_manifest="$RUNNER_TEMP/runtime/${STACK_ID}.manifest.json"
          set -a
          . "$runtime_env"
          set +a
          runtime_root="${ASKLAKE_EMR_SERVERLESS_ARTIFACT_URI}/runtime/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export RUNTIME_ROOT="$runtime_root"
          bundle_root="$RUNNER_TEMP/smoke-bundle"
          mkdir -p "$bundle_root/backend"
          cp backend/package.json backend/package-lock.json "$bundle_root/backend/"
          cp -R backend/src backend/scripts backend/node_modules "$bundle_root/backend/"
          tar -C "$bundle_root" -czf "$RUNNER_TEMP/runtime/asklake-smoke-bundle.tgz" backend
          bundle_sha256="$(sha256sum "$RUNNER_TEMP/runtime/asklake-smoke-bundle.tgz" | awk '{print $1}')"
          bundle_size="$(stat -c '%s' "$RUNNER_TEMP/runtime/asklake-smoke-bundle.tgz")"
          export BUNDLE_SHA256="$bundle_sha256" BUNDLE_SIZE="$bundle_size"
          node -e 'const fs=require("fs"); fs.writeFileSync(process.argv[1], JSON.stringify({schemaVersion:"asklake.aws-staging-smoke-bundle.v1", sourceRevision:process.env.GITHUB_SHA, sha256:process.env.BUNDLE_SHA256, sizeBytes:Number(process.env.BUNDLE_SIZE)}, null, 2)+"\n")' \
            "$RUNNER_TEMP/runtime/smoke-bundle.json"
          aws s3 cp "$runtime_env" "$runtime_root/asklake-runtime.env" --only-show-errors --content-type text/plain
          aws s3 cp "$runtime_manifest" "$runtime_root/runtime-manifest.json" --only-show-errors --content-type application/json
          aws s3 cp "$RUNNER_TEMP/runtime/jar-bundle.json" "$runtime_root/jar-bundle.json" --only-show-errors --content-type application/json
          aws s3 cp "$RUNNER_TEMP/runtime/asklake-smoke-bundle.tgz" "$runtime_root/asklake-smoke-bundle.tgz" --only-show-errors --content-type application/gzip
          aws s3 cp "$RUNNER_TEMP/runtime/smoke-bundle.json" "$runtime_root/smoke-bundle.json" --only-show-errors --content-type application/json
          node -e 'const fs=require("fs"); const jar=JSON.parse(fs.readFileSync(process.argv[1])); fs.writeFileSync(process.argv[2], JSON.stringify({schemaVersion:"asklake.aws-staging-artifact-delivery.v1", commit:process.env.GITHUB_SHA, stackId:process.env.STACK_ID, runtimeRootUri:process.env.RUNTIME_ROOT, bundleSha256:jar.bundleSha256, jarCount:jar.jarCount, smokeBundleSha256:process.env.BUNDLE_SHA256}, null, 2)+"\n")' \
            "$RUNNER_TEMP/runtime/jar-bundle.json" \
            "$RUNNER_TEMP/runtime/delivery-receipt.json"

      - name: Upload redacted artifact evidence only
        uses: actions/upload-artifact@v7
        with:
          name: aws-staging-artifacts-${{ inputs.stack_id }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/runtime/${{ inputs.stack_id }}.manifest.json
            ${{ runner.temp }}/runtime/jar-bundle.json
            ${{ runner.temp }}/runtime/smoke-bundle.json
            ${{ runner.temp }}/runtime/delivery-receipt.json
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false

      - name: Remove private Runtime and Terraform inputs
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/runtime" "$RUNNER_TEMP/jars" "$RUNNER_TEMP/smoke-bundle"
          rm -f "$RUNNER_TEMP/backend.hcl" "$RUNNER_TEMP/staging.tfvars.json"
