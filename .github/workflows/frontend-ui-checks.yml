name: Frontend UI Checks

on:
  pull_request:
    branches:
      - main
      - dev
    paths:
      - "frontend/**"
      - "docs/04-development-guide.md"
      - ".github/workflows/frontend-ui-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-ui-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify UI regression contracts
        working-directory: frontend
        run: npm run verify:ui-regressions

      - name: Build frontend
        working-directory: frontend
        run: npm run build
