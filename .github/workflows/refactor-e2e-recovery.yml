name: Refactor E2E Recovery

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "deploy/**"
      - ".github/workflows/refactor-e2e-recovery.yml"
  workflow_dispatch:
    inputs:
      profile:
        description: Recovery profile to run
        required: true
        type: choice
        default: pr
        options: [pr, release, nightly]

permissions:
  contents: read

jobs:
  pr-contract:
    if: github.event_name == 'pull_request' || inputs.profile == 'pr'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install contract dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          npm ci --prefix backend
          npm ci --prefix frontend
      - name: Run deterministic PR recovery profile
        working-directory: backend
        env:
          ASKLAKE_FASTAPI_PYTHON: python
        run: npm run verify:etl-e2e-recovery -- --output-dir ../.artifacts/etl-e2e-recovery
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: etl-e2e-recovery-pr
          path: .artifacts/etl-e2e-recovery/

  release-process-boundaries:
    if: github.event_name == 'workflow_dispatch' && inputs.profile == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install -r backend/requirements.txt
          npm ci --prefix backend
          npm ci --prefix frontend
      - name: Run REST process and Spark container boundaries
        working-directory: backend
        env:
          ASKLAKE_FASTAPI_PYTHON: python
        run: npm run verify:etl-e2e-recovery:release -- --output-dir ../.artifacts/etl-e2e-recovery
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: etl-e2e-recovery-release
          path: .artifacts/etl-e2e-recovery/

  nightly-isolated-stack:
    if: github.event_name == 'workflow_dispatch' && inputs.profile == 'nightly'
    runs-on: [self-hosted, asklake-e2e]
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated browser, Kafka, Spark, and storage faults
        working-directory: backend
        env:
          ASKLAKE_E2E_ISOLATED_ENV: "true"
          ASKLAKE_FASTAPI_PYTHON: python
          ASKLAKE_CONTINUOUS_E2E_BASE_URL: http://127.0.0.1:8080
          ASKLAKE_E2E_FRONTEND_URL: http://127.0.0.1:5174
        run: npm run verify:etl-e2e-recovery:nightly -- --output-dir ../.artifacts/etl-e2e-recovery
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: etl-e2e-recovery-nightly
          path: .artifacts/etl-e2e-recovery/
