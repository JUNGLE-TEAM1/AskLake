name: PR Branch Policy

on:
  pull_request:
    branches:
      - main
      - dev
    types:
      - opened
      - reopened
      - synchronize
      - edited

permissions:
  contents: read

jobs:
  validate-pr-source:
    runs-on: ubuntu-latest

    steps:
      - name: Validate PR source branch
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          echo "base=${BASE_BRANCH}"
          echo "head=${HEAD_BRANCH}"

          if [ "${BASE_BRANCH}" = "main" ]; then
            if [ "${HEAD_BRANCH}" != "dev" ]; then
              echo "::error::Pull requests into main must come from dev."
              exit 1
            fi
            exit 0
          fi

          if [ "${BASE_BRANCH}" = "dev" ]; then
            case "${HEAD_BRANCH}" in
              pair1|pair2|pair3)
                exit 0
                ;;
              *)
                echo "::error::Pull requests into dev must come from pair1, pair2, or pair3."
                exit 1
                ;;
            esac
          fi
