enabled: true
routesEnabled: true
namespace: asklake-dev
autoModeLoadBalancingReady: true
ingressClassName: asklake-dev-alb
ingressClassParamsName: asklake-dev-alb
namespaceSelector:
  asklake.io/ingress-access: asklake-dev
exposure: internet-facing
targetType: ip
ipAddressType: ipv4
subnetIds:
  - subnet-test-public-a
  - subnet-test-public-b
groupName: asklake-dev
listenerProtocol: HTTP
host: ""
certificateArn: ""

services:
  frontend:
    name: frontend
    type: ClusterIP
    port: 80
    healthPath: /
  backend:
    name: fastapi
    type: ClusterIP
    port: 8080
    healthPath: /api/health
