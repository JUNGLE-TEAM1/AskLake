metadata:
  name: asklake-trino-runtime
  namespace: asklake-dev
  labels:
    app.kubernetes.io/name: asklake
    app.kubernetes.io/part-of: asklake
    asklake.io/environment: dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: asklake-secrets-manager
  target:
    name: asklake-trino-runtime
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: Opaque
  data:
    - secretKey: TRINO_ICEBERG_JDBC_URL
      remoteRef:
        key: asklake/dev/trino/runtime
        property: TRINO_ICEBERG_JDBC_URL
    - secretKey: TRINO_ICEBERG_JDBC_USER
      remoteRef:
        key: asklake/dev/trino/runtime
        property: TRINO_ICEBERG_JDBC_USER
