apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: asklake-backend-runtime
  namespace: asklake-dev
  labels:
    app.kubernetes.io/name: asklake
    app.kubernetes.io/part-of: asklake
    asklake.io/environment: dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: asklake-secrets-manager
  target:
    name: asklake-backend-runtime
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: Opaque
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: asklake/dev/backend/runtime
        property: DATABASE_URL
    - secretKey: BOOTSTRAP_ADMIN_PASSWORD
      remoteRef:
        key: asklake/dev/backend/runtime
        property: BOOTSTRAP_ADMIN_PASSWORD
    - secretKey: AI_GATEWAY_SERVICE_TOKEN
      remoteRef:
        key: asklake/dev/backend/runtime
        property: AI_GATEWAY_SERVICE_TOKEN
    - secretKey: AI_MCP_SERVICE_TOKEN
      remoteRef:
        key: asklake/dev/backend/runtime
        property: AI_MCP_SERVICE_TOKEN
    - secretKey: AI_CONTEXT_SIGNING_SECRET
      remoteRef:
        key: asklake/dev/backend/runtime
        property: AI_CONTEXT_SIGNING_SECRET
    - secretKey: AIRFLOW_PASSWORD
      remoteRef:
        key: asklake/dev/backend/runtime
        property: AIRFLOW_PASSWORD
    - secretKey: AIRFLOW_EXECUTION_API_TOKEN
      remoteRef:
        key: asklake/dev/backend/runtime
        property: AIRFLOW_EXECUTION_API_TOKEN
    - secretKey: AIRFLOW_INTERNAL_TOKEN
      remoteRef:
        key: asklake/dev/backend/runtime
        property: AIRFLOW_INTERNAL_TOKEN
    - secretKey: TRINO_AUTH_USERNAME
      remoteRef:
        key: asklake/dev/backend/runtime
        property: TRINO_AUTH_USERNAME
    - secretKey: TRINO_AUTH_PASSWORD
      remoteRef:
        key: asklake/dev/backend/runtime
        property: TRINO_AUTH_PASSWORD
    - secretKey: TRINO_MATERIALIZER_USERNAME
      remoteRef:
        key: asklake/dev/backend/runtime
        property: TRINO_MATERIALIZER_USERNAME
    - secretKey: TRINO_MATERIALIZER_PASSWORD
      remoteRef:
        key: asklake/dev/backend/runtime
        property: TRINO_MATERIALIZER_PASSWORD
    - secretKey: TRINO_RESULT_CURSOR_SECRET
      remoteRef:
        key: asklake/dev/backend/runtime
        property: TRINO_RESULT_CURSOR_SECRET
    - secretKey: TRINO_QUERY_CONFIRMATION_SECRET
      remoteRef:
        key: asklake/dev/backend/runtime
        property: TRINO_QUERY_CONFIRMATION_SECRET
    - secretKey: trino-ca.pem
      remoteRef:
        key: asklake/dev/backend/runtime
        property: trino-ca.pem
---
