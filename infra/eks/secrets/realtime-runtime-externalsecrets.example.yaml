# Example only. Apply after the referenced Secrets Manager properties and the
# namespaced SecretStore exist. No value below is a credential.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: asklake-clickhouse-keeper-v2-config
  namespace: asklake-dev
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: asklake-secrets-manager}
  target:
    name: asklake-clickhouse-keeper-v2-config
    creationPolicy: Owner
    deletionPolicy: Retain
    template: {engineVersion: v2, mergePolicy: Replace, type: Opaque}
  data:
    - secretKey: keeper.xml
      remoteRef: {key: asklake/dev/realtime/clickhouse-v2, property: keeper-config.xml}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: asklake-clickhouse-v2-config
  namespace: asklake-dev
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: asklake-secrets-manager}
  target:
    name: asklake-clickhouse-v2-config
    creationPolicy: Owner
    deletionPolicy: Retain
    template: {engineVersion: v2, mergePolicy: Replace, type: Opaque}
  data:
    - secretKey: tls.xml
      remoteRef: {key: asklake/dev/realtime/clickhouse-v2, property: tls.xml}
    - secretKey: keeper.xml
      remoteRef: {key: asklake/dev/realtime/clickhouse-v2, property: keeper.xml}
    - secretKey: ca.crt
      remoteRef: {key: asklake/dev/realtime/clickhouse-v2, property: ca.crt}
    - secretKey: server.crt
      remoteRef: {key: asklake/dev/realtime/clickhouse-v2, property: server.crt}
    - secretKey: server.key
      remoteRef: {key: asklake/dev/realtime/clickhouse-v2, property: server.key}
    - secretKey: adminPassword
      remoteRef: {key: asklake/dev/realtime/clickhouse-v2, property: adminPassword}
    - secretKey: ingestPassword
      remoteRef: {key: asklake/dev/realtime/clickhouse-v2, property: ingestPassword}
    - secretKey: materializerPassword
      remoteRef: {key: asklake/dev/realtime/clickhouse-v2, property: materializerPassword}
    - secretKey: migrationPassword
      remoteRef: {key: asklake/dev/realtime/clickhouse-v2, property: migrationPassword}
    - secretKey: observerPassword
      remoteRef: {key: asklake/dev/realtime/clickhouse-v2, property: observerPassword}
    - secretKey: readerPassword
      remoteRef: {key: asklake/dev/realtime/clickhouse-v2, property: readerPassword}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: asklake-kafka-connect-v2-runtime
  namespace: asklake-dev
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: asklake-secrets-manager}
  target:
    name: asklake-kafka-connect-v2-runtime
    creationPolicy: Owner
    deletionPolicy: Retain
    template: {engineVersion: v2, mergePolicy: Replace, type: Opaque}
  dataFrom:
    - extract:
        key: asklake/dev/realtime/kafka-connect-v2
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: asklake-realtime-runtime
  namespace: asklake-dev
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: asklake-secrets-manager}
  target:
    name: asklake-realtime-runtime
    creationPolicy: Owner
    deletionPolicy: Retain
    template: {engineVersion: v2, mergePolicy: Replace, type: Opaque}
  data:
    - secretKey: CLICKHOUSE_V2_MATERIALIZER_PASSWORD
      remoteRef: {key: asklake/dev/realtime/clickhouse-v2, property: materializerPassword}
    - secretKey: CLICKHOUSE_V2_READER_PASSWORD
      remoteRef: {key: asklake/dev/realtime/clickhouse-v2, property: readerPassword}
    - secretKey: clickhouse-v2-ca.crt
      remoteRef: {key: asklake/dev/realtime/clickhouse-v2, property: ca.crt}
