# Example only. Apply after the referenced Secrets Manager properties and the
# namespaced SecretStore exist. No value below is a credential.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: asklake-clickhouse-keeper-v2-config
  namespace: asklake-dev
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: asklake-secrets-manager}
  target:
    name: asklake-clickhouse-keeper-v2-config
    creationPolicy: Owner
    deletionPolicy: Retain
    template: {engineVersion: v2, mergePolicy: Replace, type: Opaque}
  data:
    - secretKey: keeper.xml
      remoteRef: {key: asklake/dev/realtime/clickhouse-v2, property: keeper.xml}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: asklake-clickhouse-v2-config
  namespace: asklake-dev
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: asklake-secrets-manager}
  target:
    name: asklake-clickhouse-v2-config
    creationPolicy: Owner
    deletionPolicy: Retain
    template: {engineVersion: v2, mergePolicy: Replace, type: Opaque}
  data:
    - secretKey: config.xml
      remoteRef: {key: asklake/dev/realtime/clickhouse-v2, property: config.xml}
    - secretKey: users.xml
      remoteRef: {key: asklake/dev/realtime/clickhouse-v2, property: users.xml}
    - secretKey: ca.crt
      remoteRef: {key: asklake/dev/realtime/clickhouse-v2, property: ca.crt}
    - secretKey: server.crt
      remoteRef: {key: asklake/dev/realtime/clickhouse-v2, property: server.crt}
    - secretKey: server.key
      remoteRef: {key: asklake/dev/realtime/clickhouse-v2, property: server.key}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: asklake-kafka-connect-v2-runtime
  namespace: asklake-dev
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: asklake-secrets-manager}
  target:
    name: asklake-kafka-connect-v2-runtime
    creationPolicy: Owner
    deletionPolicy: Retain
    template: {engineVersion: v2, mergePolicy: Replace, type: Opaque}
  dataFrom:
    - extract:
        key: asklake/dev/realtime/kafka-connect-v2
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: asklake-realtime-runtime
  namespace: asklake-dev
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: asklake-secrets-manager}
  target:
    name: asklake-realtime-runtime
    creationPolicy: Owner
    deletionPolicy: Retain
    template: {engineVersion: v2, mergePolicy: Replace, type: Opaque}
  data:
    - secretKey: CLICKHOUSE_V2_MATERIALIZER_PASSWORD
      remoteRef: {key: asklake/dev/realtime/backend-v2, property: CLICKHOUSE_V2_MATERIALIZER_PASSWORD}
    - secretKey: CLICKHOUSE_V2_READER_PASSWORD
      remoteRef: {key: asklake/dev/realtime/backend-v2, property: CLICKHOUSE_V2_READER_PASSWORD}
    - secretKey: clickhouse-v2-ca.crt
      remoteRef: {key: asklake/dev/realtime/backend-v2, property: clickhouse-v2-ca.crt}
