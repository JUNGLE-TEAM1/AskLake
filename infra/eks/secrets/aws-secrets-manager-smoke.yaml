apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: asklake-external-secrets-smoke
  namespace: asklake-dev
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: asklake-secrets-manager
  target:
    name: asklake-external-secrets-smoke
    creationPolicy: Owner
  data:
    - secretKey: probe
      remoteRef:
        key: asklake/dev/smoke/external-secrets
        property: probe
