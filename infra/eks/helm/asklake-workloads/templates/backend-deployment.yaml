{{- if .Values.backend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asklake-backend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "asklake-workloads.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "asklake-workloads.selectorLabels" (dict "component" "backend" "release" .Release.Name) | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/backend-configmap.yaml") . | sha256sum }}
      labels:
        {{- include "asklake-workloads.selectorLabels" (dict "component" "backend" "release" .Release.Name) | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.backend.serviceAccountName }}
      automountServiceAccountToken: true
      nodeSelector:
        {{- toYaml .Values.backend.nodeSelector | nindent 8 }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: backend
          image: "{{ required "backend image repository is required" .Values.backend.image.repository }}@{{ required "backend image digest is required" .Values.backend.image.digest }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: asklake-backend-config
          env:
            {{- $secretName := .Values.backend.runtimeSecret.name }}
            {{- $commonKeys := dict
              "DATABASE_URL" .Values.backend.runtimeSecret.keys.databaseUrl
              "BOOTSTRAP_ADMIN_PASSWORD" .Values.backend.runtimeSecret.keys.bootstrapAdminPassword
              "AIRFLOW_EXECUTION_API_TOKEN" .Values.backend.runtimeSecret.keys.airflowExecutionApiToken
              "AIRFLOW_INTERNAL_TOKEN" .Values.backend.runtimeSecret.keys.airflowInternalToken
              "TRINO_AUTH_USERNAME" .Values.backend.runtimeSecret.keys.trinoAuthUsername
              "TRINO_AUTH_PASSWORD" .Values.backend.runtimeSecret.keys.trinoAuthPassword
              "TRINO_MATERIALIZER_USERNAME" .Values.backend.runtimeSecret.keys.trinoMaterializerUsername
              "TRINO_MATERIALIZER_PASSWORD" .Values.backend.runtimeSecret.keys.trinoMaterializerPassword
              "TRINO_RESULT_CURSOR_SECRET" .Values.backend.runtimeSecret.keys.trinoResultCursorSecret
              "TRINO_QUERY_CONFIRMATION_SECRET" .Values.backend.runtimeSecret.keys.trinoQueryConfirmationSecret
            }}
            {{- range $envName, $secretKey := $commonKeys }}
            - name: {{ $envName }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ $secretKey }}
            {{- end }}
            {{- if eq .Values.backend.config.airflowApiAuthMode "api_token" }}
            - name: AIRFLOW_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ .Values.backend.runtimeSecret.keys.airflowApiToken }}
            {{- else }}
            - name: AIRFLOW_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ .Values.backend.runtimeSecret.keys.airflowPassword }}
            {{- end }}
            {{- if eq .Values.backend.config.aiQueryProvider "gateway" }}
            {{- range $envName, $secretKey := dict
              "AI_GATEWAY_SERVICE_TOKEN" .Values.backend.runtimeSecret.keys.aiGatewayServiceToken
              "AI_MCP_SERVICE_TOKEN" .Values.backend.runtimeSecret.keys.aiMcpServiceToken
              "AI_CONTEXT_SIGNING_SECRET" .Values.backend.runtimeSecret.keys.aiContextSigningSecret
              "OPENAI_API_KEY" .Values.backend.runtimeSecret.keys.openaiApiKey
            }}
            - name: {{ $envName }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ $secretKey }}
            {{- end }}
            {{- else }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ .Values.backend.runtimeSecret.keys.openaiApiKey }}
            {{- end }}
          volumeMounts:
            - name: backend-runtime-files
              mountPath: /var/run/asklake/secrets
              readOnly: true
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
      volumes:
        - name: backend-runtime-files
          secret:
            secretName: {{ .Values.backend.runtimeSecret.name }}
            items:
              - key: {{ .Values.backend.runtimeSecret.trinoCaKey }}
                path: trino-ca.pem
{{- end }}
