{{- if .Values.realtimeV2.enabled }}
{{- if .Values.realtimeV1.enabled }}{{ fail "realtimeV1 and realtimeV2 cannot be enabled together" }}{{ end }}
{{- if not .Values.realtimeV2.ownerTransfer.approved }}{{ fail "realtimeV2 requires an approved isolated canary or owner transfer" }}{{ end }}
{{- if not .Values.realtimeV2.ownerTransfer.previousOwnerFenced }}{{ fail "realtimeV2 requires proof that the previous exact owner is fenced" }}{{ end }}
{{- $recoveryMode := .Values.realtimeV2.recoveryMode }}
{{- $clickhouseSnapshot := .Values.realtimeV2.storage.restoreSnapshots.clickhouse }}
{{- $keeperSnapshot := .Values.realtimeV2.storage.restoreSnapshots.keeper }}
{{- if ne (empty $clickhouseSnapshot) (empty $keeperSnapshot) }}{{ fail "realtimeV2 restore requires both ClickHouse and Keeper snapshots" }}{{ end }}
{{- if and (not $recoveryMode) (or (not (empty $clickhouseSnapshot)) (not (empty $keeperSnapshot))) }}{{ fail "realtimeV2 snapshots may be attached only in recoveryMode" }}{{ end }}
{{- if and $recoveryMode (or (empty $clickhouseSnapshot) (empty $keeperSnapshot)) }}{{ fail "realtimeV2 recoveryMode requires both isolated restore snapshots" }}{{ end }}
{{- $generation := required "realtimeV2.ownerTransfer.generation is required" .Values.realtimeV2.ownerTransfer.generation }}
{{- $storageClass := required "realtimeV2.storage.storageClassName is required" .Values.realtimeV2.storage.storageClassName }}
{{- $chImage := printf "%s@%s" (required "realtimeV2 ClickHouse image repository is required" .Values.realtimeV2.images.clickhouse.repository) (required "realtimeV2 ClickHouse image digest is required" .Values.realtimeV2.images.clickhouse.digest) }}
{{- $connectImage := printf "%s@%s" (required "realtimeV2 Connect image repository is required" .Values.realtimeV2.images.connect.repository) (required "realtimeV2 Connect image digest is required" .Values.realtimeV2.images.connect.digest) }}
{{- $sourceTopic := printf "%s.%s" .Values.realtimeV2.msk.sourceTopicPrefix $generation }}
{{- $dlqTopic := printf "%s.%s" .Values.realtimeV2.msk.dlqTopicPrefix $generation }}
{{- $group := printf "%s-%s" .Values.realtimeV2.msk.consumerGroupPrefix $generation }}
{{- $workerGroup := printf "%s-%s" .Values.realtimeV2.msk.workerGroupPrefix $generation }}
{{- $internal := printf "%s-%s" .Values.realtimeV2.msk.internalTopicPrefix $generation }}
apiVersion: v1
kind: Service
metadata: {name: clickhouse-keeper-v2, namespace: {{ .Values.namespace }}}
spec:
  clusterIP: None
  selector: {{ include "asklake-workloads.selectorLabels" (dict "component" "realtime-v2-keeper" "release" .Release.Name) | nindent 4 }}
  ports: [{name: client, port: 9181}, {name: raft, port: 9234}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse-keeper-v2
  namespace: {{ .Values.namespace }}
  labels: {app.kubernetes.io/component: realtime-v2-keeper}
spec:
  serviceName: clickhouse-keeper-v2
  replicas: 1
  persistentVolumeClaimRetentionPolicy: {whenDeleted: Retain, whenScaled: Retain}
  selector:
    matchLabels: {{ include "asklake-workloads.selectorLabels" (dict "component" "realtime-v2-keeper" "release" .Release.Name) | nindent 6 }}
  template:
    metadata:
      labels: {{ include "asklake-workloads.selectorLabels" (dict "component" "realtime-v2-keeper" "release" .Release.Name) | nindent 8 }}
      annotations: {asklake.io/owner-generation: {{ $generation | quote }}, asklake.io/ha: "false"}
    spec:
      automountServiceAccountToken: false
      nodeSelector: {{ toYaml .Values.realtimeV2.nodeSelector | nindent 8 }}
      securityContext: {fsGroup: 101, fsGroupChangePolicy: OnRootMismatch}
      containers:
        - name: keeper
          image: {{ $chImage | quote }}
          imagePullPolicy: {{ .Values.realtimeV2.images.clickhouse.pullPolicy }}
          command: [clickhouse-keeper, --config-file=/etc/clickhouse-keeper/keeper-config.xml]
          securityContext: {runAsNonRoot: true, runAsUser: 101, runAsGroup: 101, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          ports: [{name: client, containerPort: 9181}, {name: raft, containerPort: 9234}]
          readinessProbe: {exec: {command: [sh, -c, "clickhouse keeper-client --host 127.0.0.1 --port 9181 --query ruok 2>/dev/null | grep -q imok"]}, initialDelaySeconds: 10, periodSeconds: 10}
          resources: {{ toYaml .Values.realtimeV2.resources.keeper | nindent 12 }}
          volumeMounts: [{name: keeper-data, mountPath: /var/lib/clickhouse-keeper}, {name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {sizeLimit: 256Mi}}]
  volumeClaimTemplates:
    - metadata: {name: keeper-data}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ $storageClass | quote }}
        resources: {requests: {storage: {{ .Values.realtimeV2.storage.keeperSize }}}}
        {{- if $recoveryMode }}
        dataSource: {apiGroup: snapshot.storage.k8s.io, kind: VolumeSnapshot, name: {{ $keeperSnapshot | quote }}}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata: {name: {{ .Values.realtimeV2.clickhouse.serviceName }}, namespace: {{ .Values.namespace }}}
spec:
  clusterIP: None
  selector: {{ include "asklake-workloads.selectorLabels" (dict "component" "realtime-v2-clickhouse" "release" .Release.Name) | nindent 4 }}
  ports: [{name: https, port: 8443}, {name: native-tls, port: 9440}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse-v2
  namespace: {{ .Values.namespace }}
  labels: {app.kubernetes.io/component: realtime-v2-clickhouse}
spec:
  serviceName: {{ .Values.realtimeV2.clickhouse.serviceName }}
  replicas: 1
  persistentVolumeClaimRetentionPolicy: {whenDeleted: Retain, whenScaled: Retain}
  selector:
    matchLabels: {{ include "asklake-workloads.selectorLabels" (dict "component" "realtime-v2-clickhouse" "release" .Release.Name) | nindent 6 }}
  template:
    metadata:
      labels: {{ include "asklake-workloads.selectorLabels" (dict "component" "realtime-v2-clickhouse" "release" .Release.Name) | nindent 8 }}
      annotations: {asklake.io/owner-generation: {{ $generation | quote }}, asklake.io/ha: "false"}
    spec:
      automountServiceAccountToken: false
      nodeSelector: {{ toYaml .Values.realtimeV2.nodeSelector | nindent 8 }}
      securityContext: {fsGroup: 101, fsGroupChangePolicy: OnRootMismatch}
      initContainers:
        - name: stage-secret-sources
          image: {{ $chImage | quote }}
          command: [sh, -c, "install -m 0400 /projected/tls.crt /staged/server.crt && install -m 0400 /projected/tls.key /staged/server.key && install -m 0400 /projected/ca.crt /staged/ca.crt"]
          securityContext: {runAsUser: 0, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: projected-runtime, mountPath: /projected, readOnly: true}, {name: secret-source, mountPath: /staged}]
      containers:
        - name: clickhouse
          image: {{ $chImage | quote }}
          imagePullPolicy: {{ .Values.realtimeV2.images.clickhouse.pullPolicy }}
          securityContext: {runAsUser: 0, allowPrivilegeEscalation: false, readOnlyRootFilesystem: false, capabilities: {drop: [ALL], add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]}}
          env:
            - {name: CLICKHOUSE_DB, value: {{ .Values.realtimeV2.clickhouse.database | quote }}}
            - {name: CLICKHOUSE_USER, value: asklake_v2_admin}
            - {name: CLICKHOUSE_ALWAYS_RUN_INITDB_SCRIPTS, value: "1"}
            - {name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT, value: "1"}
            - {name: CLICKHOUSE_V2_DISABLE_PLAINTEXT_AFTER_INIT, value: "true"}
            - {name: CLICKHOUSE_V2_TLS_STAGING_REQUIRED, value: "true"}
            {{- range $env, $key := dict "CLICKHOUSE_PASSWORD" "adminPassword" "CLICKHOUSE_V2_INGEST_PASSWORD" "ingestPassword" "CLICKHOUSE_V2_MATERIALIZER_PASSWORD" "materializerPassword" "CLICKHOUSE_V2_READER_PASSWORD" "readerPassword" "CLICKHOUSE_V2_MIGRATION_PASSWORD" "migrationPassword" "CLICKHOUSE_V2_OBSERVER_PASSWORD" "observerPassword" }}
            - name: {{ $env }}
              valueFrom: {secretKeyRef: {name: {{ $.Values.realtimeV2.runtimeSecret.name }}, key: {{ $key }}}}
            {{- end }}
          ports: [{name: https, containerPort: 8443}, {name: native-tls, containerPort: 9440}]
          readinessProbe: {exec: {command: [sh, -c, "clickhouse-client --config-file /etc/clickhouse-client/config.xml --host clickhouse-v2 --secure --port 9440 --user asklake_v2_reader --password \"$CLICKHOUSE_V2_READER_PASSWORD\" --query 'SELECT 1' >/dev/null"]}, initialDelaySeconds: 30, periodSeconds: 10}
          resources: {{ toYaml .Values.realtimeV2.resources.clickhouse | nindent 12 }}
          volumeMounts: [{name: clickhouse-data, mountPath: /var/lib/clickhouse}, {name: secret-source, mountPath: /run/asklake-secrets-source/clickhouse-v2, readOnly: true}, {name: runtime-secret-tmpfs, mountPath: /run/asklake-clickhouse-v2-secrets}]
      volumes:
        - {name: projected-runtime, secret: {secretName: {{ .Values.realtimeV2.runtimeSecret.name }}, defaultMode: 256}}
        - {name: secret-source, emptyDir: {medium: Memory, sizeLimit: 16Mi}}
        - {name: runtime-secret-tmpfs, emptyDir: {medium: Memory, sizeLimit: 16Mi}}
  volumeClaimTemplates:
    - metadata: {name: clickhouse-data}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ $storageClass | quote }}
        resources: {requests: {storage: {{ .Values.realtimeV2.storage.clickhouseSize }}}}
        {{- if $recoveryMode }}
        dataSource: {apiGroup: snapshot.storage.k8s.io, kind: VolumeSnapshot, name: {{ $clickhouseSnapshot | quote }}}
        {{- end }}
---
{{- if not $recoveryMode }}
apiVersion: v1
kind: Service
metadata: {name: {{ .Values.realtimeV2.connect.serviceName }}, namespace: {{ .Values.namespace }}}
spec:
  selector: {{ include "asklake-workloads.selectorLabels" (dict "component" "realtime-v2-connect" "release" .Release.Name) | nindent 4 }}
  ports: [{name: rest, port: 8083, targetPort: rest}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-connect-v2
  namespace: {{ .Values.namespace }}
  labels: {app.kubernetes.io/component: realtime-v2-connect}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {{ include "asklake-workloads.selectorLabels" (dict "component" "realtime-v2-connect" "release" .Release.Name) | nindent 6 }}
  template:
    metadata:
      labels: {{ include "asklake-workloads.selectorLabels" (dict "component" "realtime-v2-connect" "release" .Release.Name) | nindent 8 }}
      annotations: {asklake.io/owner-generation: {{ $generation | quote }}, asklake.io/source-topic: {{ $sourceTopic | quote }}, asklake.io/consumer-group: {{ $group | quote }}}
    spec:
      serviceAccountName: {{ .Values.realtimeV2.serviceAccounts.connect }}
      automountServiceAccountToken: false
      nodeSelector: {{ toYaml .Values.realtimeV2.nodeSelector | nindent 8 }}
      initContainers:
        - name: stage-secret-sources
          image: {{ $connectImage | quote }}
          command: [sh, -c, "install -m 0400 /projected/connectProperties /staged/asklake-clickhouse-v2.properties && install -m 0400 /projected/ca.crt /staged/clickhouse-v2-ca.crt"]
          securityContext: {runAsUser: 0, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: projected-runtime, mountPath: /projected, readOnly: true}, {name: secret-source, mountPath: /staged}]
      containers:
        - name: connect
          image: {{ $connectImage | quote }}
          imagePullPolicy: {{ .Values.realtimeV2.images.connect.pullPolicy }}
          securityContext: {runAsUser: 0, allowPrivilegeEscalation: false, readOnlyRootFilesystem: false, capabilities: {drop: [ALL], add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]}}
          env:
            - name: CONNECT_BOOTSTRAP_SERVERS
              valueFrom: {secretKeyRef: {name: {{ .Values.realtimeV2.msk.bootstrapSecretName }}, key: {{ .Values.realtimeV2.msk.bootstrapSecretKey }}}}
            - {name: CONNECT_GROUP_ID, value: {{ $workerGroup | quote }}}
            - {name: CONNECT_CONFIG_STORAGE_TOPIC, value: {{ printf "%s-config" $internal | quote }}}
            - {name: CONNECT_OFFSET_STORAGE_TOPIC, value: {{ printf "%s-offset" $internal | quote }}}
            - {name: CONNECT_STATUS_STORAGE_TOPIC, value: {{ printf "%s-status" $internal | quote }}}
            - {name: CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR, value: "1"}
            - {name: CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR, value: "1"}
            - {name: CONNECT_STATUS_STORAGE_REPLICATION_FACTOR, value: "1"}
            - {name: CONNECT_CONFIG_PROVIDERS, value: file}
            - {name: CONNECT_CONFIG_PROVIDERS_FILE_CLASS, value: org.apache.kafka.common.config.provider.FileConfigProvider}
            - {name: CONNECT_CONNECTOR_CLIENT_CONFIG_OVERRIDE_POLICY, value: All}
            - {name: CONNECT_KEY_CONVERTER, value: org.apache.kafka.connect.json.JsonConverter}
            - {name: CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE, value: "false"}
            - {name: CONNECT_VALUE_CONVERTER, value: org.apache.kafka.connect.json.JsonConverter}
            - {name: CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE, value: "false"}
            - {name: CONNECT_PLUGIN_PATH, value: "/usr/share/java,/usr/share/confluent-hub-components"}
            - {name: CONNECT_REST_ADVERTISED_HOST_NAME, value: kafka-connect-v2}
            - {name: CONNECT_REST_PORT, value: "8083"}
            - {name: CONNECT_SECURITY_PROTOCOL, value: SASL_SSL}
            - {name: CONNECT_SASL_MECHANISM, value: AWS_MSK_IAM}
            - {name: CONNECT_SASL_JAAS_CONFIG, value: "software.amazon.msk.auth.iam.IAMLoginModule required;"}
            - {name: CONNECT_SASL_CLIENT_CALLBACK_HANDLER_CLASS, value: software.amazon.msk.auth.iam.IAMClientCallbackHandler}
            - {name: ASKLAKE_MSK_IAM_AUTH_JAR, value: {{ .Values.realtimeV2.msk.iamAuthJar | quote }}}
            - {name: ASKLAKE_V2_SOURCE_TOPIC, value: {{ $sourceTopic | quote }}}
            - {name: ASKLAKE_V2_DLQ_TOPIC, value: {{ $dlqTopic | quote }}}
            - {name: KAFKA_CONNECT_V2_TLS_CA_STAGING_REQUIRED, value: "true"}
          ports: [{name: rest, containerPort: 8083}]
          readinessProbe: {httpGet: {path: /connector-plugins, port: rest}, initialDelaySeconds: 30, periodSeconds: 10}
          resources: {{ toYaml .Values.realtimeV2.resources.connect | nindent 12 }}
          volumeMounts: [{name: secret-source, mountPath: /run/asklake-secrets-source/kafka-connect, readOnly: true}, {name: runtime-secret-tmpfs, mountPath: /run/secrets}]
      volumes:
        - {name: projected-runtime, secret: {secretName: {{ .Values.realtimeV2.runtimeSecret.name }}, defaultMode: 256}}
        - {name: secret-source, emptyDir: {medium: Memory, sizeLimit: 16Mi}}
        - {name: runtime-secret-tmpfs, emptyDir: {medium: Memory, sizeLimit: 16Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asklake-realtime-v2-worker
  namespace: {{ .Values.namespace }}
  labels: {app.kubernetes.io/component: realtime-v2-worker}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {{ include "asklake-workloads.selectorLabels" (dict "component" "realtime-v2-worker" "release" .Release.Name) | nindent 6 }}
  template:
    metadata:
      labels: {{ include "asklake-workloads.selectorLabels" (dict "component" "realtime-v2-worker" "release" .Release.Name) | nindent 8 }}
      annotations: {asklake.io/owner-generation: {{ $generation | quote }}}
    spec:
      serviceAccountName: {{ .Values.realtimeV2.serviceAccounts.worker }}
      automountServiceAccountToken: false
      nodeSelector: {{ toYaml .Values.realtimeV2.nodeSelector | nindent 8 }}
      containers:
        - name: worker
          image: "{{ required "backend image repository is required" .Values.backend.image.repository }}@{{ required "backend image digest is required" .Values.backend.image.digest }}"
          command: [python, -m, app.continuous_worker]
          envFrom: [{configMapRef: {name: asklake-runtime}}, {secretRef: {name: {{ .Values.backend.runtimeSecret.name }}}}]
          env:
            - {name: CONTINUOUS_CONTROL_PLANE, value: worker}
            - {name: CONTINUOUS_WORKER_SCOPE, value: kafka}
            - {name: CONTINUOUS_WORKER_OWNER, value: eks-kafka-connect-clickhouse-v2}
            - {name: CONTINUOUS_WORKER_GENERATION, value: {{ $generation | quote }}}
            - {name: CLICKHOUSE_REALTIME_V2_ENABLED, value: "true"}
            - {name: KAFKA_CONNECT_SINK_ENABLED, value: "true"}
            - {name: CLICKHOUSE_REALTIME_CONSUMER_OWNER, value: kafka_connect_v2}
            - {name: KAFKA_CONNECT_URL, value: "http://kafka-connect-v2:8083"}
            - {name: KAFKA_CONNECT_CONNECTOR_NAME, value: {{ printf "asklake-eks-realtime-v2-%s" $generation | quote }}}
            - {name: CLICKHOUSE_V2_URL, value: "https://clickhouse-v2:8443"}
          resources: {{ toYaml .Values.realtimeV2.resources.worker | nindent 12 }}
{{- end }}
{{- end }}
