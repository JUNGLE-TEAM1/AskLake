{{- if and .Values.trino.enabled .Values.trino.distributed.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.trino.service.name }}-discovery
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "asklake-workloads.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: trino-discovery
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "asklake-workloads.selectorLabels" (dict "component" "trino" "release" .Release.Name) | nindent 4 }}
  ports:
    - name: https
      port: {{ .Values.trino.service.port }}
      targetPort: https
      protocol: TCP
{{- end }}
