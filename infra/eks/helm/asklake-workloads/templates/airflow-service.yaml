{{- if .Values.airflow.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.airflow.service.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "asklake-workloads.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: airflow-apiserver
spec:
  type: ClusterIP
  selector:
    {{- include "asklake-workloads.selectorLabels" (dict "component" "airflow-apiserver" "release" .Release.Name) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.airflow.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
