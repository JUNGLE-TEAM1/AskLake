{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asklake-day18-recovery-smoke
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: asklake-day18-recovery-smoke
    app.kubernetes.io/part-of: asklake
    asklake.io/day18-run: {{ .Values.runFingerprint | quote }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: asklake-day18-recovery-smoke
  template:
    metadata:
      labels:
        app.kubernetes.io/name: asklake-day18-recovery-smoke
        app.kubernetes.io/part-of: asklake
        asklake.io/day18-run: {{ .Values.runFingerprint | quote }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 5
      nodeSelector:
        asklake.io/workload-class: general
        eks.amazonaws.com/instance-cpu: "4"
        kubernetes.io/arch: amd64
      containers:
        - name: reservation
          image: {{ .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -c
            - >-
              import time;
              print("asklake-day18-recovery-smoke-started", flush=True);
              time.sleep(3600)
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
{{- end }}
