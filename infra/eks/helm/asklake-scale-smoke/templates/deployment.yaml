{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asklake-node-scale-smoke
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: asklake-node-scale-smoke
    app.kubernetes.io/part-of: asklake
    asklake.io/purpose: day14-scale-evidence
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: asklake-node-scale-smoke
  template:
    metadata:
      labels:
        app.kubernetes.io/name: asklake-node-scale-smoke
        app.kubernetes.io/part-of: asklake
        asklake.io/purpose: day14-scale-evidence
    spec:
      serviceAccountName: asklake-backend
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 5
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      containers:
        - name: reservation
          image: {{ .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["python", "-c", "import time; time.sleep(86400)"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
{{- end }}
