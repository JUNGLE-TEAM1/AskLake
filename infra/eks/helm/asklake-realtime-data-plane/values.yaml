namespace: asklake-dev

# disabled renders no Kubernetes object. shadow renders the data services but
# never the Continuous worker. cutover additionally requires explicit EC2
# quiesce and ownership-transfer acknowledgements.
mode: disabled

ownership:
  canonicalOwner: ec2-continuous-worker
  ec2Quiesced: false
  ec2KafkaOwnerReady: false
  realtimeV1Fenced: false
  transferApproved: false
  generation: ""

# Operational sizing has no checked-in default. Supply every field in a
# Git-ignored, evidence-backed values file before shadow or cutover rendering.
keeper: {}
clickhouse: {}
kafkaConnect: {}
continuousWorker: {}
networkPolicy: {}
