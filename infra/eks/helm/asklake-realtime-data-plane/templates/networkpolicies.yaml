{{- if and (ne .Values.mode "disabled") .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: asklake-realtime-default-deny
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "asklake-realtime.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
    matchExpressions:
      - {key: app.kubernetes.io/component, operator: In, values: [realtime-v2-keeper, realtime-v2-clickhouse, realtime-v2-connect, continuous-worker]}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: asklake-realtime-dns
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "asklake-realtime.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
    matchExpressions:
      - {key: app.kubernetes.io/component, operator: In, values: [realtime-v2-keeper, realtime-v2-clickhouse, realtime-v2-connect, continuous-worker]}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchExpressions:
              - {key: k8s-app, operator: In, values: [kube-dns, coredns]}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: asklake-realtime-keeper
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "asklake-realtime.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: realtime-v2-keeper
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - {key: app.kubernetes.io/component, operator: In, values: [realtime-v2-keeper, realtime-v2-clickhouse]}
      ports:
        - {protocol: TCP, port: 9181}
        - {protocol: TCP, port: 9234}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: realtime-v2-keeper
              app.kubernetes.io/instance: {{ .Release.Name | quote }}
      ports:
        - {protocol: TCP, port: 9181}
        - {protocol: TCP, port: 9234}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: asklake-realtime-clickhouse
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "asklake-realtime.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: realtime-v2-clickhouse
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - {key: app.kubernetes.io/component, operator: In, values: [backend, continuous-worker, realtime-v2-connect, realtime-v2-clickhouse]}
      ports:
        - {protocol: TCP, port: 8443}
        - {protocol: TCP, port: 9440}
        - {protocol: TCP, port: 9010}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: realtime-v2-keeper
              app.kubernetes.io/instance: {{ .Release.Name | quote }}
      ports:
        - {protocol: TCP, port: 9181}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: realtime-v2-clickhouse
              app.kubernetes.io/instance: {{ .Release.Name | quote }}
      ports:
        - {protocol: TCP, port: 9010}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: asklake-realtime-kafka-connect
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "asklake-realtime.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: realtime-v2-connect
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - {key: app.kubernetes.io/component, operator: In, values: [backend, continuous-worker]}
      ports:
        - {protocol: TCP, port: 8083}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: realtime-v2-clickhouse
              app.kubernetes.io/instance: {{ .Release.Name | quote }}
      ports:
        - {protocol: TCP, port: 8443}
    {{- range .Values.networkPolicy.mskCidrs }}
    - to: [{ipBlock: {cidr: {{ . | quote }}}}]
      ports: [{protocol: TCP, port: 9098}]
    {{- end }}
    {{- range .Values.networkPolicy.podIdentityAgentCidrs }}
    - to: [{ipBlock: {cidr: {{ . | quote }}}}]
      ports: [{protocol: TCP, port: 80}]
    {{- end }}
{{- if eq .Values.mode "cutover" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: asklake-realtime-continuous-worker
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "asklake-realtime.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: continuous-worker
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: realtime-v2-clickhouse
              app.kubernetes.io/instance: {{ .Release.Name | quote }}
      ports: [{protocol: TCP, port: 8443}]
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: realtime-v2-connect
              app.kubernetes.io/instance: {{ .Release.Name | quote }}
      ports: [{protocol: TCP, port: 8083}]
    {{- range .Values.networkPolicy.rdsCidrs }}
    - to: [{ipBlock: {cidr: {{ . | quote }}}}]
      ports: [{protocol: TCP, port: 5432}]
    {{- end }}
{{- end }}
{{- end }}
