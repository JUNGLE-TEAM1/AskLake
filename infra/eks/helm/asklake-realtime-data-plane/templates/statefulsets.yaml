{{- if ne .Values.mode "disabled" }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse-keeper-v2
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "asklake-realtime.labels" . | nindent 4 }}
    app.kubernetes.io/component: realtime-v2-keeper
spec:
  serviceName: clickhouse-keeper-v2
  replicas: {{ .Values.keeper.replicas }}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: asklake-workloads
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
      app.kubernetes.io/component: realtime-v2-keeper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: asklake-workloads
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
        app.kubernetes.io/component: realtime-v2-keeper
        app.kubernetes.io/part-of: asklake
    spec:
      serviceAccountName: {{ .Values.keeper.serviceAccountName }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.keeper.terminationGracePeriodSeconds }}
      securityContext:
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
      nodeSelector:
        {{- toYaml .Values.keeper.nodeSelector | nindent 8 }}
      containers:
        - name: keeper
          image: {{ include "asklake-realtime.image" .Values.keeper.image | quote }}
          imagePullPolicy: {{ .Values.keeper.image.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          command:
            - clickhouse-keeper
            - --config-file=/etc/asklake/keeper/keeper.xml
          ports:
            - {name: keeper-client, containerPort: 9181, protocol: TCP}
            - {name: keeper-raft, containerPort: 9234, protocol: TCP}
          startupProbe:
            tcpSocket: {port: keeper-client}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket: {port: keeper-client}
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket: {port: keeper-client}
            periodSeconds: 30
            failureThreshold: 3
          resources:
            {{- toYaml .Values.keeper.resources | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/asklake/keeper, readOnly: true}
            - {name: keeper-data, mountPath: /var/lib/clickhouse-keeper}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          secret:
            secretName: {{ .Values.keeper.configSecret.name }}
            items:
              - key: {{ .Values.keeper.configSecret.configKey }}
                path: keeper.xml
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
  volumeClaimTemplates:
    - metadata:
        name: keeper-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.keeper.storage.storageClassName | quote }}
        resources:
          requests:
            storage: {{ .Values.keeper.storage.size | quote }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse-v2
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "asklake-realtime.labels" . | nindent 4 }}
    app.kubernetes.io/component: realtime-v2-clickhouse
spec:
  serviceName: clickhouse-v2
  replicas: {{ .Values.clickhouse.replicas }}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: asklake-workloads
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
      app.kubernetes.io/component: realtime-v2-clickhouse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: asklake-workloads
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
        app.kubernetes.io/component: realtime-v2-clickhouse
        app.kubernetes.io/part-of: asklake
    spec:
      serviceAccountName: {{ .Values.clickhouse.serviceAccountName }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.clickhouse.terminationGracePeriodSeconds }}
      securityContext:
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
      nodeSelector:
        {{- toYaml .Values.clickhouse.nodeSelector | nindent 8 }}
      containers:
        - name: clickhouse
          image: {{ include "asklake-realtime.image" .Values.clickhouse.image | quote }}
          imagePullPolicy: {{ .Values.clickhouse.image.pullPolicy }}
          env:
            - {name: CLICKHOUSE_DB, value: asklake_realtime_v2}
            - {name: CLICKHOUSE_USER, value: asklake_admin}
            - {name: CLICKHOUSE_ALWAYS_RUN_INITDB_SCRIPTS, value: "1"}
            - {name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT, value: "1"}
            - {name: CLICKHOUSE_V2_DISABLE_PLAINTEXT_AFTER_INIT, value: "true"}
            - {name: CLICKHOUSE_V2_TLS_STAGING_REQUIRED, value: "true"}
            - name: CLICKHOUSE_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.clickhouse.configSecret.name }}, key: {{ .Values.clickhouse.configSecret.adminPasswordKey }}}}
            - name: CLICKHOUSE_V2_INGEST_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.clickhouse.configSecret.name }}, key: {{ .Values.clickhouse.configSecret.ingestPasswordKey }}}}
            - name: CLICKHOUSE_V2_MATERIALIZER_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.clickhouse.configSecret.name }}, key: {{ .Values.clickhouse.configSecret.materializerPasswordKey }}}}
            - name: CLICKHOUSE_V2_MIGRATION_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.clickhouse.configSecret.name }}, key: {{ .Values.clickhouse.configSecret.migrationPasswordKey }}}}
            - name: CLICKHOUSE_V2_OBSERVER_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.clickhouse.configSecret.name }}, key: {{ .Values.clickhouse.configSecret.observerPasswordKey }}}}
            - name: CLICKHOUSE_V2_READER_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.clickhouse.configSecret.name }}, key: {{ .Values.clickhouse.configSecret.readerPasswordKey }}}}
          ports:
            - {name: https, containerPort: 8443, protocol: TCP}
            - {name: native-secure, containerPort: 9440, protocol: TCP}
            - {name: interserver, containerPort: 9010, protocol: TCP}
          startupProbe:
            tcpSocket: {port: native-secure}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket: {port: native-secure}
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket: {port: native-secure}
            periodSeconds: 30
            failureThreshold: 3
          resources:
            {{- toYaml .Values.clickhouse.resources | nindent 12 }}
          volumeMounts:
            - {name: clickhouse-data, mountPath: /var/lib/clickhouse}
            - {name: config, mountPath: /etc/clickhouse-server/config.d/asklake, readOnly: true}
            - {name: tls-source, mountPath: /run/asklake-secrets-source/clickhouse-v2, readOnly: true}
            - {name: tls-staged, mountPath: /run/asklake-clickhouse-v2-secrets}
      volumes:
        - name: config
          secret:
            secretName: {{ .Values.clickhouse.configSecret.name }}
            defaultMode: 0440
            items:
              - {key: {{ .Values.clickhouse.configSecret.tlsConfigKey }}, path: tls.xml}
              - {key: {{ .Values.clickhouse.configSecret.keeperConfigKey }}, path: keeper.xml}
        - name: tls-source
          secret:
            secretName: {{ .Values.clickhouse.configSecret.name }}
            defaultMode: 0400
            items:
              - {key: {{ .Values.clickhouse.configSecret.caKey }}, path: ca.crt}
              - {key: {{ .Values.clickhouse.configSecret.certificateKey }}, path: server.crt}
              - {key: {{ .Values.clickhouse.configSecret.privateKeyKey }}, path: server.key}
        - name: tls-staged
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
  volumeClaimTemplates:
    - metadata:
        name: clickhouse-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.clickhouse.storage.storageClassName | quote }}
        resources:
          requests:
            storage: {{ .Values.clickhouse.storage.size | quote }}
{{- end }}
