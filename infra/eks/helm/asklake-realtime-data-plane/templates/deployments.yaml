{{- if ne .Values.mode "disabled" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asklake-kafka-connect-v2
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "asklake-realtime.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka-connect
spec:
  replicas: {{ .Values.kafkaConnect.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "asklake-realtime.selectorLabels" (dict "component" "kafka-connect" "release" .Release.Name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "asklake-realtime.selectorLabels" (dict "component" "kafka-connect" "release" .Release.Name) | nindent 8 }}
        app.kubernetes.io/part-of: asklake
    spec:
      serviceAccountName: {{ .Values.kafkaConnect.serviceAccountName }}
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: {{ .Values.kafkaConnect.terminationGracePeriodSeconds }}
      nodeSelector:
        {{- toYaml .Values.kafkaConnect.nodeSelector | nindent 8 }}
      containers:
        - name: kafka-connect
          image: {{ include "asklake-realtime.image" .Values.kafkaConnect.image | quote }}
          imagePullPolicy: {{ .Values.kafkaConnect.image.pullPolicy }}
          ports:
            - {name: rest, containerPort: 8083, protocol: TCP}
          envFrom:
            - secretRef:
                name: {{ .Values.kafkaConnect.envSecretName }}
          env:
            - {name: KAFKA_CONNECT_V2_TLS_CA_STAGING_REQUIRED, value: "true"}
          startupProbe:
            httpGet: {path: /, port: rest}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /connector-plugins, port: rest}
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /, port: rest}
            periodSeconds: 30
            failureThreshold: 3
          resources:
            {{- toYaml .Values.kafkaConnect.resources | nindent 12 }}
          volumeMounts:
            - name: runtime-files
              mountPath: /run/asklake-secrets-source/kafka-connect
              readOnly: true
            - name: staged-secrets
              mountPath: /run/secrets
      volumes:
        - name: runtime-files
          secret:
            secretName: {{ .Values.kafkaConnect.fileSecret.name }}
            defaultMode: 0400
            items:
              - key: {{ .Values.kafkaConnect.fileSecret.connectorPropertiesKey }}
                path: asklake-clickhouse-v2.properties
              - key: {{ .Values.kafkaConnect.fileSecret.clickhouseCaKey }}
                path: clickhouse-v2-ca.crt
        - name: staged-secrets
          emptyDir:
            medium: Memory
---
{{- if eq .Values.mode "cutover" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asklake-continuous-worker
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "asklake-realtime.labels" . | nindent 4 }}
    app.kubernetes.io/component: continuous-worker
    asklake.io/control-plane-owner: eks-continuous-worker-v2
spec:
  replicas: {{ .Values.continuousWorker.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "asklake-realtime.selectorLabels" (dict "component" "continuous-worker" "release" .Release.Name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "asklake-realtime.selectorLabels" (dict "component" "continuous-worker" "release" .Release.Name) | nindent 8 }}
        app.kubernetes.io/part-of: asklake
        asklake.io/control-plane-owner: eks-continuous-worker-v2
        asklake.io/control-plane-generation: {{ .Values.ownership.generation | quote }}
    spec:
      serviceAccountName: {{ .Values.continuousWorker.serviceAccountName }}
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: {{ .Values.continuousWorker.terminationGracePeriodSeconds }}
      nodeSelector:
        {{- toYaml .Values.continuousWorker.nodeSelector | nindent 8 }}
      containers:
        - name: continuous-worker
          image: {{ include "asklake-realtime.image" .Values.continuousWorker.image | quote }}
          imagePullPolicy: {{ .Values.continuousWorker.image.pullPolicy }}
          command: ["python", "-m", "app.continuous_worker"]
          envFrom:
            - configMapRef:
                name: {{ .Values.continuousWorker.backendConfigMapName }}
            - secretRef:
                name: {{ .Values.continuousWorker.backendRuntimeSecretName }}
          env:
            - {name: ASKLAKE_CONTINUOUS_CONTROL_PLANE, value: local}
            - {name: CONTINUOUS_CONTROL_PLANE, value: worker}
            - {name: CONTINUOUS_WORKER_SCOPE, value: continuous_sql}
            - {name: CONTINUOUS_WORKER_OWNER, value: eks-continuous-worker-v2}
            - {name: CONTINUOUS_WORKER_GENERATION, value: {{ .Values.ownership.generation | quote }}}
            - {name: STARTUP_SCHEMA_MANAGEMENT_ENABLED, value: "false"}
            - {name: CONTINUOUS_SQL_JOIN_ENABLED, value: "true"}
            - {name: CLICKHOUSE_CONTINUOUS_JOIN_ENABLED, value: "false"}
            - {name: CLICKHOUSE_REALTIME_V2_ENABLED, value: "true"}
            - {name: KAFKA_CONNECT_SINK_ENABLED, value: "true"}
            - {name: CLICKHOUSE_REALTIME_CONSUMER_OWNER, value: kafka_connect_v2}
            - {name: KAFKA_CONNECT_URL, value: "http://asklake-kafka-connect-v2:8083"}
            - {name: CLICKHOUSE_V2_URL, value: "https://asklake-clickhouse-v2:8443"}
            - {name: CLICKHOUSE_V2_DATABASE, value: asklake_realtime_v2}
            - {name: CLICKHOUSE_V2_MATERIALIZER_USER, value: asklake_v2_materializer}
            - name: CLICKHOUSE_V2_MATERIALIZER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.continuousWorker.realtimeRuntimeSecret.name }}
                  key: {{ .Values.continuousWorker.realtimeRuntimeSecret.materializerPasswordKey }}
            - {name: CLICKHOUSE_V2_READER_USER, value: asklake_v2_reader}
            - name: CLICKHOUSE_V2_READER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.continuousWorker.realtimeRuntimeSecret.name }}
                  key: {{ .Values.continuousWorker.realtimeRuntimeSecret.readerPasswordKey }}
            - {name: CLICKHOUSE_V2_TLS_CA_FILE, value: /var/run/asklake/realtime/ca.crt}
          startupProbe:
            exec:
              command: ["python", "-c", "import app.continuous_worker"]
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "import socket; [socket.create_connection(x, 3).close() for x in [('asklake-clickhouse-v2', 8443), ('asklake-kafka-connect-v2', 8083)]]"
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["python", "-c", "import os; os.kill(1, 0)"]
            periodSeconds: 30
            failureThreshold: 3
          resources:
            {{- toYaml .Values.continuousWorker.resources | nindent 12 }}
          volumeMounts:
            - name: realtime-ca
              mountPath: /var/run/asklake/realtime/ca.crt
              subPath: ca.crt
              readOnly: true
      volumes:
        - name: realtime-ca
          secret:
            secretName: {{ .Values.continuousWorker.realtimeRuntimeSecret.name }}
            defaultMode: 0400
            items:
              - key: {{ .Values.continuousWorker.realtimeRuntimeSecret.caKey }}
                path: ca.crt
{{- end }}
{{- end }}
