{{- if ne .Values.mode "disabled" }}
apiVersion: v1
kind: Service
metadata:
  name: asklake-clickhouse-keeper-v2-headless
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "asklake-realtime.labels" . | nindent 4 }}
    app.kubernetes.io/component: keeper
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "asklake-realtime.selectorLabels" (dict "component" "keeper" "release" .Release.Name) | nindent 4 }}
  ports:
    - name: keeper-client
      port: 9181
      targetPort: keeper-client
    - name: keeper-raft
      port: 9234
      targetPort: keeper-raft
---
apiVersion: v1
kind: Service
metadata:
  name: asklake-clickhouse-v2-headless
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "asklake-realtime.labels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "asklake-realtime.selectorLabels" (dict "component" "clickhouse" "release" .Release.Name) | nindent 4 }}
  ports:
    - name: https
      port: 8443
      targetPort: https
    - name: native-secure
      port: 9440
      targetPort: native-secure
    - name: interserver
      port: 9010
      targetPort: interserver
---
apiVersion: v1
kind: Service
metadata:
  name: asklake-clickhouse-v2
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "asklake-realtime.labels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse
spec:
  type: ClusterIP
  selector:
    {{- include "asklake-realtime.selectorLabels" (dict "component" "clickhouse" "release" .Release.Name) | nindent 4 }}
  ports:
    - name: https
      port: 8443
      targetPort: https
    - name: native-secure
      port: 9440
      targetPort: native-secure
---
apiVersion: v1
kind: Service
metadata:
  name: asklake-kafka-connect-v2
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "asklake-realtime.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka-connect
spec:
  type: ClusterIP
  selector:
    {{- include "asklake-realtime.selectorLabels" (dict "component" "kafka-connect" "release" .Release.Name) | nindent 4 }}
  ports:
    - name: rest
      port: 8083
      targetPort: rest
{{- end }}
