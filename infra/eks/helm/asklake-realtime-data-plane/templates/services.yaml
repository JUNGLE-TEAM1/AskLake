{{- if ne .Values.mode "disabled" }}
apiVersion: v1
kind: Service
metadata:
  name: clickhouse-keeper-v2
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "asklake-realtime.labels" . | nindent 4 }}
    app.kubernetes.io/component: keeper
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: asklake-workloads
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/component: realtime-v2-keeper
  ports:
    - name: keeper-client
      port: 9181
      targetPort: keeper-client
    - name: keeper-raft
      port: 9234
      targetPort: keeper-raft
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse-v2
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "asklake-realtime.labels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: asklake-workloads
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/component: realtime-v2-clickhouse
  ports:
    - name: https
      port: 8443
      targetPort: https
    - name: native-secure
      port: 9440
      targetPort: native-secure
    - name: interserver
      port: 9010
      targetPort: interserver
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-connect-v2
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "asklake-realtime.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka-connect
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: asklake-workloads
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/component: realtime-v2-connect
  ports:
    - name: rest
      port: 8083
      targetPort: rest
{{- end }}
