enabled: false
deploymentProfile: standard
namespace: asklake-dev
environment: dev

readiness:
  foundationReady: false
  generalNodePoolReady: false
  imageReceiptVerified: false
  runtimeConfigReady: false
  runtimeSecretReady: false
  backendRuntimeBoundaryReady: false

placement:
  nodeSelector:
    asklake.io/workload-class: general
    kubernetes.io/arch: amd64

frontend:
  image: ""
  replicaCount: 0
  serviceAccountName: asklake-frontend
  service:
    name: frontend
    type: ClusterIP
    port: 80
  resources: {}

backend:
  image: ""
  replicaCount: 0
  terminationGracePeriodSeconds: 360
  preStopDelaySeconds: 310
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 60
    behavior:
      scaleUp:
        stabilizationWindowSeconds: 0
        pods: 2
        periodSeconds: 30
      scaleDown:
        stabilizationWindowSeconds: 300
        pods: 1
        periodSeconds: 60
  serviceAccountName: asklake-backend
  service:
    name: fastapi
    type: ClusterIP
    port: 8080
  runtimeConfigMapName: asklake-runtime
  runtimeBoundaryConfigMapName: asklake-runtime-boundary
  runtimeConfigRevision: ""
  runtimeSecretName: asklake-backend-runtime
  trinoRuntimeSecretName: asklake-backend-runtime
  runtimeSecretTrinoCaKey: trino-ca.pem
  kafkaAllowedTopicPrefixes: asklake.
  realtime:
    enabled: false
    apiControlPlane: external_ec2
    v1ApiEnabled: false
    v1OwnerGeneration: ""
    continuousSqlJoinEnabled: false
    dashboardSyncMode: polling
    realtimeEventsEnabled: false
  resources: {}

aiGateway:
  enabled: false
  image: ""
  replicaCount: 0
  serviceAccountName: asklake-ai-gateway
  service:
    name: ai-gateway
    type: ClusterIP
    port: 8090
  runtimeSecretName: asklake-ai-gateway-runtime
  runtimeSecretKeys:
    internalAuthToken: AI_GATEWAY_SERVICE_TOKEN
    mcpServiceToken: AI_MCP_SERVICE_TOKEN
    providerApiKey: AI_PROVIDER_API_KEY
  provider: openai_compatible
  providerBaseUrl: https://api.openai.com/v1
  providerModel: gpt-4.1-mini
  mcpServerUrl: http://fastapi:8080/internal/mcp
  requestTimeoutSeconds: 30
  resources: {}

collector:
  enabled: true
  replicaCount: 1
  serviceAccountName: asklake-backend
  resources: {}
