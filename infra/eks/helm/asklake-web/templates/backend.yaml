{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "asklake-web.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      app.kubernetes.io/name: asklake
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "asklake-web.labels" . | nindent 8 }}
        app.kubernetes.io/component: backend
      annotations:
        asklake.io/runtime-boundary-configmap: {{ .Values.backend.runtimeBoundaryConfigMapName | quote }}
        {{- with .Values.backend.runtimeConfigRevision }}
        asklake.io/runtime-config-revision: {{ . | quote }}
        {{- end }}
    spec:
      serviceAccountName: {{ .Values.backend.serviceAccountName }}
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: {{ .Values.backend.terminationGracePeriodSeconds }}
      nodeSelector:
        {{- toYaml .Values.placement.nodeSelector | nindent 8 }}
      containers:
        - name: fastapi
          image: {{ .Values.backend.image | quote }}
          imagePullPolicy: IfNotPresent
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - {{ printf "sleep %d" (int .Values.backend.preStopDelaySeconds) | quote }}
          envFrom:
            - configMapRef:
                name: {{ .Values.backend.runtimeConfigMapName }}
            - secretRef:
                name: {{ .Values.backend.runtimeSecretName }}
            {{- if ne .Values.backend.trinoRuntimeSecretName .Values.backend.runtimeSecretName }}
            - secretRef:
                name: {{ .Values.backend.trinoRuntimeSecretName }}
            {{- end }}
          {{- if .Values.backend.realtime.enabled }}
          env:
            - {name: ASKLAKE_CONTINUOUS_CONTROL_PLANE, value: {{ .Values.backend.realtime.apiControlPlane | quote }}}
            - {name: CONTINUOUS_CONTROL_PLANE, value: "disabled"}
            - {name: CONTINUOUS_SQL_JOIN_ENABLED, value: {{ .Values.backend.realtime.continuousSqlJoinEnabled | quote }}}
            - {name: DASHBOARD_SYNC_MODE, value: {{ .Values.backend.realtime.dashboardSyncMode | quote }}}
            - {name: REALTIME_EVENTS_ENABLED, value: {{ .Values.backend.realtime.realtimeEventsEnabled | quote }}}
            - {name: CLICKHOUSE_CONTINUOUS_JOIN_ENABLED, value: "false"}
            - {name: CLICKHOUSE_REALTIME_V2_ENABLED, value: {{ .Values.backend.realtime.clickhouseRealtimeV2Enabled | quote }}}
            - {name: KAFKA_CONNECT_SINK_ENABLED, value: {{ .Values.backend.realtime.kafkaConnectSinkEnabled | quote }}}
            - {name: CLICKHOUSE_REALTIME_CONSUMER_OWNER, value: {{ .Values.backend.realtime.consumerOwner | quote }}}
            - {name: KAFKA_CONNECT_URL, value: {{ .Values.backend.realtime.kafkaConnectUrl | quote }}}
            - {name: KAFKA_CONNECT_CONNECTOR_NAME, value: {{ .Values.backend.realtime.connectorName | quote }}}
            - {name: CLICKHOUSE_V2_URL, value: {{ .Values.backend.realtime.clickhouseV2Url | quote }}}
            - {name: CLICKHOUSE_V2_DATABASE, value: {{ .Values.backend.realtime.clickhouseV2Database | quote }}}
            - {name: CLICKHOUSE_V2_MATERIALIZER_USER, value: "asklake_v2_materializer"}
            - name: CLICKHOUSE_V2_MATERIALIZER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.realtime.runtimeSecret.name }}
                  key: {{ .Values.backend.realtime.runtimeSecret.materializerPasswordKey }}
            - {name: CLICKHOUSE_V2_READER_USER, value: "asklake_v2_reader"}
            - name: CLICKHOUSE_V2_READER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.realtime.runtimeSecret.name }}
                  key: {{ .Values.backend.realtime.runtimeSecret.readerPasswordKey }}
            - {name: CLICKHOUSE_V2_TLS_CA_FILE, value: "/var/run/asklake/secrets/clickhouse-v2-ca.crt"}
          {{- end }}
          volumeMounts:
            - name: backend-runtime-files
              mountPath: /var/run/asklake/secrets
              readOnly: true
            {{- if .Values.backend.realtime.enabled }}
            - name: backend-realtime-files
              mountPath: /var/run/asklake/secrets/clickhouse-v2-ca.crt
              subPath: clickhouse-v2-ca.crt
              readOnly: true
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet: { path: /api/health, port: http }
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
      volumes:
        - name: backend-runtime-files
          secret:
            secretName: {{ .Values.backend.trinoRuntimeSecretName }}
            items:
              - key: {{ .Values.backend.runtimeSecretTrinoCaKey }}
                path: trino-ca.pem
        {{- if .Values.backend.realtime.enabled }}
        - name: backend-realtime-files
          secret:
            secretName: {{ .Values.backend.realtime.runtimeSecret.name }}
            defaultMode: 0400
            items:
              - key: {{ .Values.backend.realtime.runtimeSecret.caKey }}
                path: clickhouse-v2-ca.crt
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.backend.service.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "asklake-web.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.backend.service.type }}
  selector:
    app.kubernetes.io/name: asklake
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
{{- end }}
