{{- if and .Values.enabled .Values.backend.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: asklake-backend-migration
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "asklake-web.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend-migration
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  activeDeadlineSeconds: {{ .Values.backend.migration.activeDeadlineSeconds }}
  backoffLimit: {{ .Values.backend.migration.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "asklake-web.labels" . | nindent 8 }}
        app.kubernetes.io/component: backend-migration
    spec:
      restartPolicy: Never
      serviceAccountName: {{ .Values.backend.serviceAccountName }}
      automountServiceAccountToken: false
      nodeSelector:
        {{- toYaml .Values.placement.nodeSelector | nindent 8 }}
      containers:
        - name: backend-migration
          image: {{ .Values.backend.image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              python -m app.migrations.run_metadata_schema
              python -m alembic upgrade head
          envFrom:
            - configMapRef:
                name: {{ .Values.backend.runtimeConfigMapName }}
            - secretRef:
                name: {{ .Values.backend.runtimeSecretName }}
          env:
            - {name: STARTUP_SCHEMA_MANAGEMENT_ENABLED, value: "true"}
            - {name: PGOPTIONS, value: "-c lock_timeout=5000 -c idle_in_transaction_session_timeout=60000"}
          resources:
            {{- toYaml .Values.backend.migration.resources | nindent 12 }}
{{- end }}
