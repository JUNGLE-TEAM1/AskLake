{{- if and .Values.enabled .Values.aiGateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-gateway
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "asklake-web.labels" . | nindent 4 }}
    app.kubernetes.io/component: ai-gateway
spec:
  replicas: {{ .Values.aiGateway.replicaCount }}
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: asklake
      app.kubernetes.io/component: ai-gateway
  template:
    metadata:
      labels:
        {{- include "asklake-web.labels" . | nindent 8 }}
        app.kubernetes.io/component: ai-gateway
    spec:
      serviceAccountName: {{ .Values.aiGateway.serviceAccountName }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      nodeSelector:
        {{- toYaml .Values.placement.nodeSelector | nindent 8 }}
      containers:
        - name: ai-gateway
          image: {{ .Values.aiGateway.image | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          env:
            - name: APP_ENV
              value: production
            - name: INTERNAL_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.aiGateway.runtimeSecretName }}
                  key: {{ .Values.aiGateway.runtimeSecretKeys.internalAuthToken }}
            - name: PROVIDER
              value: {{ .Values.aiGateway.provider | quote }}
            - name: PROVIDER_BASE_URL
              value: {{ .Values.aiGateway.providerBaseUrl | quote }}
            - name: PROVIDER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.aiGateway.runtimeSecretName }}
                  key: {{ .Values.aiGateway.runtimeSecretKeys.providerApiKey }}
            - name: PROVIDER_MODEL
              value: {{ .Values.aiGateway.providerModel | quote }}
            - name: MCP_ENABLED
              value: "true"
            - name: MCP_SERVER_URL
              value: {{ .Values.aiGateway.mcpServerUrl | quote }}
            - name: MCP_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.aiGateway.runtimeSecretName }}
                  key: {{ .Values.aiGateway.runtimeSecretKeys.mcpServiceToken }}
            - name: REQUEST_TIMEOUT_SECONDS
              value: {{ .Values.aiGateway.requestTimeoutSeconds | quote }}
          ports:
            - name: http
              containerPort: 8090
              protocol: TCP
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.aiGateway.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.aiGateway.service.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "asklake-web.labels" . | nindent 4 }}
    app.kubernetes.io/component: ai-gateway
spec:
  type: {{ .Values.aiGateway.service.type }}
  selector:
    app.kubernetes.io/name: asklake
    app.kubernetes.io/component: ai-gateway
  ports:
    - name: http
      port: {{ .Values.aiGateway.service.port }}
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ai-gateway-private
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "asklake-web.labels" . | nindent 4 }}
    app.kubernetes.io/component: ai-gateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: asklake
      app.kubernetes.io/component: ai-gateway
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: asklake
              app.kubernetes.io/component: backend
      ports:
        - protocol: TCP
          port: 8090
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: asklake
              app.kubernetes.io/component: backend
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
{{- end }}
