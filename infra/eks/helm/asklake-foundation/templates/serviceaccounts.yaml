{{- range $component, $serviceAccount := .Values.serviceAccounts }}
{{- if $serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $serviceAccount.name }}
  namespace: {{ $.Values.namespace.name }}
  labels:
    {{- include "asklake-foundation.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component | kebabcase | quote }}
  {{- with $serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ $serviceAccount.automountServiceAccountToken }}
{{- end }}
{{- end }}
