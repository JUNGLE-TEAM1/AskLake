server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Local Compose builds intentionally use a same-origin API path.  Without
  # this proxy, POST /api/* is handled as a static-file request and fails with
  # 405 before it can reach FastAPI (including the login request).
  resolver 127.0.0.11 ipv6=off valid=10s;

  location /api/ {
    set $asklake_backend http://backend:8080;
    proxy_pass $asklake_backend;
    # Local HTTP runs cannot return a Secure session cookie to the browser.
    # Keep the backend's production default intact and remove Secure only at
    # this localhost HTTP proxy boundary.
    proxy_cookie_flags asklake_session nosecure;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # The Codex local browser blocks direct navigation/fetches to localhost
  # /api/* paths. Keep the normal /api proxy and expose an equivalent local
  # alias so the built app can be exercised in that browser as well.
  location /backend/ {
    set $asklake_backend http://backend:8080;
    rewrite ^/backend/(.*)$ /$1 break;
    proxy_pass $asklake_backend;
    proxy_cookie_flags asklake_session nosecure;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
