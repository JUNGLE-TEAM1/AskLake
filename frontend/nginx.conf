server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Same-origin frontend builds send every live API request to /api/*. Resolve
  # the Compose backend dynamically so a recreated container is picked up.
  resolver 127.0.0.11 ipv6=off valid=10s;

  location /api/ {
    set $asklake_backend http://backend:8080;
    proxy_pass $asklake_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
