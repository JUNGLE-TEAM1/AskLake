server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Local Compose builds intentionally use a same-origin API path.  Without
  # this proxy, POST /api/* is handled as a static-file request and fails with
  # 405 before it can reach FastAPI (including the login request).
  resolver 127.0.0.11 ipv6=off valid=10s;

  location /api/ {
    set $asklake_backend http://backend:8080;
    proxy_pass $asklake_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
