name: asklake-preflight-fixture

services:
  backend:
    image: busybox:1.36
    environment:
      CLICKHOUSE_REALTIME_V2_ENABLED: ${CLICKHOUSE_REALTIME_V2_ENABLED:-false}
      KAFKA_CONNECT_SINK_ENABLED: ${KAFKA_CONNECT_SINK_ENABLED:-false}
      CLICKHOUSE_REALTIME_CONSUMER_OWNER: ${CLICKHOUSE_REALTIME_CONSUMER_OWNER:-disabled}
      KAFKA_CONNECT_URL: ${KAFKA_CONNECT_URL:-}
      KAFKA_CONNECT_CONNECTOR_NAME: ${KAFKA_CONNECT_CONNECTOR_NAME:-asklake-clickhouse-realtime-v2}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}

  minio:
    image: busybox:1.36
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}

  minio-init:
    image: busybox:1.36
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
