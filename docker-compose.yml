x-airflow-common:
  &airflow-common
  image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:3.3.0}
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_API_AUTH_JWT_SECRET:-asklake_airflow_jwt_secret}
    AIRFLOW__API_AUTH__JWT_ISSUER: ${AIRFLOW_API_AUTH_JWT_ISSUER:-asklake}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW_INTERNAL_BASE_URL: ${AIRFLOW_INTERNAL_BASE_URL:-http://host.docker.internal:8080}
    AIRFLOW_INTERNAL_TOKEN: ${AIRFLOW_INTERNAL_TOKEN:-asklake-local-airflow-token}
    AIRFLOW_INTERNAL_TIMEOUT_SECONDS: ${AIRFLOW_INTERNAL_TIMEOUT_SECONDS:-1800}
    AIRFLOW_CONFIG: /opt/airflow/config/airflow.cfg
    ASKLAKE_EXECUTION_API_BASE_URL: ${ASKLAKE_EXECUTION_API_BASE_URL:-http://host.docker.internal:8080}
    ASKLAKE_EXECUTION_API_TOKEN: ${AIRFLOW_EXECUTION_API_TOKEN:-asklake-local-airflow-execution}
    ASKLAKE_EXECUTION_API_TIMEOUT_SECONDS: ${ASKLAKE_EXECUTION_API_TIMEOUT_SECONDS:-930}
    _PIP_ADDITIONAL_REQUIREMENTS: ""
  volumes:
    - ${AIRFLOW_PROJ_DIR:-./airflow}/dags:/opt/airflow/dags
    - ${AIRFLOW_PROJ_DIR:-./airflow}/logs:/opt/airflow/logs
    - ${AIRFLOW_PROJ_DIR:-./airflow}/config:/opt/airflow/config
    - ${AIRFLOW_PROJ_DIR:-./airflow}/plugins:/opt/airflow/plugins
  user: "${AIRFLOW_UID:-50000}:0"
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    airflow-postgres:
      condition: service_healthy

services:
  airflow-postgres:
    image: postgres:16
    container_name: asklake-airflow-postgres
    environment:
      POSTGRES_DB: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_USER: airflow
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    volumes:
      - asklake_airflow_postgres_data:/var/lib/postgresql/data

  airflow-init:
    <<: *airflow-common
    container_name: asklake-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/{logs,dags,plugins,config}
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/{logs,dags,plugins,config}
        /entrypoint airflow version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_PASSWORD:-airflow}
    user: "0:0"

  airflow-apiserver:
    <<: *airflow-common
    container_name: asklake-airflow-apiserver
    command: api-server
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 30s
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: asklake-airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob"]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 30s
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    container_name: asklake-airflow-dag-processor
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob"]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 30s
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    container_name: m3-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_PASSWORD: wishuponastar
      MINIO_ROOT_USER: m3admin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - asklake_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20

  trino-storage-bootstrap:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    container_name: asklake-trino-storage-bootstrap
    restart: "no"
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: m3admin
      MINIO_SECRET_KEY: wishuponastar
      TRINO_ICEBERG_WAREHOUSE_BUCKET: asklake-warehouse
      TRINO_RESULT_STORAGE_BUCKET: asklake-query-results
      TRINO_S3_ACCESS_KEY: asklake-trino
      TRINO_S3_SECRET_KEY: asklake-trino-local-secret
      TRINO_RESULT_STORAGE_ACCESS_KEY: asklake-query-results
      TRINO_RESULT_STORAGE_SECRET_KEY: asklake-query-results-local-secret
    entrypoint: ["/bin/sh", "/bootstrap/bootstrap-trino-storage.sh"]
    volumes:
      - ./deploy/minio/bootstrap-trino-storage.sh:/bootstrap/bootstrap-trino-storage.sh:ro
    depends_on:
      minio:
        condition: service_healthy

  trino-postgres-bootstrap:
    image: postgres:16-alpine
    container_name: asklake-trino-postgres-bootstrap
    restart: "no"
    environment:
      POSTGRES_DB: asklake
      POSTGRES_PASSWORD: asklake_dev
      POSTGRES_USER: asklake
      TRINO_ICEBERG_ALLOW_POSTGRES_USER: "true"
      TRINO_ICEBERG_JDBC_PASSWORD: asklake_dev
      TRINO_ICEBERG_JDBC_USER: asklake
    entrypoint: ["/bin/sh", "/bootstrap/bootstrap-trino-catalog.sh"]
    volumes:
      - ./deploy/postgres/bootstrap-trino-catalog.sh:/bootstrap/bootstrap-trino-catalog.sh:ro
    depends_on:
      postgres:
        condition: service_healthy

  trino:
    image: ${TRINO_IMAGE:-trinodb/trino:482}
    container_name: asklake-trino
    environment:
      TRINO_ICEBERG_CATALOG_NAME: asklake
      TRINO_ICEBERG_JDBC_DATABASE: asklake
      TRINO_ICEBERG_JDBC_PASSWORD: asklake_dev
      TRINO_ICEBERG_JDBC_USER: asklake
      TRINO_ICEBERG_WAREHOUSE_BUCKET: asklake-warehouse
      TRINO_ICEBERG_WAREHOUSE_PREFIX: warehouse
      TRINO_S3_ACCESS_KEY: asklake-trino
      TRINO_S3_ENDPOINT: http://minio:9000
      TRINO_S3_REGION: us-east-1
      TRINO_S3_SECRET_KEY: asklake-trino-local-secret
    ports:
      - "8088:8080"
    volumes:
      - ./deploy/trino/etc/catalog:/etc/trino/catalog:ro
    depends_on:
      trino-storage-bootstrap:
        condition: service_completed_successfully
      trino-postgres-bootstrap:
        condition: service_completed_successfully

  redpanda:
    image: redpandadata/redpanda:v24.3.1
    container_name: asklake-redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    volumes:
      - asklake_redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --api-urls localhost:9644 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - default
      - clickhouse_v2_internal

  clickhouse:
    image: clickhouse/clickhouse-server:25.8.28.1
    container_name: asklake-clickhouse
    environment:
      CLICKHOUSE_DB: asklake
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      CLICKHOUSE_PASSWORD: asklake_clickhouse_dev
      CLICKHOUSE_USER: asklake
    ports:
      - "8123:8123"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - asklake_clickhouse_data:/var/lib/clickhouse
      - ./deploy/clickhouse/config.d/kafka.xml:/etc/clickhouse-server/config.d/kafka.xml:ro
    depends_on:
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user asklake --password asklake_clickhouse_dev --query 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  clickhouse-keeper-v2:
    profiles: ["clickhouse-realtime-v2"]
    image: ${CLICKHOUSE_V2_IMAGE:-clickhouse/clickhouse-server:26.3.17.4@sha256:85c434814ac8905e5648027ce926f74ab067edd6aadbccb6c0c165cd3571ea49}
    container_name: asklake-clickhouse-keeper-v2
    command:
      - clickhouse-keeper
      - --config-file=/etc/clickhouse-keeper/keeper-config.xml
    security_opt:
      - no-new-privileges:true
    volumes:
      - asklake_clickhouse_keeper_v2_data:/var/lib/clickhouse-keeper
      - ./deploy/clickhouse-v2/keeper-config.xml:/etc/clickhouse-keeper/keeper-config.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse keeper-client --host 127.0.0.1 --port 9181 --query ruok 2>/dev/null | grep -q imok"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - clickhouse_v2_internal

  clickhouse-v2:
    profiles: ["clickhouse-realtime-v2"]
    image: ${CLICKHOUSE_V2_IMAGE:-clickhouse/clickhouse-server:26.3.17.4@sha256:85c434814ac8905e5648027ce926f74ab067edd6aadbccb6c0c165cd3571ea49}
    container_name: asklake-clickhouse-v2
    # Root is used only by the pinned official entrypoint to prepare runtime
    # files; the ClickHouse server is exec'd as numeric uid/gid 101:101.
    user: "0:0"
    security_opt:
      - no-new-privileges:true
    entrypoint:
      - /bin/bash
      - /usr/local/bin/asklake-clickhouse-v2-entrypoint.sh
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_V2_DATABASE:-asklake_realtime_v2}
      CLICKHOUSE_ALWAYS_RUN_INITDB_SCRIPTS: "1"
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_V2_ADMIN_PASSWORD:-replace-with-local-clickhouse-v2-admin-password}
      CLICKHOUSE_USER: ${CLICKHOUSE_V2_ADMIN_USER:-asklake_v2_admin}
      CLICKHOUSE_V2_INGEST_PASSWORD: ${CLICKHOUSE_V2_INGEST_PASSWORD:-replace-with-local-clickhouse-v2-ingest-password}
      CLICKHOUSE_V2_MATERIALIZER_PASSWORD: ${CLICKHOUSE_V2_MATERIALIZER_PASSWORD:-replace-with-local-clickhouse-v2-materializer-password}
      CLICKHOUSE_V2_READER_PASSWORD: ${CLICKHOUSE_V2_READER_PASSWORD:-replace-with-local-clickhouse-v2-reader-password}
      CLICKHOUSE_V2_MIGRATION_PASSWORD: ${CLICKHOUSE_V2_MIGRATION_PASSWORD:-replace-with-local-clickhouse-v2-migration-password}
      CLICKHOUSE_V2_OBSERVER_PASSWORD: ${CLICKHOUSE_V2_OBSERVER_PASSWORD:-replace-with-local-clickhouse-v2-observer-password}
    ports:
      - "127.0.0.1:${CLICKHOUSE_V2_HTTP_PORT:-18123}:8123"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - asklake_clickhouse_v2_data:/var/lib/clickhouse
      - ./deploy/clickhouse-v2/config.d/keeper.xml:/etc/clickhouse-server/config.d/keeper.xml:ro
      - ./deploy/clickhouse-v2/entrypoint.sh:/usr/local/bin/asklake-clickhouse-v2-entrypoint.sh:ro
      - ./deploy/clickhouse-v2/initdb:/opt/asklake-clickhouse-v2-initdb:ro
    depends_on:
      clickhouse-keeper-v2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user asklake_v2_reader --password \"$$CLICKHOUSE_V2_READER_PASSWORD\" --query 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - clickhouse_v2_internal

  kafka-connect-v2:
    profiles: ["clickhouse-realtime-v2"]
    image: ${KAFKA_CONNECT_V2_IMAGE:-asklake/kafka-connect-clickhouse:1.4.0}
    build:
      context: ./deploy/kafka-connect
    container_name: asklake-kafka-connect-v2
    # The image wrapper copies the host-only secret into tmpfs and then
    # exec-drops the worker to the pinned appuser uid/gid 1000:1000.
    user: "0:0"
    entrypoint:
      - /usr/local/bin/asklake-kafka-connect-v2-entrypoint.sh
    security_opt:
      - no-new-privileges:true
    environment:
      CONNECT_BOOTSTRAP_SERVERS: redpanda:9092
      CONNECT_CONFIG_PROVIDERS: file
      CONNECT_CONFIG_PROVIDERS_FILE_CLASS: org.apache.kafka.common.config.provider.FileConfigProvider
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_CONFIG_STORAGE_TOPIC: _asklake_clickhouse_v2_connect_configs
      CONNECT_CONNECTOR_CLIENT_CONFIG_OVERRIDE_POLICY: All
      CONNECT_GROUP_ID: asklake-clickhouse-v2-connect
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_LOG4J_ROOT_LOGLEVEL: INFO
      CONNECT_OFFSET_FLUSH_INTERVAL_MS: "10000"
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_OFFSET_STORAGE_TOPIC: _asklake_clickhouse_v2_connect_offsets
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect-v2
      CONNECT_REST_PORT: "8083"
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_STATUS_STORAGE_TOPIC: _asklake_clickhouse_v2_connect_status
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      KAFKA_HEAP_OPTS: ${KAFKA_CONNECT_V2_HEAP_OPTS:--Xms512m -Xmx1g}
    ports:
      - "127.0.0.1:${KAFKA_CONNECT_V2_PORT:-18083}:8083"
    tmpfs:
      - /run/secrets:rw,noexec,nosuid,nodev,mode=0700,uid=1000,gid=1000
    volumes:
      - ${KAFKA_CONNECT_V2_SECRETS_FILE:-./deploy/kafka-connect/secrets.example.properties}:/run/asklake-secrets-source/kafka-connect/asklake-clickhouse-v2.properties:ro
    depends_on:
      redpanda:
        condition: service_healthy
      clickhouse-v2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "/usr/sbin/chroot --userspec=1000:1000 / curl --fail --silent http://127.0.0.1:8083/connector-plugins | grep -q com.clickhouse.kafka.connect.ClickHouseSinkConnector"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    networks:
      - clickhouse_v2_internal
  postgres:
    image: postgres:16-alpine
    container_name: asklake-postgres
    environment:
      POSTGRES_DB: asklake
      POSTGRES_PASSWORD: asklake_dev
      POSTGRES_USER: asklake
    ports:
      - "54328:5432"
    volumes:
      - asklake_postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asklake -d asklake"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  asklake_airflow_postgres_data:
  asklake_clickhouse_keeper_v2_data:
  asklake_clickhouse_v2_data:
  asklake_clickhouse_data:
  asklake_minio_data:
  asklake_postgres_data:
  asklake_redpanda_data:

networks:
  clickhouse_v2_internal:
    internal: true
