name: ${COMPOSE_PROJECT_NAME:-asklake}

x-airflow-common:
  &airflow-common
  image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:3.3.0}
  restart: unless-stopped
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_METADATA_DB_USER:-airflow}:${AIRFLOW_METADATA_DB_PASSWORD:?AIRFLOW_METADATA_DB_PASSWORD is required}@airflow-postgres/${AIRFLOW_METADATA_DB_NAME:-airflow}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_API_AUTH_JWT_SECRET:?AIRFLOW_API_AUTH_JWT_SECRET is required}
    AIRFLOW__API_AUTH__JWT_ISSUER: ${AIRFLOW_API_AUTH_JWT_ISSUER:-asklake}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW_INTERNAL_BASE_URL: ${AIRFLOW_INTERNAL_BASE_URL:-http://backend:8080}
    AIRFLOW_INTERNAL_TOKEN: ${AIRFLOW_INTERNAL_TOKEN:?AIRFLOW_INTERNAL_TOKEN is required}
    AIRFLOW_INTERNAL_TIMEOUT_SECONDS: ${AIRFLOW_INTERNAL_TIMEOUT_SECONDS:-1800}
    AIRFLOW_CONFIG: /opt/airflow/config/airflow.cfg
    ASKLAKE_EXECUTION_API_BASE_URL: ${ASKLAKE_EXECUTION_API_BASE_URL:-http://backend:8080}
    ASKLAKE_EXECUTION_API_TOKEN: ${AIRFLOW_EXECUTION_API_TOKEN:?AIRFLOW_EXECUTION_API_TOKEN is required}
    ASKLAKE_EXECUTION_API_TIMEOUT_SECONDS: ${ASKLAKE_EXECUTION_API_TIMEOUT_SECONDS:-7500}
    ASKLAKE_RAG_SPARK_REST_URL: ${ASKLAKE_RAG_SPARK_REST_URL:-http://spark-master:6066}
    ASKLAKE_RAG_PARENT_SCRIPT: ${ASKLAKE_RAG_PARENT_SCRIPT:-/opt/asklake/scripts/rag_parent_staging.py}
    ASKLAKE_RAG_SPARK_TIMEOUT_SECONDS: ${ASKLAKE_RAG_SPARK_TIMEOUT_SECONDS:-7200}
    ASKLAKE_RAG_SPARK_POLL_SECONDS: ${ASKLAKE_RAG_SPARK_POLL_SECONDS:-5}
    ASKLAKE_SPARK_MASTER_URL: ${ASKLAKE_SPARK_MASTER_URL:-spark://spark-master:7077}
    ASKLAKE_SPARK_ICEBERG_PACKAGE: ${ASKLAKE_SPARK_ICEBERG_PACKAGE:-org.apache.iceberg:iceberg-spark-runtime-4.0_2.13:1.11.0}
    ASKLAKE_SPARK_HADOOP_AWS_PACKAGE: ${ASKLAKE_SPARK_HADOOP_AWS_PACKAGE:-org.apache.hadoop:hadoop-aws:3.4.1}
    ASKLAKE_SPARK_POSTGRES_PACKAGE: ${ASKLAKE_SPARK_POSTGRES_PACKAGE:-org.postgresql:postgresql:42.7.7}
    ASKLAKE_SPARK_ICEBERG_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
    ASKLAKE_SPARK_ICEBERG_JDBC_USER: ${TRINO_ICEBERG_JDBC_USER:-${POSTGRES_USER:?POSTGRES_USER is required}}
    ASKLAKE_SPARK_ICEBERG_JDBC_PASSWORD: ${TRINO_ICEBERG_JDBC_PASSWORD:-${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}}
    ASKLAKE_SPARK_ICEBERG_WAREHOUSE: s3a://${TRINO_ICEBERG_WAREHOUSE_BUCKET:-${ASKLAKE_SPARK_OUTPUT_BUCKET:?ASKLAKE_SPARK_OUTPUT_BUCKET is required}}/${TRINO_ICEBERG_WAREHOUSE_PREFIX:-warehouse}
    ASKLAKE_OBJECT_STORAGE_PROVIDER: ${ASKLAKE_OBJECT_STORAGE_PROVIDER:-aws}
    AWS_REGION: ${AWS_REGION:-ap-northeast-2}
    S3_ENDPOINT: ${S3_ENDPOINT:-}
    S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
    RAG_WORKER_BASE_URL: ${RAG_WORKER_BASE_URL:-http://embedding-worker:8090}
    RAG_WORKER_TOKEN: ${RAG_WORKER_TOKEN:?RAG_WORKER_TOKEN is required}
    RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-text-embedding-3-small}
    RAG_EMBEDDING_DIMENSIONS: ${RAG_EMBEDDING_DIMENSIONS:-1536}
    _PIP_ADDITIONAL_REQUIREMENTS: ""
  volumes:
    - ${AIRFLOW_PROJ_DIR:-../airflow}/dags:/opt/airflow/dags
    - ${AIRFLOW_PROJ_DIR:-../airflow}/logs:/opt/airflow/logs
    - ${AIRFLOW_PROJ_DIR:-../airflow}/config:/opt/airflow/config
    - ${AIRFLOW_PROJ_DIR:-../airflow}/plugins:/opt/airflow/plugins
    - ../backend/scripts:/opt/asklake/scripts:ro
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    airflow-postgres:
      condition: service_healthy

x-spark-runtime:
  &spark-runtime
  image: ${ASKLAKE_SPARK_RUNTIME_IMAGE:-asklake-spark:4.0.1}
  build:
    context: ../backend
    target: spark-runtime

services:
  opensearch:
    image: opensearchproject/opensearch:2.19.1
    restart: unless-stopped
    environment:
      discovery.type: single-node
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD:?OPENSEARCH_INITIAL_ADMIN_PASSWORD is required}
      OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
    expose:
      - "9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -ksSf -u \"admin:$${OPENSEARCH_INITIAL_ADMIN_PASSWORD}\" https://localhost:9200/_cluster/health >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2019/config/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?VITE_API_BASE_URL is required}
        VITE_AUTH_LEGACY_DEMO_USERS_ENABLED: ${VITE_AUTH_LEGACY_DEMO_USERS_ENABLED:-false}
        VITE_AUTH_PUBLIC_SIGNUP: ${VITE_AUTH_PUBLIC_SIGNUP:-false}
        VITE_USE_MOCK_API: ${VITE_USE_MOCK_API:-false}
        VITE_DASHBOARD_ASSISTANT_API_PATH: ${VITE_DASHBOARD_ASSISTANT_API_PATH:-/api/dashboards/assistant}
        VITE_OBJECT_STORAGE_PROVIDER: ${ASKLAKE_OBJECT_STORAGE_PROVIDER:-aws}
        VITE_S3_REGION: ${AWS_REGION:-ap-northeast-2}
        VITE_SPARK_OUTPUT_BUCKET: ${ASKLAKE_SPARK_OUTPUT_BUCKET:?ASKLAKE_SPARK_OUTPUT_BUCKET is required}
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ../backend
      target: backend-runtime
    restart: unless-stopped
    command:
      - python
      - /app/scripts/ensure_spark_runtime_paths.py
      - wait-backend-exec
      - --
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    depends_on:
      airflow-apiserver:
        condition: service_healthy
      aws-s3-readiness:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      spark-runtime-guard:
        condition: service_healthy
      spark-master:
        condition: service_healthy
      spark-worker:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      API_PREFIX: ${API_PREFIX:-/api}
      AUTH_LEGACY_DEMO_USERS_ENABLED: ${AUTH_LEGACY_DEMO_USERS_ENABLED:-false}
      AUTH_PUBLIC_SIGNUP_ENABLED: ${AUTH_PUBLIC_SIGNUP_ENABLED:-false}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-}
      BOOTSTRAP_ADMIN_DISPLAY_NAME: ${BOOTSTRAP_ADMIN_DISPLAY_NAME:-AskLake Administrator}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?BOOTSTRAP_ADMIN_EMAIL is required}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?BOOTSTRAP_ADMIN_PASSWORD is required}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-5}
      LOCAL_LAKE_STORAGE_DIR: ${LOCAL_LAKE_STORAGE_DIR:-/var/lib/asklake/lake}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_ASSISTANT_ENABLED: ${OPENAI_ASSISTANT_ENABLED:-true}
      OPENAI_ASSISTANT_MODEL: ${OPENAI_ASSISTANT_MODEL:-gpt-4o-mini}
      OPENAI_ASSISTANT_MAX_OUTPUT_TOKENS: ${OPENAI_ASSISTANT_MAX_OUTPUT_TOKENS:-1200}
      OPENAI_ASSISTANT_MAX_SAMPLE_ROWS: ${OPENAI_ASSISTANT_MAX_SAMPLE_ROWS:-5}
      OPENAI_ASSISTANT_TIMEOUT_SECONDS: ${OPENAI_ASSISTANT_TIMEOUT_SECONDS:-20}
      OPENAI_QUERY_AI_MODEL: ${OPENAI_QUERY_AI_MODEL:-gpt-4.1-mini}
      AI_QUERY_PROVIDER: ${AI_QUERY_PROVIDER:-gateway}
      AI_GATEWAY_BASE_URL: ${AI_GATEWAY_BASE_URL:-http://ai-server:8090}
      AI_GATEWAY_GENERATE_PATH: ${AI_GATEWAY_GENERATE_PATH:-/v1/generate}
      AI_GATEWAY_EMBEDDINGS_PATH: ${AI_GATEWAY_EMBEDDINGS_PATH:-/v1/embeddings}
      AI_GATEWAY_SERVICE_TOKEN: ${AI_GATEWAY_SERVICE_TOKEN:?AI_GATEWAY_SERVICE_TOKEN is required}
      AI_GATEWAY_TIMEOUT_SECONDS: ${AI_GATEWAY_TIMEOUT_SECONDS:-30}
      AI_GATEWAY_MAX_EMBEDDING_RESPONSE_BYTES: ${AI_GATEWAY_MAX_EMBEDDING_RESPONSE_BYTES:-8388608}
      AI_MCP_PATH: ${AI_MCP_PATH:-/internal/mcp}
      AI_MCP_SERVICE_TOKEN: ${AI_MCP_SERVICE_TOKEN:?AI_MCP_SERVICE_TOKEN is required}
      AI_CONTEXT_SIGNING_SECRET: ${AI_CONTEXT_SIGNING_SECRET:?AI_CONTEXT_SIGNING_SECRET is required}
      AI_CONTEXT_TTL_SECONDS: ${AI_CONTEXT_TTL_SECONDS:-300}
      AI_CONTEXT_MAX_SAMPLE_ROWS: ${AI_CONTEXT_MAX_SAMPLE_ROWS:-20}
      AIRFLOW_API_BASE_URL: ${AIRFLOW_API_BASE_URL:-http://airflow-apiserver:8080}
      AIRFLOW_DAG_ID: ${AIRFLOW_DAG_ID:-asklake_etl_job}
      RAG_AIRFLOW_DAG_ID: ${RAG_AIRFLOW_DAG_ID:-asklake_rag_index}
      AIRFLOW_UI_BASE_URL: ${AIRFLOW_UI_BASE_URL:-}
      AIRFLOW_API_TOKEN: ${AIRFLOW_API_TOKEN:-}
      AIRFLOW_USERNAME: ${AIRFLOW_USERNAME:-airflow}
      AIRFLOW_PASSWORD: ${AIRFLOW_PASSWORD:?AIRFLOW_PASSWORD is required}
      AIRFLOW_REQUEST_TIMEOUT_SECONDS: ${AIRFLOW_REQUEST_TIMEOUT_SECONDS:-10}
      AIRFLOW_RUN_SYNC_INTERVAL_SECONDS: ${AIRFLOW_RUN_SYNC_INTERVAL_SECONDS:-5}
      RAG_WORKER_BASE_URL: ${RAG_WORKER_BASE_URL:-http://embedding-worker:8090}
      RAG_WORKER_TOKEN: ${RAG_WORKER_TOKEN:?RAG_WORKER_TOKEN is required}
      RAG_JOB_STALE_SECONDS: ${RAG_JOB_STALE_SECONDS:-7200}
      OPENSEARCH_BASE_URL: ${OPENSEARCH_BASE_URL:-https://opensearch:9200}
      OPENSEARCH_USERNAME: ${OPENSEARCH_USERNAME:-admin}
      OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD:?OPENSEARCH_PASSWORD is required}
      OPENSEARCH_VERIFY_TLS: ${OPENSEARCH_VERIFY_TLS:-true}
      OPENSEARCH_CA_CERT: ${OPENSEARCH_CA_CERT:-}
      # Web/API replicas persist intent but never own Continuous Spark side
      # effects. The dedicated service below holds the PostgreSQL lease.
      CONTINUOUS_CONTROL_PLANE: disabled
      STARTUP_SCHEMA_MANAGEMENT_ENABLED: "false"
      ASKLAKE_CONTINUOUS_CONTROL_LEASE_SECONDS: ${ASKLAKE_CONTINUOUS_CONTROL_LEASE_SECONDS:-30}
      AIRFLOW_EXECUTION_API_TOKEN: ${AIRFLOW_EXECUTION_API_TOKEN:?AIRFLOW_EXECUTION_API_TOKEN is required}
      AIRFLOW_INTERNAL_TOKEN: ${AIRFLOW_INTERNAL_TOKEN:?AIRFLOW_INTERNAL_TOKEN is required}
      TRINO_ENABLED: ${TRINO_ENABLED:-false}
      TRINO_BASE_URL: ${TRINO_BASE_URL:-https://trino:8443}
      TRINO_CATALOG: ${TRINO_CATALOG:-iceberg}
      TRINO_SCHEMA: ${TRINO_SCHEMA:-asklake}
      TRINO_USER: ${TRINO_USER:-asklake-api}
      TRINO_QUERY_TIMEOUT_SECONDS: ${TRINO_QUERY_TIMEOUT_SECONDS:-300}
      TRINO_MAX_RESPONSE_BYTES: ${TRINO_MAX_RESPONSE_BYTES:-20000000}
      TRINO_MAX_RESULT_BYTES: ${TRINO_MAX_RESULT_BYTES:-50000000}
      TRINO_MAX_RESULT_PAGES: ${TRINO_MAX_RESULT_PAGES:-1000}
      TRINO_RESULT_RETENTION_SECONDS: ${TRINO_RESULT_RETENTION_SECONDS:-86400}
      TRINO_MAX_CONCURRENT_RUNS_PER_USER: ${TRINO_MAX_CONCURRENT_RUNS_PER_USER:-2}
      TRINO_RESULT_STORAGE_BUCKET: ${TRINO_RESULT_STORAGE_BUCKET:-}
      TRINO_RESULT_STORAGE_PREFIX: ${TRINO_RESULT_STORAGE_PREFIX:-query-results}
      TRINO_RESULT_STORAGE_AUTO_CREATE_BUCKET: ${TRINO_RESULT_STORAGE_AUTO_CREATE_BUCKET:-false}
      TRINO_RESULT_CURSOR_SECRET: ${TRINO_RESULT_CURSOR_SECRET:-}
