      TRINO_COLLECTOR_PAGES_PER_LEASE: ${TRINO_COLLECTOR_PAGES_PER_LEASE:-100}
      TRINO_COLLECTOR_POLL_SECONDS: ${TRINO_COLLECTOR_POLL_SECONDS:-1}
      TRINO_CLEANUP_POLL_SECONDS: ${TRINO_CLEANUP_POLL_SECONDS:-3600}
      TRINO_AUTH_USERNAME: ${TRINO_AUTH_USERNAME:-}
      TRINO_AUTH_PASSWORD: ${TRINO_AUTH_PASSWORD:-}
      TRINO_MATERIALIZER_USERNAME: ${TRINO_MATERIALIZER_USERNAME:-}
      TRINO_MATERIALIZER_PASSWORD: ${TRINO_MATERIALIZER_PASSWORD:-}
      TRINO_ICEBERG_CATALOG_NAME: ${TRINO_ICEBERG_CATALOG_NAME:-asklake}
      TRINO_ICEBERG_JDBC_DATABASE: ${POSTGRES_DB:?POSTGRES_DB is required}
      TRINO_ICEBERG_JDBC_USER: ${TRINO_ICEBERG_JDBC_USER:-}
      TRINO_ICEBERG_JDBC_PASSWORD: ${TRINO_ICEBERG_JDBC_PASSWORD:-}
      TRINO_ICEBERG_WAREHOUSE_BUCKET: ${TRINO_ICEBERG_WAREHOUSE_BUCKET:-}
      TRINO_ICEBERG_WAREHOUSE_PREFIX: ${TRINO_ICEBERG_WAREHOUSE_PREFIX:-warehouse}
      TRINO_TLS_CA_FILE: ${TRINO_TLS_CA_CONTAINER_FILE:-}
      ASKLAKE_MONGO_HOST: ${ASKLAKE_MONGO_HOST:-mongo}
      ASKLAKE_MONGO_PORT: ${ASKLAKE_MONGO_PORT:-27017}
      ASKLAKE_MONGO_DATABASE: ${MONGO_INITDB_DATABASE:-asklake_sources}
      ASKLAKE_MONGO_USER: ${MONGO_INITDB_ROOT_USERNAME:?MONGO_INITDB_ROOT_USERNAME is required}
      ASKLAKE_MONGO_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?MONGO_INITDB_ROOT_PASSWORD is required}
      ASKLAKE_MINIO_DOCKER_FALLBACK: "false"
      ASKLAKE_KAFKA_BROKER: ${ASKLAKE_KAFKA_BROKER:-redpanda:9092}
      ASKLAKE_SOURCE_DEFAULT_KAFKA_TOPIC: ${ASKLAKE_SOURCE_DEFAULT_KAFKA_TOPIC:-asklake-source-events}
      ASKLAKE_KAFKA_SAMPLE_IDLE_MS: ${ASKLAKE_KAFKA_SAMPLE_IDLE_MS:-500}
      ASKLAKE_KAFKA_SAMPLE_MIN_MESSAGES: ${ASKLAKE_KAFKA_SAMPLE_MIN_MESSAGES:-3}
      ASKLAKE_KAFKA_SAMPLE_SETTLE_MS: ${ASKLAKE_KAFKA_SAMPLE_SETTLE_MS:-1500}
      ASKLAKE_KAFKA_SAMPLE_TIMEOUT_MS: ${ASKLAKE_KAFKA_SAMPLE_TIMEOUT_MS:-8000}
      ASKLAKE_REPLAY_INPUT_DIR: ${ASKLAKE_REPLAY_INPUT_DIR:-/var/lib/asklake/replay-input}
      CONTINUOUS_RUNTIME_SYNC_INTERVAL_SECONDS: ${CONTINUOUS_RUNTIME_SYNC_INTERVAL_SECONDS:-1}
      DASHBOARD_SYNC_MODE: ${DASHBOARD_SYNC_MODE:-polling}
      REALTIME_EVENTS_ENABLED: ${REALTIME_EVENTS_ENABLED:-false}
      CONTINUOUS_SQL_JOIN_ENABLED: ${CONTINUOUS_SQL_JOIN_ENABLED:-false}
      LATEST_STATIC_PER_BATCH_ENABLED: ${LATEST_STATIC_PER_BATCH_ENABLED:-false}
      STATIC_CHANGE_BACKFILL_ENABLED: ${STATIC_CHANGE_BACKFILL_ENABLED:-false}
