      ASKLAKE_SPARK_POSTGRES_PACKAGE: ${ASKLAKE_SPARK_POSTGRES_PACKAGE:-org.postgresql:postgresql:42.7.7}
      ASKLAKE_SPARK_ICEBERG_CATALOG_NAME: ${TRINO_ICEBERG_CATALOG_NAME:-asklake}
      ASKLAKE_SPARK_ICEBERG_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      ASKLAKE_SPARK_KAFKA_PACKAGE: ${ASKLAKE_SPARK_KAFKA_PACKAGE:-org.apache.spark:spark-sql-kafka-0-10_2.13:4.0.1}
      ASKLAKE_SPARK_OUTPUT_MODE: ${ASKLAKE_SPARK_OUTPUT_MODE:-s3a}
      ASKLAKE_SPARK_OUTPUT_BUCKET: ${ASKLAKE_SPARK_OUTPUT_BUCKET:?ASKLAKE_SPARK_OUTPUT_BUCKET is required}
      ASKLAKE_SPARK_OUTPUT_PREFIX: ${ASKLAKE_SPARK_OUTPUT_PREFIX:-asklake-output}
      ASKLAKE_SPARK_REPORT_DIR: /var/lib/asklake/spark-runs
      ASKLAKE_SPARK_REPORT_CONTAINER_DIR: /var/lib/asklake/spark-runs
      ASKLAKE_SPARK_RUN_ROW_LIMIT: ${ASKLAKE_SPARK_RUN_ROW_LIMIT:-0}
      ASKLAKE_SPARK_RUN_TIMEOUT_SECONDS: ${ASKLAKE_SPARK_RUN_TIMEOUT_SECONDS:-7200}
      ASKLAKE_SPARK_REST_POLL_INTERVAL_MS: ${ASKLAKE_SPARK_REST_POLL_INTERVAL_MS:-1000}
      ASKLAKE_CONTINUOUS_MAINTENANCE_TIMEOUT_MS: ${ASKLAKE_CONTINUOUS_MAINTENANCE_TIMEOUT_MS:-540000}
      ASKLAKE_SOURCE_INSPECT_TIMEOUT_MS: ${ASKLAKE_SOURCE_INSPECT_TIMEOUT_MS:-90000}
      ASKLAKE_LOCAL_SAMPLE_DIR: /var/lib/asklake/samples
      ASKLAKE_SAMPLE_CONTAINER_DIR: /var/lib/asklake/samples
      ASKLAKE_REVIEW_ANALYSIS_RUNTIME: ${ASKLAKE_REVIEW_ANALYSIS_RUNTIME:-local_llm}
      ASKLAKE_LOCAL_LLM_ENDPOINT: ${ASKLAKE_LOCAL_LLM_ENDPOINT_IN_DOCKER:-http://host.docker.internal:1234/v1/chat/completions}
      ASKLAKE_LOCAL_LLM_MODEL: ${ASKLAKE_LOCAL_LLM_MODEL:-local-review-analyzer}
      ASKLAKE_LOCAL_LLM_TIMEOUT_SECONDS: ${ASKLAKE_LOCAL_LLM_TIMEOUT_SECONDS:-120}
      ASKLAKE_LOCAL_LLM_MAX_INPUT_CHARS: ${ASKLAKE_LOCAL_LLM_MAX_INPUT_CHARS:-9000}
      ASKLAKE_REVIEW_TEXT_MODEL_HOST_DIR: /var/lib/asklake/review-text-models
      ASKLAKE_REVIEW_TEXT_MODEL_CONTAINER_DIR: /var/lib/asklake/review-text-models
      ASKLAKE_OBJECT_STORAGE_PROVIDER: ${ASKLAKE_OBJECT_STORAGE_PROVIDER:-aws}
      ASKLAKE_RAW_BUCKET: ${ASKLAKE_RAW_BUCKET:?ASKLAKE_RAW_BUCKET is required}
      ASKLAKE_SOURCE_DEFAULT_S3_BUCKET: ${ASKLAKE_SOURCE_DEFAULT_S3_BUCKET:-}
      ASKLAKE_SOURCE_DEFAULT_S3_PREFIX: ${ASKLAKE_SOURCE_DEFAULT_S3_PREFIX:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      S3_ALLOWED_BUCKETS: ${S3_ALLOWED_BUCKETS:?S3_ALLOWED_BUCKETS is required}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
    expose:
      - "8080"
    volumes:
      - lake_data:${LOCAL_LAKE_STORAGE_DIR:-/var/lib/asklake/lake}
      - ${ASKLAKE_HOST_DATA_DIR:-/var/lib/asklake}/spark-ivy:/var/lib/asklake/spark-ivy
      - ${ASKLAKE_HOST_DATA_DIR:-/var/lib/asklake}/spark-output:/var/lib/asklake/spark-output
      - ${ASKLAKE_HOST_DATA_DIR:-/var/lib/asklake}/spark-runs:/var/lib/asklake/spark-runs
      - ${ASKLAKE_HOST_DATA_DIR:-/var/lib/asklake}/samples:/var/lib/asklake/samples
      - ${ASKLAKE_HOST_DATA_DIR:-/var/lib/asklake}/review-text-models:/var/lib/asklake/review-text-models:ro
      - ${ASKLAKE_REPLAY_HOST_INPUT_DIR:-/var/lib/asklake/replay-input}:${ASKLAKE_REPLAY_INPUT_DIR:-/var/lib/asklake/replay-input}:ro
      - ${TRINO_TLS_CA_FILE:-/dev/null}:${TRINO_TLS_CA_CONTAINER_FILE:-/run/secrets/trino-ca.pem}:ro
    networks:
      - default
      - trino_internal
    healthcheck:
      test:
        - CMD-SHELL
        - |
          python /app/scripts/ensure_spark_runtime_paths.py check-backend >/dev/null && python - <<'PY'
          import json
          import urllib.request

          with urllib.request.urlopen("http://127.0.0.1:8080/api/health", timeout=5) as response:
              payload = json.load(response)
              http_status = response.status

          ready = (
              http_status == 200
              and isinstance(payload, dict)
              and payload.get("ok") is True
              and payload.get("statusCode") == 200
              and isinstance(payload.get("database"), dict)
              and payload["database"].get("ok") is True
          )
          raise SystemExit(0 if ready else 1)
          PY
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  continuous-worker:
    extends:
      service: backend
    command: ["python", "-m", "app.continuous_worker"]
    environment:
      CONTINUOUS_CONTROL_PLANE: worker
      STARTUP_SCHEMA_MANAGEMENT_ENABLED: "false"
    healthcheck:
      disable: true

  ai-server:
    build:
      context: ../ai-server
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      INTERNAL_AUTH_TOKEN: ${AI_GATEWAY_SERVICE_TOKEN:?AI_GATEWAY_SERVICE_TOKEN is required}
      PROVIDER: ${AI_PROVIDER:-openai_compatible}
      PROVIDER_BASE_URL: ${AI_PROVIDER_BASE_URL:-https://api.openai.com/v1}
      PROVIDER_API_KEY: ${AI_PROVIDER_API_KEY:?AI_PROVIDER_API_KEY is required}
      PROVIDER_MODEL: ${AI_PROVIDER_MODEL:-gpt-4.1-mini}
      MCP_ENABLED: ${AI_MCP_ENABLED:-true}
      MCP_SERVER_URL: ${AI_MCP_SERVER_URL:-http://backend:8080/internal/mcp}
      MCP_SERVICE_TOKEN: ${AI_MCP_SERVICE_TOKEN:?AI_MCP_SERVICE_TOKEN is required}
      MCP_TIMEOUT_SECONDS: ${AI_MCP_TIMEOUT_SECONDS:-10}
      REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-30}
      MAX_EMBEDDING_PROVIDER_RESPONSE_BYTES: ${AI_MAX_EMBEDDING_PROVIDER_RESPONSE_BYTES:-8388608}
      EMBEDDING_DIMENSIONS: ${RAG_EMBEDDING_DIMENSIONS:-1536}
    expose:
      - "8090"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=5).read()\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  embedding-worker:
    build:
      context: ../embedding-worker
    restart: unless-stopped
    depends_on:
      ai-server:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    environment:
      AI_GATEWAY_BASE_URL: ${AI_GATEWAY_BASE_URL:-http://ai-server:8090}
      AI_GATEWAY_SERVICE_TOKEN: ${AI_GATEWAY_SERVICE_TOKEN:?AI_GATEWAY_SERVICE_TOKEN is required}
      AI_GATEWAY_MAX_EMBEDDING_RESPONSE_BYTES: ${AI_GATEWAY_MAX_EMBEDDING_RESPONSE_BYTES:-8388608}
      OPENSEARCH_BASE_URL: ${OPENSEARCH_BASE_URL:-https://opensearch:9200}
      OPENSEARCH_USERNAME: ${OPENSEARCH_USERNAME:-admin}
      OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD:?OPENSEARCH_PASSWORD is required}
      OPENSEARCH_VERIFY_TLS: ${OPENSEARCH_VERIFY_TLS:-true}
      OPENSEARCH_CA_CERT: ${OPENSEARCH_CA_CERT:-}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-text-embedding-3-small}
      RAG_EMBEDDING_DIMENSIONS: ${RAG_EMBEDDING_DIMENSIONS:-1536}
      RAG_SOURCE_ALLOWED_HOSTS: ${RAG_SOURCE_ALLOWED_HOSTS:-}
      WORKER_INTERNAL_TOKEN: ${RAG_WORKER_TOKEN:?RAG_WORKER_TOKEN is required}
      RAG_IDEMPOTENCY_STORE_PATH: ${RAG_IDEMPOTENCY_STORE_PATH:-/var/lib/asklake/embedding-worker/idempotency.sqlite3}
    expose:
      - "8090"
    volumes:
      - embedding_worker_state:/var/lib/asklake/embedding-worker
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/ready', timeout=5).read()\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  rag-artifact-cleanup:
    extends:
      service: backend
    restart: unless-stopped
    command: ["python", "scripts/cleanup-rag-artifacts.py", "--apply", "--loop"]
    healthcheck:
      disable: true

  aws-s3-readiness:
    build:
      context: ../backend
      target: backend-runtime
    restart: "no"
    command: ["python", "scripts/verify-aws-s3-readiness.py"]
    environment:
      ASKLAKE_OBJECT_STORAGE_PROVIDER: ${ASKLAKE_OBJECT_STORAGE_PROVIDER:-aws}
      ASKLAKE_S3_READINESS_READ_BUCKETS: ${ASKLAKE_S3_READINESS_READ_BUCKETS:?ASKLAKE_S3_READINESS_READ_BUCKETS is required}
      ASKLAKE_S3_READINESS_WRITE_BUCKETS: ${ASKLAKE_S3_READINESS_WRITE_BUCKETS:?ASKLAKE_S3_READINESS_WRITE_BUCKETS is required}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}

  spark-runtime-guard:
    <<: *spark-runtime
    restart: unless-stopped
    user: "0:0"
    command:
      - python3
      - /opt/asklake/scripts/ensure_spark_runtime_paths.py
      - guard
    environment:
      ASKLAKE_SPARK_RUNTIME_ROOT: /var/lib/asklake
      ASKLAKE_SPARK_RUNTIME_UID: "185"
      ASKLAKE_SPARK_RUNTIME_GID: "185"
      ASKLAKE_SPARK_RUNTIME_DIRECTORY_MODE: "2770"
      ASKLAKE_SPARK_RUNTIME_FILE_MODE: "0660"
      ASKLAKE_SPARK_RUNTIME_GUARD_INTERVAL_SECONDS: "30"
    volumes:
      - ${ASKLAKE_HOST_DATA_DIR:-/var/lib/asklake}/spark-ivy:/var/lib/asklake/spark-ivy
      - ${ASKLAKE_HOST_DATA_DIR:-/var/lib/asklake}/spark-output:/var/lib/asklake/spark-output
      - ${ASKLAKE_HOST_DATA_DIR:-/var/lib/asklake}/spark-runs:/var/lib/asklake/spark-runs
      - ${ASKLAKE_HOST_DATA_DIR:-/var/lib/asklake}/samples:/var/lib/asklake/samples
      - ${ASKLAKE_HOST_DATA_DIR:-/var/lib/asklake}/review-text-models:/var/lib/asklake/review-text-models
    healthcheck:
      test: ["CMD", "python3", "/opt/asklake/scripts/ensure_spark_runtime_paths.py", "check-metadata"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

  spark-master:
    <<: *spark-runtime
    restart: unless-stopped
    depends_on:
      spark-runtime-guard:
        condition: service_healthy
    user: "185:185"
    environment:
      HOME: /tmp
      SPARK_MASTER_OPTS: >-
        -Dspark.master.rest.enabled=true
        -Dspark.master.rest.host=0.0.0.0
        -Dspark.master.rest.port=6066
        -Dspark.deploy.defaultCores=${ASKLAKE_SPARK_CORES_MAX:-2}
        -Dspark.deploy.maxDrivers=${ASKLAKE_SPARK_MAX_DRIVERS:-2}
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    expose:
      - "6066"
      - "7077"
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ': </dev/tcp/127.0.0.1/6066'"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  spark-worker:
    <<: *spark-runtime
    restart: unless-stopped
    depends_on:
      spark-runtime-guard:
        condition: service_healthy
      spark-master:
        condition: service_healthy
    user: "185:185"
    environment:
      HOME: /tmp
      ASKLAKE_OBJECT_STORAGE_PROVIDER: ${ASKLAKE_OBJECT_STORAGE_PROVIDER:-aws}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      PYSPARK_DRIVER_PYTHON: /usr/bin/python3
      PYSPARK_PYTHON: /usr/bin/python3
      SPARK_WORKER_OPTS: >-
        -Dspark.worker.cleanup.enabled=true
        -Dspark.worker.cleanup.interval=1800
        -Dspark.worker.cleanup.appDataTtl=86400
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - python3
      - /opt/asklake/scripts/ensure_spark_runtime_paths.py
      - wait-writer-exec
      - --
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --cores
      - ${ASKLAKE_SPARK_WORKER_CORES:-4}
      - --memory
      - ${ASKLAKE_SPARK_WORKER_MEMORY:-10g}
      - --webui-port
      - "8081"
      - --work-dir
      - /opt/spark/work-dir
    expose:
      - "8081"
    volumes:
      - ${ASKLAKE_HOST_DATA_DIR:-/var/lib/asklake}/spark-ivy:/var/lib/asklake/spark-ivy
      - ${ASKLAKE_HOST_DATA_DIR:-/var/lib/asklake}/spark-output:/var/lib/asklake/spark-output
      - ${ASKLAKE_HOST_DATA_DIR:-/var/lib/asklake}/spark-runs:/var/lib/asklake/spark-runs
      - ${ASKLAKE_HOST_DATA_DIR:-/var/lib/asklake}/samples:/var/lib/asklake/samples:ro
      - ${ASKLAKE_HOST_DATA_DIR:-/var/lib/asklake}/review-text-models:/var/lib/asklake/review-text-models:ro
    healthcheck:
      test: ["CMD-SHELL", "python3 /opt/asklake/scripts/ensure_spark_runtime_paths.py check-metadata >/dev/null && bash -c ': </dev/tcp/127.0.0.1/8081'"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  trino-result-collector:
    profiles: ["trino"]
    extends:
      service: backend
    command: ["python", "scripts/collect-trino-results.py"]
    healthcheck:
      disable: true

  trino-result-cleanup:
    profiles: ["trino"]
    extends:
      service: backend
    command: ["python", "scripts/cleanup-expired-trino-results.py", "--loop"]
    healthcheck:
      disable: true

  airflow-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AIRFLOW_METADATA_DB_NAME:-airflow}
      POSTGRES_USER: ${AIRFLOW_METADATA_DB_USER:-airflow}
      POSTGRES_PASSWORD: ${AIRFLOW_METADATA_DB_PASSWORD:?AIRFLOW_METADATA_DB_PASSWORD is required}
    expose:
      - "5432"
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 12

  airflow-init:
    <<: *airflow-common
    restart: "no"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/{logs,dags,plugins,config}
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/{logs,dags,plugins,config}
        /entrypoint airflow version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_PASSWORD:?AIRFLOW_PASSWORD is required}
    user: "0:0"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 30s
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob"]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 30s
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob"]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 30s
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - default
      - trino_internal

  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-asklake_sources}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?MONGO_INITDB_ROOT_USERNAME is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?MONGO_INITDB_ROOT_PASSWORD is required}
    expose:
      - "27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username \"$${MONGO_INITDB_ROOT_USERNAME}\" --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  trino-postgres-bootstrap:
    profiles: ["trino"]
    image: postgres:16-alpine
    restart: "no"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TRINO_ICEBERG_JDBC_USER: ${TRINO_ICEBERG_JDBC_USER:-}
      TRINO_ICEBERG_JDBC_PASSWORD: ${TRINO_ICEBERG_JDBC_PASSWORD:-}
    entrypoint: ["/bin/sh", "/bootstrap/bootstrap-trino-catalog.sh"]
    volumes:
      - ./postgres/bootstrap-trino-catalog.sh:/bootstrap/bootstrap-trino-catalog.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - trino_internal

  trino:
    profiles: ["trino"]
    image: ${TRINO_IMAGE:-trinodb/trino:482}
    restart: unless-stopped
    environment:
      TRINO_ICEBERG_CATALOG_NAME: ${TRINO_ICEBERG_CATALOG_NAME:-asklake}
      TRINO_ICEBERG_JDBC_DATABASE: ${POSTGRES_DB:?POSTGRES_DB is required}
      TRINO_ICEBERG_JDBC_PASSWORD: ${TRINO_ICEBERG_JDBC_PASSWORD:-}
      TRINO_ICEBERG_JDBC_USER: ${TRINO_ICEBERG_JDBC_USER:-}
      TRINO_ICEBERG_WAREHOUSE_BUCKET: ${TRINO_ICEBERG_WAREHOUSE_BUCKET:-}
      TRINO_ICEBERG_WAREHOUSE_PREFIX: ${TRINO_ICEBERG_WAREHOUSE_PREFIX:-warehouse}
      TRINO_INTERNAL_SHARED_SECRET: ${TRINO_INTERNAL_SHARED_SECRET:-}
      TRINO_S3_REGION: ${AWS_REGION:-ap-northeast-2}
      TRINO_TLS_KEYSTORE_PASSWORD: ${TRINO_TLS_KEYSTORE_PASSWORD:-}
    expose:
      - "8443"
    volumes:
      - ./trino/etc/catalog-prod:/etc/trino/catalog:ro
      - ./trino/etc/config.properties:/etc/trino/config.properties:ro
      - ./trino/etc/password-authenticator.properties:/etc/trino/password-authenticator.properties:ro
      - ./trino/etc/access-control.properties:/etc/trino/access-control.properties:ro
      - ./trino/etc/access-control:/etc/trino/access-control:ro
      - ${TRINO_PASSWORD_FILE:-/dev/null}:/etc/trino/auth/password.db:ro
      - ${TRINO_TLS_KEYSTORE_FILE:-/dev/null}:/etc/trino/tls/keystore.jks:ro
    depends_on:
      trino-postgres-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -ksSf https://127.0.0.1:8443/v1/info >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    networks:
      - trino_internal
      - trino_egress

  redpanda:
    image: redpandadata/redpanda:v24.3.1
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - internal://0.0.0.0:9092
      - --advertise-kafka-addr
      - internal://redpanda:9092
    expose:
      - "9092"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --api-urls localhost:9644 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

  clickhouse:
    profiles: ["clickhouse"]
    image: ${CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server:25.8.28.1}
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-asklake}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-replace-with-clickhouse-password}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-asklake}
    expose:
      - "8123"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/config.d/kafka.xml:/etc/clickhouse-server/config.d/kafka.xml:ro
    depends_on:
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"${CLICKHOUSE_USER:-asklake}\" --password \"${CLICKHOUSE_PASSWORD:-replace-with-clickhouse-password}\" --query 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s

volumes:
  caddy_data:
  caddy_config:
  clickhouse_data:
  postgres_data:
  airflow_postgres_data:
  mongo_data:
  redpanda_data:
  lake_data:
  opensearch_data:
