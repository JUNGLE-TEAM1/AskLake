      TRINO_QUERY_WARNING_BYTES: ${TRINO_QUERY_WARNING_BYTES:-1073741824}
      TRINO_QUERY_MAX_ESTIMATED_BYTES: ${TRINO_QUERY_MAX_ESTIMATED_BYTES:-0}
      TRINO_QUERY_ESTIMATED_THROUGHPUT_BYTES_PER_SECOND: ${TRINO_QUERY_ESTIMATED_THROUGHPUT_BYTES_PER_SECOND:-268435456}
