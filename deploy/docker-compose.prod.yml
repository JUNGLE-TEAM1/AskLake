      CONTINUOUS_SQL_MAX_OUTPUT_ROWS_PER_INPUT: ${CONTINUOUS_SQL_MAX_OUTPUT_ROWS_PER_INPUT:-10}
      CLICKHOUSE_CONTINUOUS_JOIN_ENABLED: ${CLICKHOUSE_CONTINUOUS_JOIN_ENABLED:-false}
      CLICKHOUSE_URL: ${CLICKHOUSE_URL:-http://clickhouse:8123}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-asklake}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
