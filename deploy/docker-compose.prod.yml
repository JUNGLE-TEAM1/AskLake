name: ${COMPOSE_PROJECT_NAME:-asklake}

x-airflow-common:
  &airflow-common
  image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:3.3.0}
  restart: unless-stopped
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_METADATA_DB_USER:-airflow}:${AIRFLOW_METADATA_DB_PASSWORD:?AIRFLOW_METADATA_DB_PASSWORD is required}@airflow-postgres/${AIRFLOW_METADATA_DB_NAME:-airflow}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_API_AUTH_JWT_SECRET:?AIRFLOW_API_AUTH_JWT_SECRET is required}
    AIRFLOW__API_AUTH__JWT_ISSUER: ${AIRFLOW_API_AUTH_JWT_ISSUER:-asklake}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW_CONFIG: /opt/airflow/config/airflow.cfg
    _PIP_ADDITIONAL_REQUIREMENTS: ""
  volumes:
    - ${AIRFLOW_PROJ_DIR:-../airflow}/dags:/opt/airflow/dags
    - ${AIRFLOW_PROJ_DIR:-../airflow}/logs:/opt/airflow/logs
    - ${AIRFLOW_PROJ_DIR:-../airflow}/config:/opt/airflow/config
    - ${AIRFLOW_PROJ_DIR:-../airflow}/plugins:/opt/airflow/plugins
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    airflow-postgres:
      condition: service_healthy

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2019/config/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?VITE_API_BASE_URL is required}
        VITE_USE_MOCK_API: ${VITE_USE_MOCK_API:-false}
        VITE_DASHBOARD_ASSISTANT_API_PATH: ${VITE_DASHBOARD_ASSISTANT_API_PATH:-/api/dashboards/assistant}
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    depends_on:
      airflow-apiserver:
        condition: service_healthy
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      API_PREFIX: ${API_PREFIX:-/api}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:?BACKEND_CORS_ORIGINS is required}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      LOCAL_LAKE_STORAGE_DIR: ${LOCAL_LAKE_STORAGE_DIR:-/var/lib/asklake/lake}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_ASSISTANT_ENABLED: ${OPENAI_ASSISTANT_ENABLED:-true}
      OPENAI_ASSISTANT_MODEL: ${OPENAI_ASSISTANT_MODEL:-gpt-4o-mini}
      OPENAI_ASSISTANT_MAX_OUTPUT_TOKENS: ${OPENAI_ASSISTANT_MAX_OUTPUT_TOKENS:-1200}
      OPENAI_ASSISTANT_MAX_SAMPLE_ROWS: ${OPENAI_ASSISTANT_MAX_SAMPLE_ROWS:-5}
      OPENAI_ASSISTANT_TIMEOUT_SECONDS: ${OPENAI_ASSISTANT_TIMEOUT_SECONDS:-20}
      OPENAI_QUERY_AI_MODEL: ${OPENAI_QUERY_AI_MODEL:-gpt-4.1-mini}
      AIRFLOW_API_BASE_URL: ${AIRFLOW_API_BASE_URL:-http://airflow-apiserver:8080}
      AIRFLOW_DAG_ID: ${AIRFLOW_DAG_ID:-asklake_etl_job}
      AIRFLOW_UI_BASE_URL: ${AIRFLOW_UI_BASE_URL:-}
      AIRFLOW_API_TOKEN: ${AIRFLOW_API_TOKEN:-}
      AIRFLOW_USERNAME: ${AIRFLOW_USERNAME:-airflow}
      AIRFLOW_PASSWORD: ${AIRFLOW_PASSWORD:?AIRFLOW_PASSWORD is required}
      AIRFLOW_REQUEST_TIMEOUT_SECONDS: ${AIRFLOW_REQUEST_TIMEOUT_SECONDS:-10}
      ASKLAKE_MONGO_HOST: ${ASKLAKE_MONGO_HOST:-mongo}
      ASKLAKE_MONGO_PORT: ${ASKLAKE_MONGO_PORT:-27017}
      ASKLAKE_MONGO_DATABASE: ${MONGO_INITDB_DATABASE:-asklake_sources}
      ASKLAKE_MONGO_USER: ${MONGO_INITDB_ROOT_USERNAME:?MONGO_INITDB_ROOT_USERNAME is required}
      ASKLAKE_MONGO_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?MONGO_INITDB_ROOT_PASSWORD is required}
      ASKLAKE_DOCKER_NETWORK: ${COMPOSE_PROJECT_NAME:-asklake}_default
      ASKLAKE_KAFKA_BROKER: ${ASKLAKE_KAFKA_BROKER:-redpanda:9092}
      ASKLAKE_SPARK_HOST_SCRIPTS_DIR: ${ASKLAKE_SPARK_HOST_SCRIPTS_DIR:-/opt/asklake/backend/scripts}
      ASKLAKE_SPARK_IVY_DIR: ${ASKLAKE_HOST_DATA_DIR:-/tmp/asklake}/spark-ivy
      ASKLAKE_SPARK_IMAGE: ${ASKLAKE_SPARK_IMAGE:-apache/spark:4.0.1}
      ASKLAKE_SPARK_LOCAL_OUTPUT_DIR: ${ASKLAKE_HOST_DATA_DIR:-/tmp/asklake}/spark-output
      ASKLAKE_SPARK_MASTER_CONTAINER: ${ASKLAKE_SPARK_MASTER_CONTAINER:-asklake-spark-master}
      ASKLAKE_SPARK_MASTER_URL: ${ASKLAKE_SPARK_MASTER_URL:-spark://asklake-spark-master:7077}
      ASKLAKE_SPARK_HADOOP_AWS_PACKAGE: ${ASKLAKE_SPARK_HADOOP_AWS_PACKAGE:-org.apache.hadoop:hadoop-aws:3.4.1}
      ASKLAKE_SPARK_OUTPUT_MODE: ${ASKLAKE_SPARK_OUTPUT_MODE:-local}
      ASKLAKE_SPARK_OUTPUT_PREFIX: ${ASKLAKE_SPARK_OUTPUT_PREFIX:-asklake-output}
      ASKLAKE_SPARK_OUTPUT_VOLUME: ${ASKLAKE_SPARK_OUTPUT_VOLUME:-asklake-spark-output}
      ASKLAKE_SPARK_PUBLISH_UI: ${ASKLAKE_SPARK_PUBLISH_UI:-false}
      ASKLAKE_SPARK_REPORT_DIR: ${ASKLAKE_HOST_DATA_DIR:-/tmp/asklake}/spark-runs
      ASKLAKE_SPARK_RUN_ROW_LIMIT: ${ASKLAKE_SPARK_RUN_ROW_LIMIT:-10000}
      ASKLAKE_SPARK_WORKER_CONTAINER: ${ASKLAKE_SPARK_WORKER_CONTAINER:-asklake-spark-worker}
      ASKLAKE_LOCAL_SAMPLE_DIR: ${ASKLAKE_HOST_DATA_DIR:-/tmp/asklake}/samples
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ENDPOINT_IN_DOCKER: ${MINIO_ENDPOINT_IN_DOCKER:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-m3-raw}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_ALLOWED_BUCKETS: ${S3_ALLOWED_BUCKETS:-m3-raw,asklake-output}
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      AWS_REGION: ${MINIO_REGION:-us-east-1}
    expose:
      - "8080"
    volumes:
      - lake_data:${LOCAL_LAKE_STORAGE_DIR:-/var/lib/asklake/lake}
      - /var/run/docker.sock:/var/run/docker.sock
      - ${ASKLAKE_HOST_DATA_DIR:-/tmp/asklake}/spark-ivy:${ASKLAKE_HOST_DATA_DIR:-/tmp/asklake}/spark-ivy
      - ${ASKLAKE_HOST_DATA_DIR:-/tmp/asklake}/spark-output:${ASKLAKE_HOST_DATA_DIR:-/tmp/asklake}/spark-output
      - ${ASKLAKE_HOST_DATA_DIR:-/tmp/asklake}/spark-runs:${ASKLAKE_HOST_DATA_DIR:-/tmp/asklake}/spark-runs
      - ${ASKLAKE_HOST_DATA_DIR:-/tmp/asklake}/samples:${ASKLAKE_HOST_DATA_DIR:-/tmp/asklake}/samples
      - spark_output:/var/lib/asklake/spark-output-volume
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=5).read()\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  airflow-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AIRFLOW_METADATA_DB_NAME:-airflow}
      POSTGRES_USER: ${AIRFLOW_METADATA_DB_USER:-airflow}
      POSTGRES_PASSWORD: ${AIRFLOW_METADATA_DB_PASSWORD:?AIRFLOW_METADATA_DB_PASSWORD is required}
    expose:
      - "5432"
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 12

  airflow-init:
    <<: *airflow-common
    restart: "no"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/{logs,dags,plugins,config}
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/{logs,dags,plugins,config}
        /entrypoint airflow version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_PASSWORD:?AIRFLOW_PASSWORD is required}
    user: "0:0"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 30s
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob"]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 30s
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob"]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 30s
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 12

  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-asklake_sources}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?MONGO_INITDB_ROOT_USERNAME is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?MONGO_INITDB_ROOT_PASSWORD is required}
    expose:
      - "27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username \"$${MONGO_INITDB_ROOT_USERNAME}\" --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    expose:
      - "9000"
      - "9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

  redpanda:
    image: redpandadata/redpanda:v24.3.1
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - internal://0.0.0.0:9092
      - --advertise-kafka-addr
      - internal://redpanda:9092
    expose:
      - "9092"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --api-urls localhost:9644 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  airflow_postgres_data:
  mongo_data:
  minio_data:
  redpanda_data:
  lake_data:
  spark_output:
    name: ${ASKLAKE_SPARK_OUTPUT_VOLUME:-asklake-spark-output}
