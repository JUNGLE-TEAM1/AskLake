name: ${COMPOSE_PROJECT_NAME:-asklake}

x-airflow-common:
  &airflow-common
  image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:3.3.0}
  restart: unless-stopped
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_METADATA_DB_USER:-airflow}:${AIRFLOW_METADATA_DB_PASSWORD:?AIRFLOW_METADATA_DB_PASSWORD is required}@airflow-postgres/${AIRFLOW_METADATA_DB_NAME:-airflow}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_API_AUTH_JWT_SECRET:?AIRFLOW_API_AUTH_JWT_SECRET is required}
    AIRFLOW__API_AUTH__JWT_ISSUER: ${AIRFLOW_API_AUTH_JWT_ISSUER:-asklake}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW_INTERNAL_BASE_URL: ${AIRFLOW_INTERNAL_BASE_URL:-http://backend:8080}
    AIRFLOW_INTERNAL_TOKEN: ${AIRFLOW_INTERNAL_TOKEN:?AIRFLOW_INTERNAL_TOKEN is required}
    AIRFLOW_INTERNAL_TIMEOUT_SECONDS: ${AIRFLOW_INTERNAL_TIMEOUT_SECONDS:-1800}
    AIRFLOW_CONFIG: /opt/airflow/config/airflow.cfg
    ASKLAKE_EXECUTION_API_BASE_URL: ${ASKLAKE_EXECUTION_API_BASE_URL:-http://backend:8080}
    ASKLAKE_EXECUTION_API_TOKEN: ${AIRFLOW_EXECUTION_API_TOKEN:?AIRFLOW_EXECUTION_API_TOKEN is required}
    ASKLAKE_EXECUTION_API_TIMEOUT_SECONDS: ${ASKLAKE_EXECUTION_API_TIMEOUT_SECONDS:-7500}
    _PIP_ADDITIONAL_REQUIREMENTS: ""
  volumes:
    - ${AIRFLOW_PROJ_DIR:-../airflow}/dags:/opt/airflow/dags
    - ${AIRFLOW_PROJ_DIR:-../airflow}/logs:/opt/airflow/logs
    - ${AIRFLOW_PROJ_DIR:-../airflow}/config:/opt/airflow/config
    - ${AIRFLOW_PROJ_DIR:-../airflow}/plugins:/opt/airflow/plugins
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    airflow-postgres:
      condition: service_healthy

x-spark-runtime:
  &spark-runtime
  image: ${ASKLAKE_SPARK_RUNTIME_IMAGE:-asklake-spark:4.0.1}
  build:
    context: ../backend
    target: spark-runtime

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2019/config/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?VITE_API_BASE_URL is required}
        VITE_AUTH_PUBLIC_SIGNUP: ${VITE_AUTH_PUBLIC_SIGNUP:-false}
        VITE_USE_MOCK_API: ${VITE_USE_MOCK_API:-false}
        VITE_DASHBOARD_ASSISTANT_API_PATH: ${VITE_DASHBOARD_ASSISTANT_API_PATH:-/api/dashboards/assistant}
        VITE_OBJECT_STORAGE_PROVIDER: ${ASKLAKE_OBJECT_STORAGE_PROVIDER:-aws}
        VITE_S3_REGION: ${AWS_REGION:-ap-northeast-2}
        VITE_SPARK_OUTPUT_BUCKET: ${ASKLAKE_SPARK_OUTPUT_BUCKET:?ASKLAKE_SPARK_OUTPUT_BUCKET is required}
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ../backend
      target: backend-runtime
    restart: unless-stopped
    depends_on:
      airflow-apiserver:
        condition: service_healthy
      aws-s3-readiness:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      spark-dir-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_healthy
      spark-worker:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      API_PREFIX: ${API_PREFIX:-/api}
      AUTH_PUBLIC_SIGNUP_ENABLED: ${AUTH_PUBLIC_SIGNUP_ENABLED:-false}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-}
      BOOTSTRAP_ADMIN_DISPLAY_NAME: ${BOOTSTRAP_ADMIN_DISPLAY_NAME:-AskLake Administrator}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?BOOTSTRAP_ADMIN_EMAIL is required}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?BOOTSTRAP_ADMIN_PASSWORD is required}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-5}
      LOCAL_LAKE_STORAGE_DIR: ${LOCAL_LAKE_STORAGE_DIR:-/var/lib/asklake/lake}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_ASSISTANT_ENABLED: ${OPENAI_ASSISTANT_ENABLED:-true}
      OPENAI_ASSISTANT_MODEL: ${OPENAI_ASSISTANT_MODEL:-gpt-4o-mini}
      OPENAI_ASSISTANT_MAX_OUTPUT_TOKENS: ${OPENAI_ASSISTANT_MAX_OUTPUT_TOKENS:-1200}
      OPENAI_ASSISTANT_MAX_SAMPLE_ROWS: ${OPENAI_ASSISTANT_MAX_SAMPLE_ROWS:-5}
      OPENAI_ASSISTANT_TIMEOUT_SECONDS: ${OPENAI_ASSISTANT_TIMEOUT_SECONDS:-20}
      OPENAI_QUERY_AI_MODEL: ${OPENAI_QUERY_AI_MODEL:-gpt-4.1-mini}
      AIRFLOW_API_BASE_URL: ${AIRFLOW_API_BASE_URL:-http://airflow-apiserver:8080}
      AIRFLOW_DAG_ID: ${AIRFLOW_DAG_ID:-asklake_etl_job}
      AIRFLOW_UI_BASE_URL: ${AIRFLOW_UI_BASE_URL:-}
      AIRFLOW_API_TOKEN: ${AIRFLOW_API_TOKEN:-}
      AIRFLOW_USERNAME: ${AIRFLOW_USERNAME:-airflow}
      AIRFLOW_PASSWORD: ${AIRFLOW_PASSWORD:?AIRFLOW_PASSWORD is required}
      AIRFLOW_REQUEST_TIMEOUT_SECONDS: ${AIRFLOW_REQUEST_TIMEOUT_SECONDS:-10}
      AIRFLOW_EXECUTION_API_TOKEN: ${AIRFLOW_EXECUTION_API_TOKEN:?AIRFLOW_EXECUTION_API_TOKEN is required}
      AIRFLOW_INTERNAL_TOKEN: ${AIRFLOW_INTERNAL_TOKEN:?AIRFLOW_INTERNAL_TOKEN is required}
      ASKLAKE_MONGO_HOST: ${ASKLAKE_MONGO_HOST:-mongo}
      ASKLAKE_MONGO_PORT: ${ASKLAKE_MONGO_PORT:-27017}
      ASKLAKE_MONGO_DATABASE: ${MONGO_INITDB_DATABASE:-asklake_sources}
      ASKLAKE_MONGO_USER: ${MONGO_INITDB_ROOT_USERNAME:?MONGO_INITDB_ROOT_USERNAME is required}
      ASKLAKE_MONGO_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?MONGO_INITDB_ROOT_PASSWORD is required}
      ASKLAKE_MINIO_DOCKER_FALLBACK: "false"
      ASKLAKE_KAFKA_BROKER: ${ASKLAKE_KAFKA_BROKER:-redpanda:9092}
      ASKLAKE_KAFKA_SAMPLE_IDLE_MS: ${ASKLAKE_KAFKA_SAMPLE_IDLE_MS:-500}
      ASKLAKE_KAFKA_SAMPLE_MIN_MESSAGES: ${ASKLAKE_KAFKA_SAMPLE_MIN_MESSAGES:-3}
      ASKLAKE_KAFKA_SAMPLE_SETTLE_MS: ${ASKLAKE_KAFKA_SAMPLE_SETTLE_MS:-1500}
      ASKLAKE_KAFKA_SAMPLE_TIMEOUT_MS: ${ASKLAKE_KAFKA_SAMPLE_TIMEOUT_MS:-8000}
      ASKLAKE_REPLAY_INPUT_DIR: ${ASKLAKE_REPLAY_INPUT_DIR:-/var/lib/asklake/replay-input}
      CONTINUOUS_RUNTIME_SYNC_INTERVAL_SECONDS: ${CONTINUOUS_RUNTIME_SYNC_INTERVAL_SECONDS:-5}
      ASKLAKE_CONTINUOUS_MAINTENANCE_LEASE_SECONDS: ${ASKLAKE_CONTINUOUS_MAINTENANCE_LEASE_SECONDS:-900}
      ASKLAKE_CONTINUOUS_FAIL_AFTER_DATA_WRITE_ONCE: ${ASKLAKE_CONTINUOUS_FAIL_AFTER_DATA_WRITE_ONCE:-false}
      ASKLAKE_SPARK_RUNNER: rest
      ASKLAKE_SPARK_REST_URL: http://spark-master:6066
      ASKLAKE_SPARK_SCRIPT_DIR: /opt/asklake/scripts
      ASKLAKE_SPARK_JOB_SCRIPT: /opt/asklake/scripts/spark_job_run.py
      ASKLAKE_SPARK_SOURCE_INSPECT_SCRIPT: /opt/asklake/scripts/spark_source_inspect_rest.py
      ASKLAKE_SPARK_CONTINUOUS_SCRIPT: /opt/asklake/scripts/kafka_continuous_stream.py
      ASKLAKE_SPARK_CONTINUOUS_MAINTENANCE_SCRIPT: /opt/asklake/scripts/kafka_continuous_maintenance.py
      ASKLAKE_SPARK_IVY_DIR: /var/lib/asklake/spark-ivy
      ASKLAKE_SPARK_IVY_RUNTIME_DIR: /var/lib/asklake/spark-ivy
      ASKLAKE_SPARK_LOCAL_OUTPUT_DIR: /var/lib/asklake/spark-output
      ASKLAKE_SPARK_OUTPUT_CONTAINER_DIR: /var/lib/asklake/spark-output
      ASKLAKE_SPARK_MASTER_URL: spark://spark-master:7077
      ASKLAKE_SPARK_DRIVER_CORES: ${ASKLAKE_SPARK_DRIVER_CORES:-1}
      ASKLAKE_SPARK_DRIVER_MEMORY: ${ASKLAKE_SPARK_DRIVER_MEMORY:-1g}
      ASKLAKE_SPARK_EXECUTOR_CORES: ${ASKLAKE_SPARK_EXECUTOR_CORES:-2}
      ASKLAKE_SPARK_EXECUTOR_MEMORY: ${ASKLAKE_SPARK_EXECUTOR_MEMORY:-4g}
      ASKLAKE_SPARK_CORES_MAX: ${ASKLAKE_SPARK_CORES_MAX:-2}
      ASKLAKE_SPARK_SQL_SHUFFLE_PARTITIONS: ${ASKLAKE_SPARK_SQL_SHUFFLE_PARTITIONS:-32}
      ASKLAKE_SPARK_HADOOP_AWS_PACKAGE: ${ASKLAKE_SPARK_HADOOP_AWS_PACKAGE:-org.apache.hadoop:hadoop-aws:3.4.1}
      ASKLAKE_SPARK_KAFKA_PACKAGE: ${ASKLAKE_SPARK_KAFKA_PACKAGE:-org.apache.spark:spark-sql-kafka-0-10_2.13:4.0.1}
      ASKLAKE_SPARK_OUTPUT_MODE: ${ASKLAKE_SPARK_OUTPUT_MODE:-s3a}
      ASKLAKE_SPARK_OUTPUT_BUCKET: ${ASKLAKE_SPARK_OUTPUT_BUCKET:?ASKLAKE_SPARK_OUTPUT_BUCKET is required}
      ASKLAKE_SPARK_OUTPUT_PREFIX: ${ASKLAKE_SPARK_OUTPUT_PREFIX:-asklake-output}
      ASKLAKE_SPARK_REPORT_DIR: /var/lib/asklake/spark-runs
      ASKLAKE_SPARK_REPORT_CONTAINER_DIR: /var/lib/asklake/spark-runs
      ASKLAKE_SPARK_RUN_ROW_LIMIT: ${ASKLAKE_SPARK_RUN_ROW_LIMIT:-0}
      ASKLAKE_SPARK_RUN_TIMEOUT_SECONDS: ${ASKLAKE_SPARK_RUN_TIMEOUT_SECONDS:-7200}
      ASKLAKE_SPARK_REST_POLL_INTERVAL_MS: ${ASKLAKE_SPARK_REST_POLL_INTERVAL_MS:-1000}
      ASKLAKE_CONTINUOUS_MAINTENANCE_TIMEOUT_MS: ${ASKLAKE_CONTINUOUS_MAINTENANCE_TIMEOUT_MS:-540000}
      ASKLAKE_SOURCE_INSPECT_TIMEOUT_MS: ${ASKLAKE_SOURCE_INSPECT_TIMEOUT_MS:-90000}
      ASKLAKE_LOCAL_SAMPLE_DIR: /var/lib/asklake/samples
      ASKLAKE_SAMPLE_CONTAINER_DIR: /var/lib/asklake/samples
      ASKLAKE_REVIEW_ANALYSIS_RUNTIME: ${ASKLAKE_REVIEW_ANALYSIS_RUNTIME:-local_llm}
      ASKLAKE_LOCAL_LLM_ENDPOINT: ${ASKLAKE_LOCAL_LLM_ENDPOINT_IN_DOCKER:-http://host.docker.internal:1234/v1/chat/completions}
      ASKLAKE_LOCAL_LLM_MODEL: ${ASKLAKE_LOCAL_LLM_MODEL:-local-review-analyzer}
      ASKLAKE_LOCAL_LLM_TIMEOUT_SECONDS: ${ASKLAKE_LOCAL_LLM_TIMEOUT_SECONDS:-120}
      ASKLAKE_LOCAL_LLM_MAX_INPUT_CHARS: ${ASKLAKE_LOCAL_LLM_MAX_INPUT_CHARS:-9000}
      ASKLAKE_REVIEW_TEXT_MODEL_HOST_DIR: /var/lib/asklake/review-text-models
      ASKLAKE_REVIEW_TEXT_MODEL_CONTAINER_DIR: /var/lib/asklake/review-text-models
      ASKLAKE_OBJECT_STORAGE_PROVIDER: ${ASKLAKE_OBJECT_STORAGE_PROVIDER:-aws}
      ASKLAKE_RAW_BUCKET: ${ASKLAKE_RAW_BUCKET:?ASKLAKE_RAW_BUCKET is required}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      S3_ALLOWED_BUCKETS: ${S3_ALLOWED_BUCKETS:?S3_ALLOWED_BUCKETS is required}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
    expose:
      - "8080"
    volumes:
      - lake_data:${LOCAL_LAKE_STORAGE_DIR:-/var/lib/asklake/lake}
      - ${ASKLAKE_HOST_DATA_DIR:-/var/lib/asklake}/spark-ivy:/var/lib/asklake/spark-ivy
      - ${ASKLAKE_HOST_DATA_DIR:-/var/lib/asklake}/spark-output:/var/lib/asklake/spark-output
      - ${ASKLAKE_HOST_DATA_DIR:-/var/lib/asklake}/spark-runs:/var/lib/asklake/spark-runs
      - ${ASKLAKE_HOST_DATA_DIR:-/var/lib/asklake}/samples:/var/lib/asklake/samples
      - ${ASKLAKE_HOST_DATA_DIR:-/var/lib/asklake}/review-text-models:/var/lib/asklake/review-text-models:ro
      - ${ASKLAKE_REPLAY_HOST_INPUT_DIR:-/var/lib/asklake/replay-input}:${ASKLAKE_REPLAY_INPUT_DIR:-/var/lib/asklake/replay-input}:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=5).read()\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  aws-s3-readiness:
    build:
      context: ../backend
      target: backend-runtime
    restart: "no"
    command: ["python", "scripts/verify-aws-s3-readiness.py"]
    environment:
      ASKLAKE_OBJECT_STORAGE_PROVIDER: ${ASKLAKE_OBJECT_STORAGE_PROVIDER:-aws}
      ASKLAKE_S3_READINESS_READ_BUCKETS: ${ASKLAKE_S3_READINESS_READ_BUCKETS:?ASKLAKE_S3_READINESS_READ_BUCKETS is required}
      ASKLAKE_S3_READINESS_WRITE_BUCKETS: ${ASKLAKE_S3_READINESS_WRITE_BUCKETS:?ASKLAKE_S3_READINESS_WRITE_BUCKETS is required}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}

  spark-dir-init:
    <<: *spark-runtime
    restart: "no"
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        for directory in \
          /var/lib/asklake/spark-ivy \
          /var/lib/asklake/spark-output \
          /var/lib/asklake/spark-runs \
          /var/lib/asklake/samples \
          /var/lib/asklake/review-text-models
        do
          mkdir -p "$$directory"
          chown -R 185:185 "$$directory"
          chmod -R u+rwX,g+rwX,o-rwx "$$directory"
        done
    volumes:
      - ${ASKLAKE_HOST_DATA_DIR:-/var/lib/asklake}/spark-ivy:/var/lib/asklake/spark-ivy
      - ${ASKLAKE_HOST_DATA_DIR:-/var/lib/asklake}/spark-output:/var/lib/asklake/spark-output
      - ${ASKLAKE_HOST_DATA_DIR:-/var/lib/asklake}/spark-runs:/var/lib/asklake/spark-runs
      - ${ASKLAKE_HOST_DATA_DIR:-/var/lib/asklake}/samples:/var/lib/asklake/samples
      - ${ASKLAKE_HOST_DATA_DIR:-/var/lib/asklake}/review-text-models:/var/lib/asklake/review-text-models

  spark-master:
    <<: *spark-runtime
    restart: unless-stopped
    depends_on:
      spark-dir-init:
        condition: service_completed_successfully
    user: "185:185"
    environment:
      HOME: /tmp
      SPARK_MASTER_OPTS: >-
        -Dspark.master.rest.enabled=true
        -Dspark.master.rest.host=0.0.0.0
        -Dspark.master.rest.port=6066
        -Dspark.deploy.defaultCores=${ASKLAKE_SPARK_CORES_MAX:-2}
        -Dspark.deploy.maxDrivers=${ASKLAKE_SPARK_MAX_DRIVERS:-2}
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    expose:
      - "6066"
      - "7077"
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ': </dev/tcp/127.0.0.1/6066'"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  spark-worker:
    <<: *spark-runtime
    restart: unless-stopped
    depends_on:
      spark-dir-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_healthy
    user: "185:185"
    environment:
      HOME: /tmp
      ASKLAKE_OBJECT_STORAGE_PROVIDER: ${ASKLAKE_OBJECT_STORAGE_PROVIDER:-aws}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      PYSPARK_DRIVER_PYTHON: /usr/bin/python3
      PYSPARK_PYTHON: /usr/bin/python3
      SPARK_WORKER_OPTS: >-
        -Dspark.worker.cleanup.enabled=true
        -Dspark.worker.cleanup.interval=1800
        -Dspark.worker.cleanup.appDataTtl=86400
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --cores
      - ${ASKLAKE_SPARK_WORKER_CORES:-4}
      - --memory
      - ${ASKLAKE_SPARK_WORKER_MEMORY:-10g}
      - --webui-port
      - "8081"
      - --work-dir
      - /opt/spark/work-dir
    expose:
      - "8081"
    volumes:
      - ${ASKLAKE_HOST_DATA_DIR:-/var/lib/asklake}/spark-ivy:/var/lib/asklake/spark-ivy
      - ${ASKLAKE_HOST_DATA_DIR:-/var/lib/asklake}/spark-output:/var/lib/asklake/spark-output
      - ${ASKLAKE_HOST_DATA_DIR:-/var/lib/asklake}/spark-runs:/var/lib/asklake/spark-runs
      - ${ASKLAKE_HOST_DATA_DIR:-/var/lib/asklake}/samples:/var/lib/asklake/samples:ro
      - ${ASKLAKE_HOST_DATA_DIR:-/var/lib/asklake}/review-text-models:/var/lib/asklake/review-text-models:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c ': </dev/tcp/127.0.0.1/8081'"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  airflow-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AIRFLOW_METADATA_DB_NAME:-airflow}
      POSTGRES_USER: ${AIRFLOW_METADATA_DB_USER:-airflow}
      POSTGRES_PASSWORD: ${AIRFLOW_METADATA_DB_PASSWORD:?AIRFLOW_METADATA_DB_PASSWORD is required}
    expose:
      - "5432"
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 12

  airflow-init:
    <<: *airflow-common
    restart: "no"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/{logs,dags,plugins,config}
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/{logs,dags,plugins,config}
        /entrypoint airflow version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_PASSWORD:?AIRFLOW_PASSWORD is required}
    user: "0:0"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 30s
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob"]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 30s
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob"]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 30s
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 12

  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-asklake_sources}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?MONGO_INITDB_ROOT_USERNAME is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?MONGO_INITDB_ROOT_PASSWORD is required}
    expose:
      - "27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username \"$${MONGO_INITDB_ROOT_USERNAME}\" --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  redpanda:
    image: redpandadata/redpanda:v24.3.1
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - internal://0.0.0.0:9092
      - --advertise-kafka-addr
      - internal://redpanda:9092
    expose:
      - "9092"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --api-urls localhost:9644 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  airflow_postgres_data:
  mongo_data:
  redpanda_data:
  lake_data:
