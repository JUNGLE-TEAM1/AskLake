services:
  frontend:
    build:
      args:
        # The browser cannot resolve Compose service names. Keep browser calls
        # same-origin and let frontend nginx forward /api/* to FastAPI.
        VITE_API_BASE_URL: ""
        VITE_DASHBOARD_ASSISTANT_API_PATH: "/api/dashboards/assistant"
        # The local stack uses the MinIO service attached to asklake_default.
        # Do not inherit the production AWS default into the browser bundle.
        VITE_OBJECT_STORAGE_PROVIDER: "minio"
        VITE_S3_REGION: "us-east-1"
    ports:
      - "127.0.0.1:${ASKLAKE_FRONTEND_HOST_PORT:-5173}:80"

  backend:
    ports:
      - "127.0.0.1:${ASKLAKE_BACKEND_HOST_PORT:-18080}:8080"
    environment:
      AUTH_SESSION_COOKIE_SECURE: "false"
      ASKLAKE_OBJECT_STORAGE_PROVIDER: "minio"
      ASKLAKE_RAW_BUCKET: ${ASKLAKE_LOCAL_RAW_BUCKET:-m3-raw}
      ASKLAKE_SOURCE_DEFAULT_S3_BUCKET: ${ASKLAKE_LOCAL_SOURCE_DEFAULT_S3_BUCKET:-m3-raw}
      S3_ALLOWED_BUCKETS: ${ASKLAKE_LOCAL_S3_ALLOWED_BUCKETS:-m3-raw,asklake-output,asklake-query-results}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID is required for local object storage}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY is required for local object storage}
      MINIO_ACCESS_KEY: ${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID is required for local object storage}
      MINIO_ENDPOINT: "http://minio:9000"
      MINIO_ENDPOINT_IN_DOCKER: "http://minio:9000"
      MINIO_REGION: "us-east-1"
      MINIO_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY is required for local object storage}
      S3_FORCE_PATH_STYLE: "true"
      # Local Trino is plain HTTP on the private Compose network. Do not inherit
      # production Basic-auth credentials into this explicit local override.
      TRINO_AUTH_USERNAME: ""
      TRINO_AUTH_PASSWORD: ""
      TRINO_MATERIALIZER_USERNAME: ""
      TRINO_MATERIALIZER_PASSWORD: ""

  airflow-apiserver:
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID is required for local object storage}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY is required for local object storage}

  airflow-scheduler:
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID is required for local object storage}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY is required for local object storage}

  airflow-dag-processor:
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID is required for local object storage}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY is required for local object storage}

  spark-worker:
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID is required for local object storage}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY is required for local object storage}

  trino-result-collector:
    environment:
      ASKLAKE_OBJECT_STORAGE_PROVIDER: "minio"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID is required for local object storage}
      AWS_REGION: "us-east-1"
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY is required for local object storage}
      MINIO_ACCESS_KEY: ${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID is required for local object storage}
      MINIO_ENDPOINT: "http://minio:9000"
      MINIO_REGION: "us-east-1"
      MINIO_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY is required for local object storage}
      S3_ENDPOINT: "http://minio:9000"
      S3_FORCE_PATH_STYLE: "true"
      TRINO_AUTH_PASSWORD: ""
      TRINO_AUTH_USERNAME: ""
      TRINO_MATERIALIZER_PASSWORD: ""
      TRINO_MATERIALIZER_USERNAME: ""
      TRINO_RESULT_STORAGE_BUCKET: "asklake-query-results"

  trino-result-cleanup:
    environment:
      ASKLAKE_OBJECT_STORAGE_PROVIDER: "minio"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID is required for local object storage}
      AWS_REGION: "us-east-1"
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY is required for local object storage}
      MINIO_ACCESS_KEY: ${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID is required for local object storage}
      MINIO_ENDPOINT: "http://minio:9000"
      MINIO_REGION: "us-east-1"
      MINIO_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY is required for local object storage}
      S3_ENDPOINT: "http://minio:9000"
      S3_FORCE_PATH_STYLE: "true"
      TRINO_AUTH_PASSWORD: ""
      TRINO_AUTH_USERNAME: ""
      TRINO_MATERIALIZER_PASSWORD: ""
      TRINO_MATERIALIZER_USERNAME: ""
      TRINO_RESULT_STORAGE_BUCKET: "asklake-query-results"
