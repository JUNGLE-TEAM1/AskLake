x-local-object-storage-env: &local-object-storage-env
  ASKLAKE_OBJECT_STORAGE_PROVIDER: "minio"
  ASKLAKE_RAW_BUCKET: ${ASKLAKE_LOCAL_RAW_BUCKET:-m3-raw}
  ASKLAKE_SPARK_OUTPUT_BUCKET: ${ASKLAKE_LOCAL_OUTPUT_BUCKET:-asklake-output}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID is required for local object storage}
  AWS_REGION: "us-east-1"
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY is required for local object storage}
  MINIO_ACCESS_KEY: ${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID is required for local object storage}
  MINIO_ENDPOINT: "http://minio:9000"
  MINIO_ENDPOINT_IN_DOCKER: "http://minio:9000"
  MINIO_REGION: "us-east-1"
  MINIO_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY is required for local object storage}
  S3_ENDPOINT: "http://minio:9000"
  S3_FORCE_PATH_STYLE: "true"

x-local-app-runtime-env: &local-app-runtime-env
  <<: *local-object-storage-env
  APP_ENV: "local"
  BOOTSTRAP_ADMIN_EMAIL: "codex.test@asklake.local"
  BOOTSTRAP_ADMIN_PASSWORD: "AskLake-Codex-Local-2026!"
  CLICKHOUSE_REALTIME_CONSUMER_OWNER: "disabled"
  CLICKHOUSE_REALTIME_V2_ENABLED: "false"
  KAFKA_CONNECT_SINK_ENABLED: "false"
  OPENSEARCH_PASSWORD: ${ASKLAKE_LOCAL_OPENSEARCH_PASSWORD:-AskLake-Local-OpenSearch-2026!}
  TRINO_AUTH_PASSWORD: ""
  TRINO_AUTH_USERNAME: ""
  TRINO_BASE_URL: "http://trino:8080"
  TRINO_ICEBERG_WAREHOUSE_BUCKET: "asklake-warehouse"
  TRINO_MATERIALIZER_PASSWORD: ""
  TRINO_MATERIALIZER_USERNAME: ""
  TRINO_RESULT_STORAGE_AUTO_CREATE_BUCKET: "true"
  TRINO_RESULT_STORAGE_BUCKET: "asklake-query-results"

services:
  frontend:
    build:
      args:
        # The browser cannot resolve Compose service names. Keep browser calls
        # same-origin and let frontend nginx forward /api/* to FastAPI.
        VITE_API_BASE_URL: ""
        VITE_DASHBOARD_ASSISTANT_API_PATH: "/api/dashboards/assistant"
        # The local stack uses the MinIO service attached to asklake_default.
        # Do not inherit the production AWS default into the browser bundle.
        VITE_OBJECT_STORAGE_PROVIDER: "minio"
        VITE_S3_REGION: "us-east-1"
        VITE_SPARK_OUTPUT_BUCKET: ${ASKLAKE_LOCAL_OUTPUT_BUCKET:-asklake-output}
    ports:
      - "127.0.0.1:${ASKLAKE_FRONTEND_HOST_PORT:-5173}:80"

  backend:
    ports:
      - "127.0.0.1:${ASKLAKE_BACKEND_HOST_PORT:-18080}:8080"
    environment:
      <<: *local-app-runtime-env
      AUTH_PUBLIC_SIGNUP_ENABLED: "true"
      AUTH_SESSION_COOKIE_SECURE: "false"
      ASKLAKE_SOURCE_DEFAULT_S3_BUCKET: ${ASKLAKE_LOCAL_SOURCE_DEFAULT_S3_BUCKET:-m3-raw}
      S3_ALLOWED_BUCKETS: ${ASKLAKE_LOCAL_S3_ALLOWED_BUCKETS:-m3-raw,asklake-output,asklake-query-results}
      # Local Trino is plain HTTP on the private Compose network. Do not inherit
      # production Basic-auth credentials into this explicit local override.
      TRINO_AUTH_USERNAME: ""
      TRINO_AUTH_PASSWORD: ""
      TRINO_MATERIALIZER_USERNAME: ""
      TRINO_MATERIALIZER_PASSWORD: ""

  airflow-apiserver:
    environment:
      <<: *local-object-storage-env
      ASKLAKE_SPARK_ICEBERG_WAREHOUSE: "s3a://asklake-warehouse/warehouse"

  airflow-scheduler:
    environment:
      <<: *local-object-storage-env
      ASKLAKE_SPARK_ICEBERG_WAREHOUSE: "s3a://asklake-warehouse/warehouse"

  airflow-dag-processor:
    environment:
      <<: *local-object-storage-env
      ASKLAKE_SPARK_ICEBERG_WAREHOUSE: "s3a://asklake-warehouse/warehouse"

  spark-worker:
    environment:
      <<: *local-object-storage-env

  opensearch:
    environment:
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${ASKLAKE_LOCAL_OPENSEARCH_PASSWORD:-AskLake-Local-OpenSearch-2026!}

  embedding-worker:
    environment:
      OPENSEARCH_PASSWORD: ${ASKLAKE_LOCAL_OPENSEARCH_PASSWORD:-AskLake-Local-OpenSearch-2026!}

  continuous-worker:
    environment:
      <<: *local-app-runtime-env

  rag-artifact-cleanup:
    environment:
      <<: *local-app-runtime-env

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY is required for local object storage}
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID is required for local object storage}
    ports:
      - "127.0.0.1:${ASKLAKE_MINIO_HOST_PORT:-9000}:9000"
      - "127.0.0.1:${ASKLAKE_MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - local_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - default
      - trino_egress

  aws-s3-readiness:
    environment:
      <<: *local-object-storage-env
      ASKLAKE_S3_READINESS_READ_BUCKETS: ${ASKLAKE_LOCAL_S3_READINESS_BUCKETS:-m3-raw,asklake-output,asklake-warehouse,asklake-query-results}
      ASKLAKE_S3_READINESS_WRITE_BUCKETS: ${ASKLAKE_LOCAL_S3_READINESS_BUCKETS:-m3-raw,asklake-output,asklake-warehouse,asklake-query-results}
    depends_on:
      minio:
        condition: service_healthy

  trino:
    environment:
      CATALOG_MANAGEMENT: "static"
      TRINO_ICEBERG_WAREHOUSE_BUCKET: "asklake-warehouse"
      TRINO_S3_ACCESS_KEY: ${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID is required for local object storage}
      TRINO_S3_ENDPOINT: "http://minio:9000"
      TRINO_S3_REGION: "us-east-1"
      TRINO_S3_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY is required for local object storage}
    ports:
      - "127.0.0.1:${ASKLAKE_TRINO_HOST_PORT:-8088}:8080"
    volumes:
      - ./trino/etc/config.local.properties:/etc/trino/config.properties:ro
      - ./trino/etc/catalog:/etc/trino/catalog:ro
    depends_on:
      aws-s3-readiness:
        condition: service_completed_successfully
      trino-postgres-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/v1/info >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  trino-result-collector:
    environment:
      <<: *local-app-runtime-env
      TRINO_AUTH_PASSWORD: ""
      TRINO_AUTH_USERNAME: ""
      TRINO_MATERIALIZER_PASSWORD: ""
      TRINO_MATERIALIZER_USERNAME: ""
      TRINO_BASE_URL: "http://trino:8080"
      TRINO_RESULT_STORAGE_AUTO_CREATE_BUCKET: "true"
      TRINO_RESULT_STORAGE_BUCKET: "asklake-query-results"

  trino-result-cleanup:
    environment:
      <<: *local-app-runtime-env
      TRINO_AUTH_PASSWORD: ""
      TRINO_AUTH_USERNAME: ""
      TRINO_MATERIALIZER_PASSWORD: ""
      TRINO_MATERIALIZER_USERNAME: ""
      TRINO_BASE_URL: "http://trino:8080"
      TRINO_RESULT_STORAGE_AUTO_CREATE_BUCKET: "true"
      TRINO_RESULT_STORAGE_BUCKET: "asklake-query-results"

volumes:
  local_minio_data:
    name: asklake_minio_data
